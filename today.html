<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Today's Events</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: transparent;

    color: #37352f;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
}

body {
    padding: 12px;
}


/* =====================================================
   MAIN ROUNDED CONTAINER
===================================================== */

.widget-container {

    width: 100%;

    background: #ffffff;

    border: 1px solid #e9e9e7;

    border-radius: 14px;

    overflow: hidden;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    padding: 20px 22px 17px;
}

.title {

    font-size: 26px;

    font-weight: 600;

    letter-spacing: -0.4px;

    line-height: 1.2;

    color: #37352f;
}

.date {

    margin-top: 5px;

    font-size: 13px;

    color: #9b9a97;
}


/* =====================================================
   EVENTS
===================================================== */

.events {

    width: 100%;

    border-top: 1px solid #e9e9e7;
}


/* =====================================================
   INDIVIDUAL EVENT
===================================================== */

.event {

    position: relative;

    display: grid;

    grid-template-columns:
        92px
        18px
        minmax(0, 1fr);

    align-items: center;

    min-height: 66px;

    padding: 10px 22px;

    border-bottom: 1px solid #e9e9e7;

    background: #ffffff;

    transition:
        background 0.15s ease;
}


/*
Remove divider from final event
*/

.event:last-child {

    border-bottom: none;
}


/*
Subtle hover
*/

.event:hover {

    background: #fafaf9;
}


/* =====================================================
   TIME
===================================================== */

.time-column {

    font-size: 12px;

    line-height: 1.35;

    color: #787774;
}

.start-time {

    color: #37352f;

    font-weight: 500;
}

.end-time {

    margin-top: 2px;

    color: #9b9a97;
}


/* =====================================================
   CALENDAR COLOR DOT
===================================================== */

.dot-column {

    display: flex;

    align-items: center;

    justify-content: flex-start;
}

.calendar-dot {

    width: 8px;

    height: 8px;

    border-radius: 50%;

    flex-shrink: 0;
}


/* =====================================================
   EVENT INFORMATION
===================================================== */

.event-content {

    min-width: 0;
}

.event-title {

    display: flex;

    align-items: center;

    min-width: 0;

    font-size: 14px;

    font-weight: 500;

    color: #37352f;
}

.event-title-text {

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.event-meta {

    margin-top: 4px;

    display: flex;

    align-items: center;

    gap: 6px;

    min-width: 0;

    font-size: 11px;

    color: #9b9a97;
}

.calendar-name {

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =====================================================
   ALL-DAY EVENT
===================================================== */

.all-day {

    color: #787774;

    font-weight: 500;
}


/* =====================================================
   CURRENT EVENT
===================================================== */

.event.current {

    background: #fafaf9;
}

.now {

    display: inline-flex;

    align-items: center;

    flex-shrink: 0;

    margin-left: 8px;

    color: #eb5757;

    font-size: 10px;

    font-weight: 600;

    letter-spacing: 0.3px;
}

.now-dot {

    width: 6px;

    height: 6px;

    margin-right: 4px;

    border-radius: 50%;

    background: #eb5757;
}


/* =====================================================
   LOADING / EMPTY / ERROR
===================================================== */

.status {

    padding: 38px 20px;

    border-top: 1px solid #e9e9e7;

    text-align: center;

    color: #9b9a97;

    font-size: 13px;
}

.error {

    color: #eb5757;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 500px) {

    body {

        padding: 8px;
    }


    .header {

        padding:
            17px
            17px
            14px;
    }


    .title {

        font-size: 22px;
    }


    .event {

        grid-template-columns:
            76px
            16px
            minmax(0, 1fr);

        padding:
            9px
            17px;
    }

}

</style>

</head>


<body>


<div class="widget-container">


    <!-- =================================================
         HEADER
    ================================================== -->

    <div class="header">

        <div class="title">
            Today's Events
        </div>


        <div
            id="todayDate"
            class="date"
        ></div>

    </div>



    <!-- =================================================
         LOADING / EMPTY STATUS
    ================================================== -->

    <div
        id="status"
        class="status"
    >
        Loading today's events…
    </div>



    <!-- =================================================
         EVENTS
    ================================================== -->

    <div
        id="events"
        class="events"
        style="display:none;"
    ></div>


</div>



<script>

/* =====================================================
   CLOUDFLARE BACKEND
===================================================== */

const API_URL =
    "https://notion-calendar-api.nourmohsen12223.workers.dev/events";



/* =====================================================
   TODAY'S DATE
===================================================== */

const today =
    new Date();


document.getElementById(
    "todayDate"
).textContent =

    today.toLocaleDateString(
        "en-US",
        {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        }
    );



/* =====================================================
   LOAD TODAY'S EVENTS
===================================================== */

async function loadToday() {


    const status =
        document.getElementById(
            "status"
        );


    const container =
        document.getElementById(
            "events"
        );


    /* Start of today */

    const start =
        new Date();


    start.setHours(
        0,
        0,
        0,
        0
    );


    /* Start of tomorrow */

    const end =
        new Date(
            start
        );


    end.setDate(
        end.getDate() + 1
    );


    try {


        const url =
            new URL(
                API_URL
            );


        url.searchParams.set(
            "timeMin",
            start.toISOString()
        );


        url.searchParams.set(
            "timeMax",
            end.toISOString()
        );


        const response =
            await fetch(
                url.toString()
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to load events."
            );

        }


        const events =
            data.events || [];


        /* ---------------------------------------------
           NO EVENTS
        --------------------------------------------- */

        if (
            events.length === 0
        ) {


            container.style.display =
                "none";


            status.style.display =
                "block";


            status.className =
                "status";


            status.textContent =
                "No events today.";


            return;

        }


        /* ---------------------------------------------
           EVENTS FOUND
        --------------------------------------------- */

        status.style.display =
            "none";


        container.style.display =
            "block";


        renderEvents(
            events
        );


    }

    catch (error) {


        console.error(
            error
        );


        container.style.display =
            "none";


        status.style.display =
            "block";


        status.className =
            "status error";


        status.textContent =
            "Unable to load today's events.";


    }

}



/* =====================================================
   RENDER EVENTS
===================================================== */

function renderEvents(
    events
) {


    const container =
        document.getElementById(
            "events"
        );


    container.innerHTML =
        "";


    events.forEach(
        event => {


            /* =========================================
               EVENT ROW
            ========================================= */

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "event";


            let isCurrent =
                false;



            /* =========================================
               CHECK IF EVENT IS HAPPENING NOW
            ========================================= */

            if (
                event.start?.dateTime &&
                event.end?.dateTime
            ) {


                const now =
                    new Date();


                const eventStart =
                    new Date(
                        event.start.dateTime
                    );


                const eventEnd =
                    new Date(
                        event.end.dateTime
                    );


                if (
                    now >= eventStart &&
                    now < eventEnd
                ) {


                    isCurrent =
                        true;


                    card.classList.add(
                        "current"
                    );


                }

            }



            /* =========================================
               TIME COLUMN
            ========================================= */

            const timeColumn =
                document.createElement(
                    "div"
                );


            timeColumn.className =
                "time-column";


            if (
                event.start?.dateTime
            ) {


                const startTime =
                    new Date(
                        event.start.dateTime
                    );


                const endTime =
                    event.end?.dateTime
                        ?
                        new Date(
                            event.end.dateTime
                        )
                        :
                        null;



                /* START TIME */

                const startDiv =
                    document.createElement(
                        "div"
                    );


                startDiv.className =
                    "start-time";


                startDiv.textContent =
                    formatTime(
                        startTime
                    );


                timeColumn.appendChild(
                    startDiv
                );



                /* END TIME */

                if (
                    endTime
                ) {


                    const endDiv =
                        document.createElement(
                            "div"
                        );


                    endDiv.className =
                        "end-time";


                    endDiv.textContent =
                        formatTime(
                            endTime
                        );


                    timeColumn.appendChild(
                        endDiv
                    );


                }


            }

            else {


                /* ALL-DAY EVENT */

                const allDay =
                    document.createElement(
                        "div"
                    );


                allDay.className =
                    "all-day";


                allDay.textContent =
                    "All day";


                timeColumn.appendChild(
                    allDay
                );


            }



            /* =========================================
               CALENDAR COLOR DOT
            ========================================= */

            const dotColumn =
                document.createElement(
                    "div"
                );


            dotColumn.className =
                "dot-column";


            const dot =
                document.createElement(
                    "div"
                );


            dot.className =
                "calendar-dot";


            dot.style.backgroundColor =
                event.calendarColor ||
                "#9b9a97";


            dotColumn.appendChild(
                dot
            );



            /* =========================================
               EVENT CONTENT
            ========================================= */

            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "event-content";



            /* =========================================
               EVENT TITLE
            ========================================= */

            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "event-title";


            const titleText =
                document.createElement(
                    "span"
                );


            titleText.className =
                "event-title-text";


            titleText.textContent =
                event.summary ||
                "Event";


            title.appendChild(
                titleText
            );



            /* =========================================
               NOW INDICATOR
            ========================================= */

            if (
                isCurrent
            ) {


                const now =
                    document.createElement(
                        "span"
                    );


                now.className =
                    "now";


                const nowDot =
                    document.createElement(
                        "span"
                    );


                nowDot.className =
                    "now-dot";


                now.appendChild(
                    nowDot
                );


                now.appendChild(
                    document.createTextNode(
                        "NOW"
                    )
                );


                title.appendChild(
                    now
                );


            }



            /* =========================================
               CALENDAR NAME
            ========================================= */

            const meta =
                document.createElement(
                    "div"
                );


            meta.className =
                "event-meta";


            if (
                event.calendarName
            ) {


                const calendarName =
                    document.createElement(
                        "span"
                    );


                calendarName.className =
                    "calendar-name";


                calendarName.textContent =
                    event.calendarName;


                meta.appendChild(
                    calendarName
                );


            }



            /* =========================================
               BUILD CONTENT
            ========================================= */

            content.appendChild(
                title
            );


            if (
                event.calendarName
            ) {


                content.appendChild(
                    meta
                );


            }



            /* =========================================
               BUILD EVENT ROW
            ========================================= */

            card.appendChild(
                timeColumn
            );


            card.appendChild(
                dotColumn
            );


            card.appendChild(
                content
            );


            container.appendChild(
                card
            );


        }
    );

}



/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(
    date
) {


    return date.toLocaleTimeString(
        [],
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );


}



/* =====================================================
   START AUTOMATICALLY
===================================================== */

loadToday();

</script>


</body>

</html>
