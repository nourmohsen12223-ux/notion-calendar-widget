<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flip Clock</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;

    background: transparent;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
}

body {
    padding: 8px;
}


/* =====================================================
   CLOCK
===================================================== */

.flip-clock {
    width: 100%;
    max-width: 520px;

    margin: 0 auto;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 4px;
}


/* =====================================================
   CARD
===================================================== */

.flip-card {
    position: relative;

    height: 310px;

    overflow: hidden;

    background: #F3F1ED;

    border: 1px solid #EEECE7;
    border-radius: 22px;

    box-shadow:
        0 2px 10px rgba(55, 53, 47, 0.04);
}


/* =====================================================
   NUMBER
===================================================== */

.number {
    position: absolute;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding-bottom: 15px;

    color: #98938F;

    font-family:
        "Arial Narrow",
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size: clamp(110px, 28vw, 205px);
    font-weight: 800;

    line-height: 1;

    letter-spacing: -10px;

    font-stretch: condensed;

    transform-origin: center center;

    user-select: none;
}


/* =====================================================
   CENTER FLIP LINE
===================================================== */

.flip-line {
    position: absolute;

    left: 0;
    right: 0;
    top: 50%;

    z-index: 5;

    height: 1px;

    background: rgba(255,255,255,0.42);

    box-shadow:
        0 1px 1px rgba(120,115,110,0.08);

    pointer-events: none;
}


/* =====================================================
   BOTTOM LABELS
===================================================== */

.bottom-label {
    position: absolute;

    bottom: 16px;

    z-index: 6;

    color: #77736F;

    font-family:
        "Arial Narrow",
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size: 17px;
    font-weight: 800;

    letter-spacing: -0.5px;

    text-transform: uppercase;
}

.period {
    left: 14px;
}

.weekday {
    right: 14px;
}


/* =====================================================
   FLIP ANIMATION
===================================================== */

.flip-card.flipping .number {
    animation:
        flipNumber 0.48s
        cubic-bezier(.45,.05,.55,.95);
}

@keyframes flipNumber {

    0% {
        transform:
            perspective(700px)
            rotateX(0deg);
    }

    45% {
        transform:
            perspective(700px)
            rotateX(-8deg)
            scaleY(0.97);

        opacity: 0.75;
    }

    55% {
        transform:
            perspective(700px)
            rotateX(8deg)
            scaleY(0.97);

        opacity: 0.75;
    }

    100% {
        transform:
            perspective(700px)
            rotateX(0deg);

        opacity: 1;
    }

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 500px) {

    body {
        padding: 5px;
    }

    .flip-clock {
        gap: 3px;
    }

    .flip-card {
        height: 230px;

        border-radius: 17px;
    }

    .number {
        font-size: clamp(90px, 34vw, 150px);

        letter-spacing: -7px;
    }

    .bottom-label {
        bottom: 12px;

        font-size: 13px;
    }

    .period {
        left: 11px;
    }

    .weekday {
        right: 11px;
    }

}


@media (max-width: 350px) {

    .flip-card {
        height: 190px;
    }

    .number {
        font-size: 95px;
    }

    .bottom-label {
        font-size: 11px;
    }

}

</style>

</head>


<body>


<div class="flip-clock">


    <!-- HOURS -->

    <div
        id="hourCard"
        class="flip-card"
    >

        <div
            id="hours"
            class="number"
        >
            04
        </div>


        <div class="flip-line"></div>


        <div
            id="period"
            class="bottom-label period"
        >
            PM
        </div>

    </div>



    <!-- MINUTES -->

    <div
        id="minuteCard"
        class="flip-card"
    >

        <div
            id="minutes"
            class="number"
        >
            36
        </div>


        <div class="flip-line"></div>


        <div
            id="weekday"
            class="bottom-label weekday"
        >
            TUESDAY
        </div>

    </div>


</div>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const hoursElement =
    document.getElementById(
        "hours"
    );


const minutesElement =
    document.getElementById(
        "minutes"
    );


const periodElement =
    document.getElementById(
        "period"
    );


const weekdayElement =
    document.getElementById(
        "weekday"
    );


const hourCard =
    document.getElementById(
        "hourCard"
    );


const minuteCard =
    document.getElementById(
        "minuteCard"
    );



/* =====================================================
   PREVIOUS VALUES
===================================================== */

let previousHour = null;

let previousMinute = null;



/* =====================================================
   FLIP
===================================================== */

function triggerFlip(card) {

    card.classList.remove(
        "flipping"
    );


    void card.offsetWidth;


    card.classList.add(
        "flipping"
    );


    setTimeout(
        () => {

            card.classList.remove(
                "flipping"
            );

        },
        500
    );

}



/* =====================================================
   UPDATE CLOCK
===================================================== */

function updateClock() {

    const now =
        new Date();


    let hours =
        now.getHours();


    const minutes =
        now.getMinutes();


    const period =
        hours >= 12
            ? "PM"
            : "AM";


    /* 12 HOUR FORMAT */

    hours =
        hours % 12;


    if (
        hours === 0
    ) {

        hours = 12;

    }


    const hourText =
        String(
            hours
        ).padStart(
            2,
            "0"
        );


    const minuteText =
        String(
            minutes
        ).padStart(
            2,
            "0"
        );


    /* WEEKDAY */

    const weekday =
        now.toLocaleDateString(
            "en-US",
            {
                weekday: "long"
            }
        ).toUpperCase();


    /* HOURS */

    if (
        previousHour !== null &&
        previousHour !== hourText
    ) {

        triggerFlip(
            hourCard
        );

    }


    /* MINUTES */

    if (
        previousMinute !== null &&
        previousMinute !== minuteText
    ) {

        triggerFlip(
            minuteCard
        );

    }


    hoursElement.textContent =
        hourText;


    minutesElement.textContent =
        minuteText;


    periodElement.textContent =
        period;


    weekdayElement.textContent =
        weekday;


    previousHour =
        hourText;


    previousMinute =
        minuteText;

}



/* =====================================================
   START
===================================================== */

updateClock();


/*
Update every second so the minute
changes immediately when needed.
*/

setInterval(
    updateClock,
    1000
);

</script>


</body>

</html>
