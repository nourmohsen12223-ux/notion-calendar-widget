<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tutoring Calendar</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --card: #FFFFFF;
  --text: #37352F;
  --soft: #6F6A64;
  --muted: #98938D;

  --border: #E5E1DB;
  --grid: #ECE9E4;

  --today: #D8D2CA;

  --time-width: 54px;

  --lesson1: #E8E4DE;
  --lesson2: #E2DFDA;
  --lesson3: #DDD8D1;
  --lesson4: #EEEAE4;
  --lesson5: #E7E7E3;
}

html,
body {
  width: 100%;
  margin: 0;
  padding: 0;

  background: transparent;

  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  overflow-x: hidden;
}


/* ==========================================
   MAIN
========================================== */

.dashboard {
  width: 100%;

  display: grid;

  grid-template-columns:
    minmax(0, 2.55fr)
    minmax(275px, 1fr);

  gap: 14px;

  align-items: start;
}


.panel {
  background: var(--card);

  border: 1px solid var(--border);

  border-radius: 17px;
}


/* ==========================================
   CALENDAR
========================================== */

.calendar-panel {
  min-width: 0;

  padding: 16px;
}


/* ==========================================
   CALENDAR TOP
========================================== */

.calendar-header {
  min-height: 42px;

  margin-bottom: 10px;

  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 15px;
}


.month-label {
  color: #332F2B;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 21px;
  font-weight: 600;

  line-height: 1;
}


.controls {
  display: flex;

  align-items: center;

  gap: 4px;
}


.control {
  height: 30px;

  padding: 0 10px;

  display: flex;

  align-items: center;
  justify-content: center;

  border: 1px solid var(--border);

  border-radius: 8px;

  background: #FFFFFF;

  color: var(--soft);

  font-family: inherit;

  font-size: 10px;

  cursor: pointer;
}


.control:hover {
  background: #F6F4F1;
}


.arrow {
  width: 29px;

  padding: 0;

  border-color: transparent;

  background: transparent;

  font-size: 17px;
}


/* ==========================================
   CALENDAR WRAPPER
========================================== */

.calendar-shell {
  width: 100%;

  overflow: hidden;

  border: 1px solid var(--border);

  border-radius: 11px;
}


/*
  IMPORTANT:

  Header and body now use the SAME
  minimum width and EXACT SAME columns.

  This fixes the misaligned vertical lines.
*/

.calendar-inner {
  width: 100%;

  min-width: 700px;
}


/* ==========================================
   WEEK HEADER
========================================== */

.week-header {
  width: 100%;

  display: grid;

  grid-template-columns:
    var(--time-width)
    repeat(7, minmax(0, 1fr));

  background: #FBFAF8;

  border-bottom: 1px solid var(--border);
}


.header-spacer {
  border-right: 1px solid var(--border);
}


.day-header {
  min-width: 0;

  height: 52px;

  padding: 7px 3px;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  border-right: 1px solid var(--border);
}


.day-header:last-child {
  border-right: none;
}


.day-name {
  color: #77726C;

  font-size: 8px;
  font-weight: 650;

  letter-spacing: 0.65px;
}


.day-number {
  width: 24px;
  height: 24px;

  margin-top: 2px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  color: #48443F;

  font-size: 12px;
  font-weight: 500;
}


.day-header.today {
  background: #F5F3F0;
}


.day-header.today .day-number {
  background: var(--today);

  color: #403C37;

  font-weight: 650;
}


/* ==========================================
   BODY
========================================== */

.calendar-scroll {
  width: 100%;

  overflow-x: auto;

  overflow-y: hidden;

  scrollbar-width: thin;
}


.calendar-grid {
  width: 100%;

  display: grid;

  grid-template-columns:
    var(--time-width)
    repeat(7, minmax(0, 1fr));
}


/* ==========================================
   TIME COLUMN
========================================== */

.time-column {
  position: relative;

  background: #FFFFFF;

  border-right: 1px solid var(--border);
}


.time-label {
  position: absolute;

  right: 8px;

  transform: translateY(-50%);

  color: #918C86;

  font-size: 8px;

  line-height: 1;

  white-space: nowrap;
}


/*
  First and last labels are pulled slightly
  inward so 5 PM and 5 AM cannot be clipped.
*/

.time-label.first {
  transform: translateY(5px);
}


.time-label.last {
  transform: translateY(calc(-100% - 5px));
}


/* ==========================================
   DAY COLUMN
========================================== */

.day-column {
  position: relative;

  min-width: 0;

  background: #FFFFFF;

  border-right: 1px solid var(--border);
}


.day-column:last-child {
  border-right: none;
}


.day-column.today {
  background: #FCFBFA;
}


.hour-line {
  position: absolute;

  left: 0;
  right: 0;

  height: 1px;

  background: var(--grid);

  pointer-events: none;
}


/* ==========================================
   LESSON
========================================== */

.lesson {
  position: absolute;

  left: 4px;
  right: 4px;

  z-index: 2;

  padding: 5px 7px;

  overflow: hidden;

  border-radius: 7px;

  border-left:
    3px solid rgba(65, 61, 56, 0.16);

  cursor: pointer;

  transition:
    transform 0.12s ease,
    box-shadow 0.12s ease;
}


.lesson:hover {
  z-index: 5;

  transform: translateY(-1px);

  box-shadow:
    0 4px 11px
    rgba(55, 53, 47, 0.09);
}


.lesson-name {
  color: #37332F;

  font-size: 9.5px;
  font-weight: 650;

  line-height: 1.1;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


.lesson-time {
  margin-top: 2px;

  color: #716C66;

  font-size: 7.5px;

  line-height: 1.1;

  white-space: nowrap;
}


.lesson-subject {
  margin-top: 2px;

  color: #5D5852;

  font-size: 7.5px;

  line-height: 1.1;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


/* ==========================================
   SIDEBAR
========================================== */

.sidebar {
  min-width: 0;

  display: flex;

  flex-direction: column;

  gap: 14px;
}


.sidebar-panel {
  padding: 19px;

  min-height: 170px;
}


.sidebar-header {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 10px;

  margin-bottom: 9px;
}


.sidebar-title {
  margin: 0;

  color: #302D29;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 18px;
  font-weight: 600;
}


.sidebar-note {
  color: #AAA59E;

  font-size: 8px;

  white-space: nowrap;
}


/* ==========================================
   UPCOMING ITEMS
========================================== */

.list-item {
  display: flex;

  align-items: center;

  gap: 11px;

  padding: 12px 0;

  border-bottom: 1px solid #F0EEEA;
}


.list-item:last-child {
  border-bottom: none;
}


.date-box {
  flex: 0 0 43px;

  width: 43px;
  height: 43px;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  border-radius: 9px;

  background: #F1EFEB;
}


.date-month {
  color: #77716A;

  font-size: 7px;
  font-weight: 700;

  letter-spacing: 0.55px;
}


.date-day {
  margin-top: 1px;

  color: #47433E;

  font-size: 15px;
  font-weight: 600;
}


.list-content {
  flex: 1;

  min-width: 0;
}


.list-title {
  color: #3C3935;

  font-size: 10.5px;
  font-weight: 600;

  line-height: 1.25;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


.list-meta {
  margin-top: 4px;

  color: #98938D;

  font-size: 8px;

  line-height: 1.3;
}


.chevron {
  color: #B1ADA7;

  font-size: 15px;
}


/* ==========================================
   EMPTY
========================================== */

.empty,
.loading {
  min-height: 105px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 18px;

  color: #AAA59F;

  font-size: 9px;

  text-align: center;
}


/* ==========================================
   IPAD
========================================== */

@media (max-width: 1100px) {

  .dashboard {
    grid-template-columns:
      minmax(0, 2.5fr)
      minmax(220px, 0.9fr);

    gap: 10px;
  }


  .calendar-panel {
    padding: 12px;
  }


  .sidebar-panel {
    padding: 15px;
  }


  .sidebar-title {
    font-size: 16px;
  }


  .calendar-inner {
    min-width: 660px;
  }

}


/* ==========================================
   SMALL IPAD / TABLET
========================================== */

@media (max-width: 820px) {

  .dashboard {
    grid-template-columns:
      minmax(0, 1fr)
      210px;

    gap: 9px;
  }


  .calendar-panel {
    padding: 10px;
  }


  .calendar-inner {
    min-width: 620px;
  }


  .sidebar-panel {
    padding: 13px;
  }


  .sidebar-title {
    font-size: 15px;
  }


  .list-item {
    gap: 8px;
  }


  .date-box {
    flex-basis: 38px;

    width: 38px;
    height: 38px;
  }

}


/* ==========================================
   PHONE
========================================== */

@media (max-width: 650px) {

  .dashboard {
    grid-template-columns: 1fr;
  }


  .sidebar {
    display: grid;

    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

}


@media (max-width: 480px) {

  .calendar-header {
    align-items: flex-start;

    flex-direction: column;
  }


  .controls {
    align-self: flex-end;
  }


  .sidebar {
    grid-template-columns: 1fr;
  }

}

</style>
</head>


<body>


<div class="dashboard">


  <!-- ======================================
       CALENDAR
  ======================================= -->

  <section class="panel calendar-panel">


    <div class="calendar-header">


      <div
        class="month-label"
        id="monthLabel"
      >
      </div>


      <div class="controls">


        <button
          class="control arrow"
          id="previousWeek"
          aria-label="Previous week"
        >
          ‹
        </button>


        <button
          class="control"
          id="todayButton"
        >
          Today
        </button>


        <button
          class="control arrow"
          id="nextWeek"
          aria-label="Next week"
        >
          ›
        </button>


      </div>


    </div>


    <div class="calendar-shell">


      <div class="calendar-scroll">


        <div class="calendar-inner">


          <div
            class="week-header"
            id="weekHeader"
          >
          </div>


          <div
            class="calendar-grid"
            id="calendarGrid"
          >
          </div>


        </div>


      </div>


    </div>


  </section>



  <!-- ======================================
       SIDEBAR
  ======================================= -->

  <aside class="sidebar">


    <section class="panel sidebar-panel">


      <div class="sidebar-header">


        <h2 class="sidebar-title">
          Upcoming Lessons
        </h2>


        <span class="sidebar-note">
          Next 4
        </span>


      </div>


      <div
        id="upcomingLessons"
        class="loading"
      >
        Loading…
      </div>


    </section>



    <section class="panel sidebar-panel">


      <div class="sidebar-header">


        <h2 class="sidebar-title">
          Deadlines
        </h2>


        <span class="sidebar-note">
          Upcoming
        </span>


      </div>


      <div id="deadlines">


        <div class="empty">
          No upcoming deadlines
        </div>


      </div>


    </section>


  </aside>


</div>


<script>

/* ==========================================
   SETTINGS
========================================== */

const API_URL =
  "https://notion-calendar-api.nourmohsen12223.workers.dev/tutoring-lessons";

const DEADLINES_API_URL =
  "https://notion-calendar-api.nourmohsen12223.workers.dev/tutoring-deadlines";

/*
  Calendar runs from:

  5 PM → 5 AM

  17 = 5 PM
  29 = 5 AM next day
*/

const START_HOUR = 17;

const END_HOUR = 29;


/*
  38px × 12 hours = 456px.

  This is deliberately shorter than the
  previous version so the entire calendar
  fits comfortably inside the iPad embed.
*/

const HOUR_HEIGHT = 38;


/* ==========================================
   STATE
========================================== */

let currentWeekStart =
  getMonday(
    new Date()
  );


let tutoringLessons = [];

let deadlines = [];


/* ==========================================
   COLORS
========================================== */

const NEUTRAL_COLORS = [
  "#E8E4DE",
  "#E2DFDA",
  "#DDD8D1",
  "#EEEAE4",
  "#E7E7E3"
];


const studentColors =
  new Map();


function colorForStudent(name) {

  const key =
    String(
      name || "Student"
    );


  if (
    studentColors.has(key)
  ) {

    return studentColors.get(key);
  }


  const color =
    NEUTRAL_COLORS[
      studentColors.size %
      NEUTRAL_COLORS.length
    ];


  studentColors.set(
    key,
    color
  );


  return color;
}


/* ==========================================
   DATE HELPERS
========================================== */

function getMonday(date) {

  const result =
    new Date(date);


  result.setHours(
    0,
    0,
    0,
    0
  );


  const day =
    result.getDay();


  const difference =
    day === 0
      ? -6
      : 1 - day;


  result.setDate(
    result.getDate() +
    difference
  );


  return result;
}


function addDays(
  date,
  amount
) {

  const result =
    new Date(date);


  result.setDate(
    result.getDate() +
    amount
  );


  return result;
}


function sameDay(
  first,
  second
) {

  return (
    first.getFullYear() ===
      second.getFullYear() &&

    first.getMonth() ===
      second.getMonth() &&

    first.getDate() ===
      second.getDate()
  );
}


function dayName(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        weekday: "short"
      }
    )
    .toUpperCase();
}


function dayNumber(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        day: "numeric"
      }
    );
}


function monthYear(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        month: "long",
        year: "numeric"
      }
    );
}


function shortMonth(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        month: "short"
      }
    )
    .toUpperCase();
}


function formatTime(date) {

  return date
    .toLocaleTimeString(
      "en-US",
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );
}


function formatGridHour(gridHour) {

  const actualHour =
    gridHour % 24;


  const date =
    new Date();


  date.setHours(
    actualHour,
    0,
    0,
    0
  );


  return date
    .toLocaleTimeString(
      "en-US",
      {
        hour: "numeric"
      }
    );
}


/* ==========================================
   SAFE HTML
========================================== */

function escapeHTML(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* ==========================================
   PARSE SOLOMON
========================================== */

function parseLesson(item) {

  const rawTitle =
    String(
      item.title || ""
    ).trim();

  let student =
    item.student || "";

  let subject =
    item.subject || "";

  let grade =
    item.grade || "";

  if (
    !student &&
    rawTitle
  ) {

    const parts =
      rawTitle.split(
        /\s+[—–-]\s+/
      );

    if (
      parts.length >= 2
    ) {

      student =
        parts.shift().trim();

      if (
        !subject
      ) {

        subject =
          parts.join(" — ").trim();
      }

    } else {

      student =
        rawTitle;
    }
  }

  return {

    student:
      student ||
      "Student",

    subject:
      subject || "",

    grade:
      grade || ""

  };
}


/* ==========================================
   VISUAL POSITION
========================================== */

/*
  Midnight–4:59 AM belongs visually to
  the previous tutoring evening.

  Example:

  Tuesday 1 AM appears in Monday's
  tutoring column.
*/

function getVisualPosition(date) {

  let visualDate =
    new Date(date);


  let hour =
    date.getHours() +
    date.getMinutes() / 60;


  if (
    hour < 5
  ) {

    visualDate =
      addDays(
        visualDate,
        -1
      );


    hour += 24;
  }


  return {
    visualDate,
    hour
  };
}


/* ==========================================
   CURRENT WEEK LESSONS
========================================== */

function currentWeekLessons() {

  const weekEnd =
    addDays(
      currentWeekStart,
      7
    );


  return tutoringLessons
    .filter(
      item => {

        if (
          !item.start
        ) {

          return false;
        }


        const start =
          new Date(
            item.start
          );


        if (
          Number.isNaN(
            start.getTime()
          )
        ) {

          return false;
        }


        const position =
          getVisualPosition(
            start
          );


        return (
          position.visualDate >=
            currentWeekStart &&

          position.visualDate <
            weekEnd
        );
      }
    );
}


/* ==========================================
   WEEK HEADER
========================================== */

function renderWeekHeader() {

  const header =
    document.getElementById(
      "weekHeader"
    );


  header.innerHTML =
    `
      <div class="header-spacer"></div>
    `;


  const today =
    new Date();


  for (
    let index = 0;
    index < 7;
    index++
  ) {

    const date =
      addDays(
        currentWeekStart,
        index
      );


    const element =
      document.createElement(
        "div"
      );


    element.className =
      "day-header";


    if (
      sameDay(
        date,
        today
      )
    ) {

      element
        .classList
        .add(
          "today"
        );
    }


    element.innerHTML =
      `
        <div class="day-name">
          ${escapeHTML(
            dayName(date)
          )}
        </div>

        <div class="day-number">
          ${escapeHTML(
            dayNumber(date)
          )}
        </div>
      `;


    header.appendChild(
      element
    );
  }


  const middle =
    addDays(
      currentWeekStart,
      3
    );


  document
    .getElementById(
      "monthLabel"
    )
    .textContent =
      monthYear(
        middle
      );
}


/* ==========================================
   GRID
========================================== */

function renderGrid() {

  const totalHours =
    END_HOUR -
    START_HOUR;


  const calendarHeight =
    totalHours *
    HOUR_HEIGHT;


  const grid =
    document.getElementById(
      "calendarGrid"
    );


  grid.innerHTML =
    "";


  /* TIME COLUMN */

  const timeColumn =
    document.createElement(
      "div"
    );


  timeColumn.className =
    "time-column";


  timeColumn.style.height =
    calendarHeight +
    "px";


  for (
    let hour = START_HOUR;
    hour <= END_HOUR;
    hour++
  ) {

    const label =
      document.createElement(
        "div"
      );


    label.className =
      "time-label";


    if (
      hour === START_HOUR
    ) {

      label
        .classList
        .add(
          "first"
        );
    }


    if (
      hour === END_HOUR
    ) {

      label
        .classList
        .add(
          "last"
        );
    }


    label.style.top =
      (
        (hour - START_HOUR) *
        HOUR_HEIGHT
      ) +
      "px";


    label.textContent =
      formatGridHour(
        hour
      );


    timeColumn.appendChild(
      label
    );
  }


  grid.appendChild(
    timeColumn
  );


  /* DAY COLUMNS */

  const today =
    new Date();


  for (
    let dayIndex = 0;
    dayIndex < 7;
    dayIndex++
  ) {

    const date =
      addDays(
        currentWeekStart,
        dayIndex
      );


    const column =
      document.createElement(
        "div"
      );


    column.className =
      "day-column";


    column.dataset.day =
      dayIndex;


    column.style.height =
      calendarHeight +
      "px";


    if (
      sameDay(
        date,
        today
      )
    ) {

      column
        .classList
        .add(
          "today"
        );
    }


    for (
      let hour = START_HOUR;
      hour <= END_HOUR;
      hour++
    ) {

      const line =
        document.createElement(
          "div"
        );


      line.className =
        "hour-line";


      line.style.top =
        (
          (hour - START_HOUR) *
          HOUR_HEIGHT
        ) +
        "px";


      column.appendChild(
        line
      );
    }


    grid.appendChild(
      column
    );
  }


  renderLessons();
}


/* ==========================================
   LESSONS
========================================== */

function renderLessons() {

  const columns =
    document.querySelectorAll(
      ".day-column"
    );


  const lessons =
    currentWeekLessons();


  lessons.forEach(
    item => {

      const start =
        new Date(
          item.start
        );


      const end =
        item.end
          ? new Date(
              item.end
            )
          : new Date(
              start.getTime() +
              60 * 60 * 1000
            );


      const startPosition =
        getVisualPosition(
          start
        );


      const endPosition =
        getVisualPosition(
          end
        );


      let dayIndex =
        -1;


      for (
        let index = 0;
        index < 7;
        index++
      ) {

        const day =
          addDays(
            currentWeekStart,
            index
          );


        if (
          sameDay(
            startPosition.visualDate,
            day
          )
        ) {

          dayIndex =
            index;

          break;
        }
      }


      if (
        dayIndex === -1
      ) {

        return;
      }


      if (
        startPosition.hour <
          START_HOUR ||

        startPosition.hour >=
          END_HOUR
      ) {

        return;
      }


      let endHour =
        endPosition.hour;


      if (
        end <= start
      ) {

        endHour =
          startPosition.hour + 1;
      }


      if (
        endHour <
        startPosition.hour
      ) {

        endHour += 24;
      }


      endHour =
        Math.min(
          endHour,
          END_HOUR
        );


      const top =
        (
          startPosition.hour -
          START_HOUR
        ) *
        HOUR_HEIGHT;


      const duration =
        Math.max(
          0.25,
          endHour -
          startPosition.hour
        );


      /*
        The card is always slightly smaller
        than its exact time cell.

        Therefore it cannot overlap the next
        horizontal line.
      */

      const height =
        Math.max(
          29,
          duration *
          HOUR_HEIGHT -
          4
        );


      const info =
        parseLesson(
          item
        );


      const lesson =
        document.createElement(
          "div"
        );


      lesson.className =
        "lesson";


      lesson.style.top =
        (
          top + 2
        ) +
        "px";


      lesson.style.height =
        height +
        "px";


      lesson.style.background =
        colorForStudent(
          info.student
        );


      if (
        item.notionUrl
      ) {

        lesson.title =
          "Open lesson in Notion";

        lesson.addEventListener(
          "click",
          () => {

            window.open(
              item.notionUrl,
              "_blank",
              "noopener,noreferrer"
            );
          }
        );
      }


      lesson.innerHTML =
        `
          <div class="lesson-name">
            ${escapeHTML(
              info.student
            )}
          </div>

          <div class="lesson-time">
            ${escapeHTML(
              formatTime(start)
            )}
            –
            ${escapeHTML(
              formatTime(end)
            )}
          </div>

          ${
            info.subject
              ? `
                <div class="lesson-subject">
                  ${escapeHTML(
                    info.subject
                  )}
                </div>
              `
              : ""
          }
        `;


      columns[
        dayIndex
      ]
        .appendChild(
          lesson
        );
    }
  );
}


/* ==========================================
   UPCOMING
========================================== */

function renderUpcoming() {

  const container =
    document.getElementById(
      "upcomingLessons"
    );


  const now =
    new Date();


  const upcoming =
    tutoringLessons

      .filter(
        item => {

          if (
            !item.start
          ) {

            return false;
          }


          const date =
            new Date(
              item.start
            );


          return (
            !Number.isNaN(
              date.getTime()
            ) &&
            date >= now
          );
        }
      )

      .sort(
        (a, b) =>
          new Date(
            a.start
          ) -
          new Date(
            b.start
          )
      )

      .slice(
        0,
        4
      );


  if (
    !upcoming.length
  ) {

    container.className =
      "empty";


    container.textContent =
      "No upcoming lessons";


    return;
  }


  container.className =
    "";


  container.innerHTML =
    upcoming
      .map(
        item => {

          const start =
            new Date(
              item.start
            );


          const info =
            parseLesson(
              item
            );


          return `
            <div class="list-item">


              <div class="date-box">


                <div class="date-month">
                  ${escapeHTML(
                    shortMonth(start)
                  )}
                </div>


                <div class="date-day">
                  ${escapeHTML(
                    dayNumber(start)
                  )}
                </div>


              </div>


              <div class="list-content">


                <div class="list-title">
                  ${escapeHTML(
                    info.student
                  )}
                </div>


                <div class="list-meta">

                  ${escapeHTML(
                    formatTime(start)
                  )}

                  ${
                    info.subject
                      ? " · " +
                        escapeHTML(
                          info.subject
                        )
                      : ""
                  }

                </div>


              </div>


              <div class="chevron">
                ›
              </div>


            </div>
          `;
        }
      )
      .join(
        ""
      );


  container
    .querySelectorAll(
      "[data-notion-url]"
    )
    .forEach(
      element => {

        const openLesson =
          () => {

            window.open(
              element.dataset.notionUrl,
              "_blank",
              "noopener,noreferrer"
            );
          };

        element.addEventListener(
          "click",
          openLesson
        );

        element.addEventListener(
          "keydown",
          event => {

            if (
              event.key === "Enter" ||
              event.key === " "
            ) {

              event.preventDefault();
              openLesson();
            }
          }
        );
      }
    );
}


/* ==========================================
   DEADLINES
========================================== */

function renderDeadlines() {

  const container =
    document.getElementById(
      "deadlines"
    );


  if (
    !deadlines.length
  ) {

    container.innerHTML =
      `
        <div class="empty">
          No upcoming deadlines
        </div>
      `;


    return;
  }


  const now =
    new Date();


  const future =
    deadlines

      .filter(
        item => {

          const value =
            item.due ||
            item.date ||
            item.start;


          if (
            !value
          ) {

            return false;
          }


          const date =
            new Date(
              value
            );


          return (
            !Number.isNaN(
              date.getTime()
            ) &&
            date >= now
          );
        }
      )

      .sort(
        (a, b) =>
          new Date(
            a.due ||
            a.date ||
            a.start
          ) -
          new Date(
            b.due ||
            b.date ||
            b.start
          )
      )

      .slice(
        0,
        4
      );


  if (
    !future.length
  ) {

    container.innerHTML =
      `
        <div class="empty">
          No upcoming deadlines
        </div>
      `;


    return;
  }


  container.innerHTML =
    future
      .map(
        item => {

          const date =
            new Date(
              item.due ||
              item.date ||
              item.start
            );


          const title =
            item.title ||
            item.name ||
            "Deadline";


          return `
            <div class="list-item">


              <div class="date-box">


                <div class="date-month">
                  ${escapeHTML(
                    shortMonth(date)
                  )}
                </div>


                <div class="date-day">
                  ${escapeHTML(
                    dayNumber(date)
                  )}
                </div>


              </div>


              <div class="list-content">


                <div class="list-title">
                  ${escapeHTML(
                    title
                  )}
                </div>


                <div class="list-meta">
                  Upcoming deadline
                </div>


              </div>


              <div class="chevron">
                ›
              </div>


            </div>
          `;
        }
      )
      .join(
        ""
      );

  const renderedItems =
    container.querySelectorAll(".list-item");

  renderedItems.forEach((element, index) => {
    const item = future[index];

    if (!item || !item.notionUrl) {
      return;
    }

    element.style.cursor = "pointer";
    element.setAttribute("role", "button");
    element.setAttribute("tabindex", "0");

    const openDeadline = () => {
      window.open(
        item.notionUrl,
        "_blank",
        "noopener,noreferrer"
      );
    };

    element.addEventListener("click", openDeadline);

    element.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openDeadline();
      }
    });
  });
}


/* ==========================================
   FULL RENDER
========================================== */

function renderCalendar() {

  renderWeekHeader();

  renderGrid();
}


/* ==========================================
   FETCH
========================================== */

async function loadData() {

  try {

    const [
      lessonsResponse,
      deadlinesResponse
    ] =
      await Promise.all([
        fetch(
          API_URL,
          {
            cache:
              "no-store"
          }
        ),

        fetch(
          DEADLINES_API_URL,
          {
            cache:
              "no-store"
          }
        )
      ]);

    if (
      !lessonsResponse.ok
    ) {

      throw new Error(
        "Unable to load tutoring lessons."
      );
    }

    const lessonsData =
      await lessonsResponse.json();

    tutoringLessons =
      Array.isArray(
        lessonsData.lessons
      )
        ? lessonsData.lessons
        : [];

    if (
      deadlinesResponse.ok
    ) {

      const deadlinesData =
        await deadlinesResponse.json();

      deadlines =
        Array.isArray(
          deadlinesData.deadlines
        )
          ? deadlinesData.deadlines
          : [];

    } else {

      deadlines = [];
    }

    renderCalendar();
    renderUpcoming();
    renderDeadlines();

  } catch (error) {

    console.error(
      error
    );

    document
      .getElementById(
        "upcomingLessons"
      )
      .innerHTML =
        `
          <div class="empty">
            Unable to load lessons
          </div>
        `;

    renderDeadlines();
  }
}


/* ==========================================
   NAVIGATION
========================================== */

document
  .getElementById(
    "previousWeek"
  )
  .addEventListener(
    "click",
    () => {

      currentWeekStart =
        addDays(
          currentWeekStart,
          -7
        );


      renderCalendar();
    }
  );


document
  .getElementById(
    "nextWeek"
  )
  .addEventListener(
    "click",
    () => {

      currentWeekStart =
        addDays(
          currentWeekStart,
          7
        );


      renderCalendar();
    }
  );


document
  .getElementById(
    "todayButton"
  )
  .addEventListener(
    "click",
    () => {

      currentWeekStart =
        getMonday(
          new Date()
        );


      renderCalendar();
    }
  );


/* ==========================================
   START
========================================== */

renderCalendar();

loadData();


setInterval(
  loadData,
  5 * 60 * 1000
);

</script>
