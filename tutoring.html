<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tutoring Calendar</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --card: #FFFFFF;
  --text: #37352F;
  --soft: #6F6A64;
  --muted: #98938D;
  --border: #E6E2DC;
  --grid: #EEECE8;
  --today: #D8D2CA;

  --lesson1: #E8E4DE;
  --lesson2: #E2DFDA;
  --lesson3: #DDD8D1;
  --lesson4: #EEEAE4;
  --lesson5: #E7E7E3;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent;
  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  overflow-x: hidden;
}


/* ================================
   MAIN LAYOUT
================================ */

.dashboard {
  width: 100%;
  margin: 0;
  padding: 0;

  display: grid;

  grid-template-columns:
    minmax(0, 2.7fr)
    minmax(235px, 0.9fr);

  gap: 14px;

  align-items: start;
}

.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
}


/* ================================
   CALENDAR
================================ */

.calendar-panel {
  padding: 15px;
}


/* ================================
   TOP BAR
================================ */

.calendar-header {
  min-height: 42px;

  margin-bottom: 12px;

  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 15px;
}


/* MONTH LEFT */

.month-label {
  color: #37332F;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 20px;
  font-weight: 600;

  line-height: 1.1;

  white-space: nowrap;
}


/* CONTROLS RIGHT */

.controls {
  display: flex;
  align-items: center;
  gap: 5px;
}

.control {
  height: 30px;

  padding: 0 10px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid var(--border);
  border-radius: 8px;

  background: #FFFFFF;

  color: var(--soft);

  font-family: inherit;
  font-size: 10px;

  cursor: pointer;
}

.control:hover {
  background: #F6F4F1;
}

.arrow {
  width: 29px;
  padding: 0;

  border-color: transparent;

  background: transparent;

  font-size: 17px;
}


/* ================================
   CALENDAR SHELL
================================ */

.calendar-shell {
  width: 100%;

  overflow: hidden;

  border: 1px solid var(--border);
  border-radius: 11px;
}


/* ================================
   WEEK HEADER
================================ */

.week-header {
  display: grid;

  grid-template-columns:
    52px repeat(7, minmax(0, 1fr));

  background: #FBFAF8;

  border-bottom: 1px solid var(--border);
}

.header-spacer {
  border-right: 1px solid var(--border);
}

.day-header {
  min-width: 0;

  padding: 8px 3px 9px;

  text-align: center;

  border-right: 1px solid var(--border);
}

.day-header:last-child {
  border-right: none;
}

.day-name {
  color: #77726C;

  font-size: 8px;
  font-weight: 600;

  letter-spacing: 0.65px;
}

.day-number {
  width: 24px;
  height: 24px;

  margin: 3px auto 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  color: #48443F;

  font-size: 12px;
  font-weight: 500;
}

.day-header.today {
  background: #F5F3F0;
}

.day-header.today .day-number {
  background: var(--today);

  color: #403C37;

  font-weight: 650;
}


/* ================================
   CALENDAR BODY
================================ */

.calendar-scroll {
  width: 100%;
  overflow-x: auto;

  scrollbar-width: thin;
}

.calendar-grid {
  display: grid;

  grid-template-columns:
    52px repeat(7, minmax(90px, 1fr));

  min-width: 690px;
}


/* ================================
   TIME COLUMN
================================ */

.time-column {
  position: relative;

  border-right: 1px solid var(--border);

  background: #FFFFFF;
}

.time-label {
  position: absolute;

  right: 7px;

  transform: translateY(-50%);

  color: #99948E;

  font-size: 8px;

  white-space: nowrap;
}


/* ================================
   DAY COLUMNS
================================ */

.day-column {
  position: relative;

  border-right: 1px solid var(--border);

  background: #FFFFFF;
}

.day-column:last-child {
  border-right: none;
}

.day-column.today {
  background: #FCFBFA;
}

.hour-line {
  position: absolute;

  left: 0;
  right: 0;

  height: 1px;

  background: var(--grid);
}


/* ================================
   LESSONS
================================ */

.lesson {
  position: absolute;

  left: 3px;
  right: 3px;

  z-index: 2;

  padding: 4px 6px;

  overflow: hidden;

  border-radius: 6px;

  border-left:
    3px solid rgba(65, 61, 56, 0.14);

  cursor: pointer;
}

.lesson:hover {
  z-index: 5;

  box-shadow:
    0 3px 10px
    rgba(55, 53, 47, 0.08);
}

.lesson-name {
  color: #37332F;

  font-size: 8.5px;
  font-weight: 650;

  line-height: 1.15;

  white-space: nowrap;

  overflow: hidden;
  text-overflow: ellipsis;
}

.lesson-time {
  margin-top: 2px;

  color: #716C66;

  font-size: 7px;

  line-height: 1.1;
}

.lesson-subject {
  margin-top: 2px;

  color: #5D5852;

  font-size: 7px;

  line-height: 1.15;

  white-space: nowrap;

  overflow: hidden;
  text-overflow: ellipsis;
}


/* ================================
   SIDEBAR
================================ */

.sidebar {
  display: flex;

  flex-direction: column;

  gap: 14px;
}

.sidebar-panel {
  padding: 16px;
}

.sidebar-header {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 8px;

  margin-bottom: 7px;
}

.sidebar-title {
  margin: 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color: #302D29;

  font-size: 16px;
  font-weight: 600;
}

.sidebar-note {
  color: #AAA59E;

  font-size: 8px;
}


/* ================================
   SIDEBAR ITEMS
================================ */

.list-item {
  display: flex;

  align-items: center;

  gap: 9px;

  padding: 10px 0;

  border-bottom: 1px solid #F0EEEA;
}

.list-item:last-child {
  border-bottom: none;
}

.date-box {
  flex: 0 0 39px;

  width: 39px;
  height: 39px;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  border-radius: 8px;

  background: #F1EFEB;
}

.date-month {
  color: #77716A;

  font-size: 6.5px;
  font-weight: 700;

  letter-spacing: 0.55px;
}

.date-day {
  margin-top: 1px;

  color: #47433E;

  font-size: 14px;
  font-weight: 600;
}

.list-content {
  flex: 1;

  min-width: 0;
}

.list-title {
  color: #3C3935;

  font-size: 9.5px;
  font-weight: 600;

  white-space: nowrap;

  overflow: hidden;
  text-overflow: ellipsis;
}

.list-meta {
  margin-top: 3px;

  color: #98938D;

  font-size: 7.5px;

  line-height: 1.3;
}

.chevron {
  color: #B1ADA7;

  font-size: 14px;
}


/* ================================
   EMPTY
================================ */

.empty,
.loading {
  min-height: 90px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 18px;

  color: #AAA59F;

  font-size: 9px;

  text-align: center;
}


/* ================================
   RESPONSIVE
================================ */

@media (max-width: 850px) {

  .dashboard {
    grid-template-columns:
      minmax(0, 1fr)
      210px;

    gap: 10px;
  }

  .calendar-panel {
    padding: 11px;
  }

  .sidebar-panel {
    padding: 13px;
  }

}

@media (max-width: 650px) {

  .dashboard {
    grid-template-columns: 1fr;
  }

  .sidebar {
    display: grid;

    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

}

@media (max-width: 480px) {

  .calendar-header {
    align-items: flex-start;

    flex-direction: column;
  }

  .controls {
    align-self: flex-end;
  }

  .sidebar {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>


<div class="dashboard">


  <!-- CALENDAR -->

  <section class="panel calendar-panel">


    <div class="calendar-header">


      <div
        class="month-label"
        id="monthLabel"
      >
      </div>


      <div class="controls">


        <button
          class="control arrow"
          id="previousWeek"
          aria-label="Previous week"
        >
          ‹
        </button>


        <button
          class="control"
          id="todayButton"
        >
          Today
        </button>


        <button
          class="control arrow"
          id="nextWeek"
          aria-label="Next week"
        >
          ›
        </button>


      </div>


    </div>


    <div class="calendar-shell">


      <div
        class="week-header"
        id="weekHeader"
      >
      </div>


      <div class="calendar-scroll">


        <div
          class="calendar-grid"
          id="calendarGrid"
        >
        </div>


      </div>


    </div>


  </section>



  <!-- SIDEBAR -->

  <aside class="sidebar">


    <section class="panel sidebar-panel">


      <div class="sidebar-header">


        <h2 class="sidebar-title">
          Upcoming Lessons
        </h2>


        <span class="sidebar-note">
          Next 4
        </span>


      </div>


      <div
        id="upcomingLessons"
        class="loading"
      >
        Loading…
      </div>


    </section>



    <section class="panel sidebar-panel">


      <div class="sidebar-header">


        <h2 class="sidebar-title">
          Deadlines
        </h2>


        <span class="sidebar-note">
          Upcoming
        </span>


      </div>


      <div id="deadlines">


        <div class="empty">
          No upcoming deadlines
        </div>


      </div>


    </section>


  </aside>


</div>


<script>

/* ================================
   SETTINGS
================================ */

const API_URL =
  "https://notion-calendar-api.nourmohsen12223.workers.dev/upcoming-data";


/*
  The tutoring day is treated as:

  5 PM → midnight → 5 AM

  Therefore hours after midnight belong
  visually to the evening that started
  the previous calendar day.
*/

const START_HOUR = 17;

const END_HOUR = 29;

const HOUR_HEIGHT = 42;


/* ================================
   STATE
================================ */

let currentWeekStart =
  getMonday(new Date());

let tutoringLessons = [];

let deadlines = [];


/* ================================
   COLORS
================================ */

const NEUTRAL_COLORS = [
  "#E8E4DE",
  "#E2DFDA",
  "#DDD8D1",
  "#EEEAE4",
  "#E7E7E3"
];

const studentColors =
  new Map();


function colorForStudent(name) {

  const key =
    String(name || "Student");


  if (studentColors.has(key)) {

    return studentColors.get(key);
  }


  const color =
    NEUTRAL_COLORS[
      studentColors.size %
      NEUTRAL_COLORS.length
    ];


  studentColors.set(
    key,
    color
  );


  return color;
}


/* ================================
   DATE HELPERS
================================ */

function getMonday(date) {

  const result =
    new Date(date);


  result.setHours(0, 0, 0, 0);


  const day =
    result.getDay();


  const difference =
    day === 0
      ? -6
      : 1 - day;


  result.setDate(
    result.getDate() +
    difference
  );


  return result;
}


function addDays(date, amount) {

  const result =
    new Date(date);


  result.setDate(
    result.getDate() +
    amount
  );


  return result;
}


function sameDay(a, b) {

  return (
    a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() &&
    a.getDate() === b.getDate()
  );
}


function dayName(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        weekday: "short"
      }
    )
    .toUpperCase();
}


function dayNumber(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        day: "numeric"
      }
    );
}


function monthYear(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        month: "long",
        year: "numeric"
      }
    );
}


function shortMonth(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        month: "short"
      }
    )
    .toUpperCase();
}


function formatTime(date) {

  return date
    .toLocaleTimeString(
      "en-US",
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );
}


function formatGridHour(gridHour) {

  const actualHour =
    gridHour % 24;


  const date =
    new Date();


  date.setHours(
    actualHour,
    0,
    0,
    0
  );


  return date
    .toLocaleTimeString(
      "en-US",
      {
        hour: "numeric"
      }
    );
}


/* ================================
   SAFE HTML
================================ */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ================================
   PARSE SOLOMON
================================ */

function parseLesson(item) {

  if (
    item.student ||
    item.subject ||
    item.grade
  ) {

    return {

      student:
        item.student ||
        "Student",

      subject:
        item.subject || "",

      grade:
        item.grade || ""

    };
  }


  const raw =
    String(item.title || "");


  const firstLine =
    raw
      .split(/\r?\n/)[0]
      .trim();


  const nameMatch =
    firstLine.match(
      /^([^,]+),\s*([^(]+)/
    );


  let student =
    firstLine;


  if (nameMatch) {

    student =
      nameMatch[2].trim() +
      " " +
      nameMatch[1].trim();

  } else {

    student =
      student
        .replace(
          /\s*\(Private Lesson\).*$/i,
          ""
        )
        .trim();
  }


  const subjectMatch =
    raw.match(
      /Subject:\s*([^\r\n]+)/i
    );


  const gradeMatch =
    raw.match(
      /Grade:\s*([^\r\n]+)/i
    );


  return {

    student:
      student || "Student",

    subject:
      subjectMatch
        ? subjectMatch[1].trim()
        : "",

    grade:
      gradeMatch
        ? gradeMatch[1].trim()
        : ""

  };
}


/* ================================
   VISUAL DAY / HOUR
================================ */

/*
  A lesson at 1 AM Tuesday should appear
  in Monday's evening column, because
  this calendar represents the tutoring
  evening from 5 PM through 5 AM.
*/

function getVisualPosition(date) {

  let visualDate =
    new Date(date);


  let hour =
    date.getHours() +
    date.getMinutes() / 60;


  if (hour < 5) {

    visualDate =
      addDays(
        visualDate,
        -1
      );


    hour += 24;
  }


  return {
    visualDate,
    hour
  };
}


/* ================================
   WEEK LESSONS
================================ */

function currentWeekLessons() {

  const weekEnd =
    addDays(
      currentWeekStart,
      7
    );


  return tutoringLessons
    .filter(
      item => {

        if (!item.start) {
          return false;
        }


        const start =
          new Date(item.start);


        if (
          Number.isNaN(
            start.getTime()
          )
        ) {

          return false;
        }


        const position =
          getVisualPosition(start);


        return (
          position.visualDate >=
            currentWeekStart &&

          position.visualDate <
            weekEnd
        );
      }
    );
}


/* ================================
   WEEK HEADER
================================ */

function renderWeekHeader() {

  const header =
    document.getElementById(
      "weekHeader"
    );


  header.innerHTML =
    `<div class="header-spacer"></div>`;


  const today =
    new Date();


  for (
    let index = 0;
    index < 7;
    index++
  ) {

    const date =
      addDays(
        currentWeekStart,
        index
      );


    const element =
      document.createElement(
        "div"
      );


    element.className =
      "day-header";


    if (
      sameDay(
        date,
        today
      )
    ) {

      element.classList.add(
        "today"
      );
    }


    element.innerHTML =
      `
        <div class="day-name">
          ${escapeHTML(
            dayName(date)
          )}
        </div>

        <div class="day-number">
          ${escapeHTML(
            dayNumber(date)
          )}
        </div>
      `;


    header.appendChild(
      element
    );
  }


  /*
    Month label based on the middle
    of the displayed week.
  */

  const middle =
    addDays(
      currentWeekStart,
      3
    );


  document
    .getElementById(
      "monthLabel"
    )
    .textContent =
      monthYear(middle);
}


/* ================================
   GRID
================================ */

function renderGrid() {

  const totalHours =
    END_HOUR -
    START_HOUR;


  const calendarHeight =
    totalHours *
    HOUR_HEIGHT;


  const grid =
    document.getElementById(
      "calendarGrid"
    );


  grid.innerHTML = "";


  /* TIME COLUMN */

  const timeColumn =
    document.createElement(
      "div"
    );


  timeColumn.className =
    "time-column";


  timeColumn.style.height =
    calendarHeight +
    "px";


  for (
    let hour = START_HOUR;
    hour <= END_HOUR;
    hour++
  ) {

    const label =
      document.createElement(
        "div"
      );


    label.className =
      "time-label";


    label.style.top =
      (
        (hour - START_HOUR) *
        HOUR_HEIGHT
      ) +
      "px";


    label.textContent =
      formatGridHour(hour);


    timeColumn.appendChild(
      label
    );
  }


  grid.appendChild(
    timeColumn
  );


  /* DAY COLUMNS */

  const today =
    new Date();


  for (
    let dayIndex = 0;
    dayIndex < 7;
    dayIndex++
  ) {

    const date =
      addDays(
        currentWeekStart,
        dayIndex
      );


    const column =
      document.createElement(
        "div"
      );


    column.className =
      "day-column";


    column.dataset.day =
      dayIndex;


    column.style.height =
      calendarHeight +
      "px";


    if (
      sameDay(
        date,
        today
      )
    ) {

      column.classList.add(
        "today"
      );
    }


    for (
      let hour = START_HOUR;
      hour <= END_HOUR;
      hour++
    ) {

      const line =
        document.createElement(
          "div"
        );


      line.className =
        "hour-line";


      line.style.top =
        (
          (hour - START_HOUR) *
          HOUR_HEIGHT
        ) +
        "px";


      column.appendChild(
        line
      );
    }


    grid.appendChild(
      column
    );
  }


  renderLessons();
}


/* ================================
   LESSONS
================================ */

function renderLessons() {

  const columns =
    document.querySelectorAll(
      ".day-column"
    );


  const lessons =
    currentWeekLessons();


  lessons.forEach(
    item => {

      const start =
        new Date(item.start);


      const end =
        item.end
          ? new Date(item.end)
          : new Date(
              start.getTime() +
              60 * 60 * 1000
            );


      const startPosition =
        getVisualPosition(start);


      const endPosition =
        getVisualPosition(end);


      let dayIndex =
        -1;


      for (
        let index = 0;
        index < 7;
        index++
      ) {

        const day =
          addDays(
            currentWeekStart,
            index
          );


        if (
          sameDay(
            startPosition.visualDate,
            day
          )
        ) {

          dayIndex =
            index;

          break;
        }
      }


      if (
        dayIndex === -1
      ) {

        return;
      }


      /*
        Only render lessons inside
        5 PM → 5 AM.
      */

      if (
        startPosition.hour <
          START_HOUR ||

        startPosition.hour >=
          END_HOUR
      ) {

        return;
      }


      let endHour =
        endPosition.hour;


      /*
        If the lesson crosses midnight,
        keep its ending position after
        midnight in the same visual day.
      */

      if (
        end <= start
      ) {

        endHour =
          startPosition.hour + 1;
      }


      if (
        endHour <
        startPosition.hour
      ) {

        endHour += 24;
      }


      endHour =
        Math.min(
          endHour,
          END_HOUR
        );


      const top =
        (
          startPosition.hour -
          START_HOUR
        ) *
        HOUR_HEIGHT;


      const duration =
        Math.max(
          0.25,
          endHour -
          startPosition.hour
        );


      /*
        Slightly smaller than its cell,
        so it never spills over the
        horizontal grid lines.
      */

      const height =
        Math.max(
          28,
          duration *
          HOUR_HEIGHT -
          4
        );


      const info =
        parseLesson(item);


      const lesson =
        document.createElement(
          "div"
        );


      lesson.className =
        "lesson";


      lesson.style.top =
        (
          top + 2
        ) +
        "px";


      lesson.style.height =
        height +
        "px";


      lesson.style.background =
        colorForStudent(
          info.student
        );


      lesson.innerHTML =
        `
          <div class="lesson-name">
            ${escapeHTML(
              info.student
            )}
          </div>

          <div class="lesson-time">
            ${escapeHTML(
              formatTime(start)
            )}
            –
            ${escapeHTML(
              formatTime(end)
            )}
          </div>

          ${
            info.subject
              ? `
                <div class="lesson-subject">
                  ${escapeHTML(
                    info.subject
                  )}
                </div>
              `
              : ""
          }
        `;


      columns[
        dayIndex
      ]
        .appendChild(
          lesson
        );
    }
  );
}


/* ================================
   UPCOMING
================================ */

function renderUpcoming() {

  const container =
    document.getElementById(
      "upcomingLessons"
    );


  const now =
    new Date();


  const upcoming =
    tutoringLessons

      .filter(
        item => {

          if (!item.start) {
            return false;
          }


          const date =
            new Date(item.start);


          return (
            !Number.isNaN(
              date.getTime()
            ) &&
            date >= now
          );
        }
      )

      .sort(
        (a, b) =>
          new Date(a.start) -
          new Date(b.start)
      )

      .slice(0, 4);


  if (!upcoming.length) {

    container.className =
      "empty";


    container.textContent =
      "No upcoming lessons";


    return;
  }


  container.className = "";


  container.innerHTML =
    upcoming
      .map(
        item => {

          const start =
            new Date(item.start);


          const info =
            parseLesson(item);


          return `
            <div class="list-item">

              <div class="date-box">

                <div class="date-month">
                  ${escapeHTML(
                    shortMonth(start)
                  )}
                </div>

                <div class="date-day">
                  ${escapeHTML(
                    dayNumber(start)
                  )}
                </div>

              </div>


              <div class="list-content">

                <div class="list-title">
                  ${escapeHTML(
                    info.student
                  )}
                </div>

                <div class="list-meta">

                  ${escapeHTML(
                    formatTime(start)
                  )}

                  ${
                    info.subject
                      ? " · " +
                        escapeHTML(
                          info.subject
                        )
                      : ""
                  }

                </div>

              </div>


              <div class="chevron">
                ›
              </div>

            </div>
          `;
        }
      )
      .join("");
}


/* ================================
   DEADLINES
================================ */

function renderDeadlines() {

  const container =
    document.getElementById(
      "deadlines"
    );


  if (!deadlines.length) {

    container.innerHTML =
      `
        <div class="empty">
          No upcoming deadlines
        </div>
      `;


    return;
  }


  const now =
    new Date();


  const future =
    deadlines

      .filter(
        item => {

          const value =
            item.due ||
            item.date ||
            item.start;


          if (!value) {
            return false;
          }


          const date =
            new Date(value);


          return (
            !Number.isNaN(
              date.getTime()
            ) &&
            date >= now
          );
        }
      )

      .sort(
        (a, b) =>
          new Date(
            a.due ||
            a.date ||
            a.start
          ) -
          new Date(
            b.due ||
            b.date ||
            b.start
          )
      )

      .slice(0, 4);


  if (!future.length) {

    container.innerHTML =
      `
        <div class="empty">
          No upcoming deadlines
        </div>
      `;


    return;
  }


  container.innerHTML =
    future
      .map(
        item => {

          const date =
            new Date(
              item.due ||
              item.date ||
              item.start
            );


          const title =
            item.title ||
            item.name ||
            "Deadline";


          return `
            <div class="list-item">

              <div class="date-box">

                <div class="date-month">
                  ${escapeHTML(
                    shortMonth(date)
                  )}
                </div>

                <div class="date-day">
                  ${escapeHTML(
                    dayNumber(date)
                  )}
                </div>

              </div>


              <div class="list-content">

                <div class="list-title">
                  ${escapeHTML(
                    title
                  )}
                </div>

                <div class="list-meta">
                  Upcoming deadline
                </div>

              </div>


              <div class="chevron">
                ›
              </div>

            </div>
          `;
        }
      )
      .join("");
}


/* ================================
   RENDER
================================ */

function renderCalendar() {

  renderWeekHeader();

  renderGrid();
}


/* ================================
   FETCH DATA
================================ */

async function loadData() {

  try {

    const response =
      await fetch(
        API_URL,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Unable to load tutoring data."
      );
    }


    const data =
      await response.json();


    tutoringLessons =
      Array.isArray(
        data.tutoring
      )
        ? data.tutoring
        : [];


    deadlines =
      Array.isArray(
        data.deadlines
      )
        ? data.deadlines
        : [];


    renderCalendar();

    renderUpcoming();

    renderDeadlines();


  } catch (error) {

    console.error(error);


    document
      .getElementById(
        "upcomingLessons"
      )
      .innerHTML =
        `
          <div class="empty">
            Unable to load lessons
          </div>
        `;
  }
}


/* ================================
   NAVIGATION
================================ */

document
  .getElementById(
    "previousWeek"
  )
  .addEventListener(
    "click",
    () => {

      currentWeekStart =
        addDays(
          currentWeekStart,
          -7
        );


      renderCalendar();
    }
  );


document
  .getElementById(
    "nextWeek"
  )
  .addEventListener(
    "click",
    () => {

      currentWeekStart =
        addDays(
          currentWeekStart,
          7
        );


      renderCalendar();
    }
  );


document
  .getElementById(
    "todayButton"
  )
  .addEventListener(
    "click",
    () => {

      currentWeekStart =
        getMonday(
          new Date()
        );


      renderCalendar();
    }
  );


/* ================================
   START
================================ */

renderCalendar();

loadData();


setInterval(
  loadData,
  5 * 60 * 1000
);

</script>
