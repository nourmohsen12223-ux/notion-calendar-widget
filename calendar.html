<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendar</title>

<script src="https://accounts.google.com/gsi/client"></script>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: #ffffff;

    color: #37352f;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
}

body {
    padding: 18px 22px 24px;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    min-height: 34px;

    margin-bottom: 14px;
}

.month-title {
    font-size: 14px;
    font-weight: 600;

    color: #37352f;
}

.controls {
    display: flex;
    align-items: center;

    gap: 4px;
}

.control-button {
    height: 30px;
    min-width: 30px;

    padding: 0 7px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 5px;

    background: transparent;

    color: #787774;

    font-size: 16px;

    cursor: pointer;
}

.control-button:hover {
    background: #f1f1ef;
}

.today-button {
    color: #37352f;

    font-size: 12px;

    padding: 0 9px;
}


/* =====================================================
   WEEKDAYS
===================================================== */

.weekdays {
    display: grid;

    grid-template-columns:
        repeat(7, minmax(0, 1fr));
}

.weekday {
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #9b9a97;

    font-size: 11px;
    font-weight: 400;
}


/* =====================================================
   CALENDAR GRID
===================================================== */

.calendar {
    display: grid;

    grid-template-columns:
        repeat(7, minmax(0, 1fr));

    border-top: 1px solid #e9e9e7;
    border-left: 1px solid #e9e9e7;
}


/* =====================================================
   DAY CELLS
===================================================== */

.day {
    position: relative;

    min-width: 0;

    height: 122px;

    padding: 8px 9px 6px;

    background: #fdfdfc;

    border-right: 1px solid #e9e9e7;
    border-bottom: 1px solid #e9e9e7;

    overflow: hidden;
}


/* Weekend columns */

.day.weekend {
    background: #fafaf9;
}


/* =====================================================
   DATE
===================================================== */

.date-row {
    display: flex;

    justify-content: flex-end;
    align-items: center;

    min-height: 24px;

    margin-bottom: 3px;
}

.day-number {
    height: 24px;
    min-width: 24px;

    padding: 0 4px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #37352f;

    font-size: 12px;
    font-weight: 400;
}


/* Dates from previous / next month */

.other-month .day-number {
    color: #b4b4b1;
}


/* =====================================================
   TODAY
===================================================== */

.current-day .day-number {
    width: 24px;

    padding: 0;

    background: #eb5757;

    color: #ffffff;

    font-weight: 600;
}


/* =====================================================
   EVENTS
===================================================== */

.events {
    width: 100%;
}

.event {
    width: 100%;

    min-height: 18px;

    display: flex;
    align-items: center;

    padding: 2px 5px;

    margin-bottom: 2px;

    border-radius: 3px;

    font-size: 10px;
    line-height: 14px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.event-time {
    margin-right: 4px;

    font-weight: 500;

    flex-shrink: 0;
}

.event-title {
    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.more {
    padding: 2px 4px;

    color: #9b9a97;

    font-size: 9px;
}


/* =====================================================
   LOGIN
===================================================== */

.login-screen {
    min-height: 250px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;
}

.connect-button {
    padding: 8px 14px;

    background: #ffffff;

    border: 1px solid #e3e3e1;

    border-radius: 5px;

    color: #37352f;

    font-size: 13px;

    cursor: pointer;
}

.connect-button:hover {
    background: #f7f7f5;
}

.login-message {
    margin-top: 10px;

    color: #9b9a97;

    font-size: 11px;
}

.error {
    margin-top: 10px;

    color: #eb5757;

    font-size: 11px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 700px) {

    body {
        padding: 10px;
    }

    .day {
        height: 95px;

        padding: 5px;
    }

    .event {
        font-size: 9px;

        padding-left: 3px;
        padding-right: 3px;
    }

    .weekday {
        font-size: 10px;
    }

}

</style>
</head>


<body>


<!-- ==================================================
     LOGIN
=================================================== -->

<div
    id="loginScreen"
    class="login-screen"
>

    <button
        class="connect-button"
        onclick="connectGoogle()"
    >
        Connect Google Calendar
    </button>

    <div class="login-message">
        Sign in to display your calendars
    </div>

    <div
        id="loginError"
        class="error"
    ></div>

</div>



<!-- ==================================================
     CALENDAR
=================================================== -->

<div
    id="calendarWidget"
    style="display:none;"
>


    <!-- HEADER -->

    <div class="header">

        <div
            id="monthTitle"
            class="month-title"
        ></div>


        <div class="controls">

            <button
                class="control-button"
                onclick="previousMonth()"
                title="Previous month"
            >
                ‹
            </button>


            <button
                class="control-button today-button"
                onclick="goToday()"
            >
                Today
            </button>


            <button
                class="control-button"
                onclick="nextMonth()"
                title="Next month"
            >
                ›
            </button>

        </div>

    </div>



    <!-- WEEKDAYS -->

    <div class="weekdays">

        <div class="weekday">Sun</div>
        <div class="weekday">Mon</div>
        <div class="weekday">Tue</div>
        <div class="weekday">Wed</div>
        <div class="weekday">Thu</div>
        <div class="weekday">Fri</div>
        <div class="weekday">Sat</div>

    </div>



    <!-- DAYS -->

    <div
        id="calendar"
        class="calendar"
    ></div>


</div>



<script>

/* =====================================================
   GOOGLE SETTINGS
===================================================== */

const CLIENT_ID =
"717633697063-cqlol5rt62977cmu29oa9ou3kmnmmrij.apps.googleusercontent.com";


const SCOPES =
"https://www.googleapis.com/auth/calendar.readonly";


let accessToken = null;

let tokenClient = null;

let displayedDate =
    new Date();



/* =====================================================
   GOOGLE LOGIN
===================================================== */

function connectGoogle() {

    document.getElementById(
        "loginError"
    ).textContent = "";


    tokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id:
                CLIENT_ID,

            scope:
                SCOPES,


            callback:
                async response => {


                    if (
                        response.error
                    ) {

                        document.getElementById(
                            "loginError"
                        ).textContent =
                            "Google authorization failed.";

                        return;

                    }


                    accessToken =
                        response.access_token;


                    document.getElementById(
                        "loginScreen"
                    ).style.display =
                        "none";


                    document.getElementById(
                        "calendarWidget"
                    ).style.display =
                        "block";


                    await loadMonth();

                }

        });


    tokenClient.requestAccessToken();

}



/* =====================================================
   GET CALENDAR LIST
===================================================== */

async function getCalendars() {


    const response =
        await fetch(

            "https://www.googleapis.com/calendar/v3/users/me/calendarList",

            {

                headers: {

                    Authorization:
                        "Bearer " +
                        accessToken

                }

            }

        );


    const data =
        await response.json();


    if (
        !response.ok
    ) {

        throw new Error(

            data.error?.message ||

            "Unable to load calendars."

        );

    }


    /*
       Only calendars currently selected
       in Google Calendar.
    */

    return (
        data.items || []
    ).filter(

        calendar =>
            calendar.selected !== false

    );

}



/* =====================================================
   GET EVENTS FROM ONE CALENDAR
===================================================== */

async function getCalendarEvents(
    calendar,
    start,
    end
) {


    const url =

        "https://www.googleapis.com/calendar/v3/calendars/" +

        encodeURIComponent(
            calendar.id
        ) +

        "/events" +

        "?timeMin=" +

        encodeURIComponent(
            start.toISOString()
        ) +

        "&timeMax=" +

        encodeURIComponent(
            end.toISOString()
        ) +

        "&singleEvents=true" +

        "&orderBy=startTime" +

        "&maxResults=2500";


    try {


        const response =
            await fetch(

                url,

                {

                    headers: {

                        Authorization:
                            "Bearer " +
                            accessToken

                    }

                }

            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            console.warn(

                "Unable to load calendar:",

                calendar.summary

            );


            return [];

        }


        return (
            data.items || []
        ).map(

            event => ({

                ...event,


                calendarName:
                    calendar.summary,


                calendarColor:
                    calendar.backgroundColor ||
                    "#eeeeec",


                calendarTextColor:
                    calendar.foregroundColor ||
                    "#37352f"

            })

        );


    }

    catch (
        error
    ) {


        console.warn(

            "Calendar error:",

            calendar.summary,

            error

        );


        return [];

    }

}



/* =====================================================
   LOAD MONTH
===================================================== */

async function loadMonth() {


    const year =
        displayedDate.getFullYear();


    const month =
        displayedDate.getMonth();



    /*
       First day of displayed month
    */

    const firstOfMonth =
        new Date(

            year,

            month,

            1

        );



    /*
       Last day of displayed month
    */

    const lastOfMonth =
        new Date(

            year,

            month + 1,

            0

        );



    /*
       Start on Sunday before
       month begins
    */

    const start =
        new Date(
            firstOfMonth
        );


    start.setDate(

        start.getDate() -

        start.getDay()

    );



    /*
       Finish after final Saturday
    */

    const end =
        new Date(
            lastOfMonth
        );


    end.setDate(

        end.getDate() +

        (6 - end.getDay()) +

        1

    );



    try {


        const calendars =
            await getCalendars();



        /*
           Load every calendar
           simultaneously
        */

        const requests =
            calendars.map(

                calendar =>

                    getCalendarEvents(

                        calendar,

                        start,

                        end

                    )

            );



        const results =
            await Promise.all(
                requests
            );



        const allEvents =
            results.flat();



        /*
           Sort events chronologically
        */

        allEvents.sort(

            (a, b) => {


                const aStart =

                    a.start?.dateTime ||

                    a.start?.date ||

                    "";


                const bStart =

                    b.start?.dateTime ||

                    b.start?.date ||

                    "";


                return (

                    new Date(aStart) -

                    new Date(bStart)

                );

            }

        );



        renderCalendar(
            allEvents
        );


    }

    catch (
        error
    ) {


        console.error(
            error
        );


        renderCalendar([]);

    }

}



/* =====================================================
   RENDER CALENDAR
===================================================== */

function renderCalendar(
    events
) {


    const year =
        displayedDate.getFullYear();


    const month =
        displayedDate.getMonth();



    /*
       MONTH TITLE
    */

    document.getElementById(
        "monthTitle"
    ).textContent =

        displayedDate.toLocaleDateString(

            "en-US",

            {

                month:
                    "long",

                year:
                    "numeric"

            }

        );



    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML =
        "";



    /*
       FIRST VISIBLE SUNDAY
    */

    const first =
        new Date(

            year,

            month,

            1

        );


    const gridStart =
        new Date(
            first
        );


    gridStart.setDate(

        1 -

        first.getDay()

    );



    /*
       LAST VISIBLE SATURDAY
    */

    const last =
        new Date(

            year,

            month + 1,

            0

        );


    const gridEnd =
        new Date(
            last
        );


    gridEnd.setDate(

        last.getDate() +

        (6 - last.getDay())

    );



    const today =
        new Date();



    const cursor =
        new Date(
            gridStart
        );



    while (
        cursor <= gridEnd
    ) {


        const cellDate =
            new Date(
                cursor
            );



        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day";



        /*
           WEEKEND
        */

        if (

            cellDate.getDay() === 0 ||

            cellDate.getDay() === 6

        ) {

            cell.classList.add(
                "weekend"
            );

        }



        /*
           PREVIOUS / NEXT MONTH
        */

        if (

            cellDate.getMonth() !==
            month

        ) {

            cell.classList.add(
                "other-month"
            );

        }



        /*
           TODAY
        */

        if (

            sameDate(
                cellDate,
                today
            )

        ) {

            cell.classList.add(
                "current-day"
            );

        }



        /*
           DATE ROW
        */

        const dateRow =
            document.createElement(
                "div"
            );


        dateRow.className =
            "date-row";



        const number =
            document.createElement(
                "div"
            );


        number.className =
            "day-number";



        /*
           First day of month:
           "Oct 1"
        */

        if (
            cellDate.getDate() === 1
        ) {


            number.textContent =

                cellDate.toLocaleDateString(

                    "en-US",

                    {

                        month:
                            "short",

                        day:
                            "numeric"

                    }

                );


        }

        else {


            number.textContent =
                cellDate.getDate();


        }



        dateRow.appendChild(
            number
        );


        cell.appendChild(
            dateRow
        );



        /*
           EVENTS
        */

        const eventsArea =
            document.createElement(
                "div"
            );


        eventsArea.className =
            "events";



        const dayEvents =
            events.filter(

                event =>

                    eventOccursOnDate(

                        event,

                        cellDate

                    )

            );



        /*
           DISPLAY FIRST FOUR
        */

        dayEvents
            .slice(
                0,
                4
            )
            .forEach(

                event => {


                    const eventDiv =
                        document.createElement(
                            "div"
                        );


                    eventDiv.className =
                        "event";



                    /*
                       Use the actual
                       Google calendar color
                    */

                    eventDiv.style.backgroundColor =
                        event.calendarColor;



                    eventDiv.style.color =
                        event.calendarTextColor;



                    /*
                       TIME
                    */

                    if (
                        event.start?.dateTime
                    ) {


                        const time =
                            new Date(

                                event.start.dateTime

                            ).toLocaleTimeString(

                                [],

                                {

                                    hour:
                                        "numeric",

                                    minute:
                                        "2-digit"

                                }

                            );



                        const timeSpan =
                            document.createElement(
                                "span"
                            );


                        timeSpan.className =
                            "event-time";


                        timeSpan.textContent =
                            time;


                        eventDiv.appendChild(
                            timeSpan
                        );

                    }



                    /*
                       TITLE
                    */

                    const title =
                        document.createElement(
                            "span"
                        );


                    title.className =
                        "event-title";


                    title.textContent =

                        event.summary ||

                        "Event";


                    eventDiv.appendChild(
                        title
                    );



                    /*
                       TOOLTIP
                    */

                    eventDiv.title =

                        (

                            event.calendarName

                            ?

                            event.calendarName +
                            " — "

                            :

                            ""

                        )

                        +

                        (

                            event.summary ||

                            "Event"

                        );



                    eventsArea.appendChild(
                        eventDiv
                    );

                }

            );



        /*
           EXTRA EVENTS
        */

        if (
            dayEvents.length > 4
        ) {


            const more =
                document.createElement(
                    "div"
                );


            more.className =
                "more";


            more.textContent =

                "+" +

                (
                    dayEvents.length -
                    4
                )

                +

                " more";


            eventsArea.appendChild(
                more
            );

        }



        cell.appendChild(
            eventsArea
        );


        calendar.appendChild(
            cell
        );



        /*
           NEXT DAY
        */

        cursor.setDate(

            cursor.getDate() +
            1

        );

    }

}



/* =====================================================
   EVENT DATE MATCHING
===================================================== */

function eventOccursOnDate(
    event,
    date
) {


    /*
       ALL-DAY EVENT
    */

    if (
        event.start?.date
    ) {


        const parts =

            event.start.date

                .split("-")

                .map(
                    Number
                );


        return (

            parts[0] ===
                date.getFullYear()

            &&

            parts[1] ===
                date.getMonth() + 1

            &&

            parts[2] ===
                date.getDate()

        );

    }



    /*
       TIMED EVENT
    */

    if (
        event.start?.dateTime
    ) {


        const eventDate =
            new Date(

                event.start.dateTime

            );


        return sameDate(

            eventDate,

            date

        );

    }



    return false;

}



/* =====================================================
   SAME DATE
===================================================== */

function sameDate(
    a,
    b
) {


    return (

        a.getFullYear() ===
            b.getFullYear()

        &&

        a.getMonth() ===
            b.getMonth()

        &&

        a.getDate() ===
            b.getDate()

    );

}



/* =====================================================
   PREVIOUS MONTH
===================================================== */

function previousMonth() {


    displayedDate =
        new Date(

            displayedDate.getFullYear(),

            displayedDate.getMonth() -
            1,

            1

        );


    loadMonth();

}



/* =====================================================
   NEXT MONTH
===================================================== */

function nextMonth() {


    displayedDate =
        new Date(

            displayedDate.getFullYear(),

            displayedDate.getMonth() +
            1,

            1

        );


    loadMonth();

}



/* =====================================================
   TODAY
===================================================== */

function goToday() {


    displayedDate =
        new Date();


    loadMonth();

}

</script>

</body>

</html>
