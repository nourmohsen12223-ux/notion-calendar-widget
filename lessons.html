<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lessons</title>
<style>
:root{--ink:#37352F;--muted:#8F8B84;--line:#DDDAD5;--paper:#F8F7F4;--card:#fff;--soft:#EEEAE4;--taupe:#6F6A63;--green:#8BAF98}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:18px}.toolbar{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.filters,.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.tab,.btn,.view-toggle{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 11px;cursor:pointer;font:inherit}
.tab.active,.view-toggle.active{background:var(--ink);color:#fff;border-color:var(--ink)}.tools{width:100%}.search{flex:1;min-width:210px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;font:inherit;outline:none}
.new{margin-left:auto;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:650}.view-switch{display:flex;gap:6px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px}.stat b{font-size:20px;display:block}.stat span{color:var(--muted);font-size:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.lesson{display:grid;grid-template-columns:74px minmax(170px,1.5fr) minmax(120px,1fr) 110px 105px;gap:12px;align-items:center;padding:13px 15px;border-bottom:1px solid #ECE9E5}.lesson:last-child{border-bottom:0}
.datebox{text-align:center}.datebox .day{font-size:20px;font-weight:750}.datebox .mon{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}.name{font-weight:700}.sub{color:var(--muted);font-size:12px;margin-top:2px}.time{font-weight:600}.pill{display:inline-flex;width:max-content;border-radius:999px;padding:4px 8px;font-size:11px;background:var(--soft)}
.pill.attended{background:#E5EEE8}.pill.cancelled,.pill.no-show{background:#F0E5E3}.open{justify-self:end;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}
.empty{padding:40px;text-align:center;color:var(--muted)}.calendar{padding:14px}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.cal-head b{font-size:16px}.cal-nav{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{padding:7px;text-align:center;color:var(--muted);font-size:11px}.cell{min-height:100px;border-top:1px solid #ECE9E5;border-right:1px solid #ECE9E5;padding:7px}.cell:nth-child(7n){border-right:0}.cell.dim{color:#C2BEB8}.num{font-size:11px;margin-bottom:5px}.event{font-size:11px;background:var(--soft);border-radius:6px;padding:4px 5px;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.modal-back{position:fixed;inset:0;background:rgba(40,38,35,.28);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-back.show{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:16px;border:1px solid var(--line);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.14)}.modal h2{font-size:18px;margin:0 0 16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;background:#fff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.secondary,.save{border-radius:9px;padding:9px 13px;cursor:pointer;font:inherit}.secondary{border:1px solid var(--line);background:#fff}.save{border:1px solid var(--ink);background:var(--ink);color:#fff}.error{color:#A14B42;font-size:12px;margin-top:10px;min-height:17px}
@media(max-width:760px){.summary{grid-template-columns:1fr 1fr}.lesson{grid-template-columns:58px 1fr auto}.lesson .subjectcol{display:none}.lesson .statuscol{grid-column:2}.open{grid-column:3;grid-row:1/3}.cell{min-height:78px}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <div class="filters" id="filters">
      <button class="tab active" data-filter="all">All Lessons</button>
      <button class="tab" data-filter="upcoming">Upcoming</button>
      <button class="tab" data-filter="Attended">Attended</button>
      <button class="tab" data-filter="Cancelled">Cancelled</button>
      <button class="tab" data-filter="No Show">No Show</button>
    </div>
    <div class="tools">
      <input id="search" class="search" placeholder="Search student or subject…">
      <div class="view-switch">
        <button class="view-toggle active" data-view="list">List</button>
        <button class="view-toggle" data-view="calendar">Calendar</button>
      </div>
      <button class="new" id="newLesson">+ New Lesson</button>
    </div>
  </div>

  <div class="summary">
    <div class="stat"><b id="sUpcoming">—</b><span>Upcoming</span></div>
    <div class="stat"><b id="sThisWeek">—</b><span>This week</span></div>
    <div class="stat"><b id="sAttended">—</b><span>Attended</span></div>
    <div class="stat"><b id="sCancelled">—</b><span>Cancelled / No Show</span></div>
  </div>

  <div id="listPanel" class="panel"><div class="empty">Loading lessons…</div></div>
  <div id="calendarPanel" class="panel" style="display:none"><div class="calendar" id="calendar"></div></div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <h2>New Lesson</h2>
    <form id="lessonForm">
      <div class="form">
        <div class="field full"><label>Student</label><select id="student" required><option value="">Choose student…</option></select></div>
        <div class="field"><label>Subject</label><select id="subject" required><option value="">Choose subject…</option></select></div>
        <div class="field"><label>Status</label><select id="status"><option>Scheduled</option><option>Attended</option><option>Cancelled</option><option>No Show</option></select></div>
        <div class="field"><label>Start</label><input id="start" type="datetime-local" required></div>
        <div class="field"><label>End</label><input id="end" type="datetime-local"></div>
        <div class="field full"><label>Zoom Link (optional)</label><input id="zoom" type="url" placeholder="https://…"></div>
      </div>
      <div id="formError" class="error"></div>
      <div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="save" id="save">Add Lesson</button></div>
    </form>
  </div>
</div>

<script>
const API="https://notion-calendar-api.nourmohsen12223.workers.dev";
let lessons=[],students=[],filter="all",view="list",month=new Date(); month.setDate(1);

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const studentById=id=>students.find(s=>s.id===id);
const lessonName=l=>studentById(l.studentPageId)?.name || l.title?.split(" — ")[0] || "Student";
const gradeOf=l=>studentById(l.studentPageId)?.grade || "";
const fmtTime=s=>s?new Intl.DateTimeFormat([], {hour:"numeric",minute:"2-digit"}).format(new Date(s)):"";
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();

async function load(){
  const now=new Date(), start=new Date(now); start.setFullYear(start.getFullYear()-1);
  const end=new Date(now); end.setFullYear(end.getFullYear()+1);
  try{
    const [lr,sr]=await Promise.all([
      fetch(`${API}/tutoring-lessons?start=${encodeURIComponent(start.toISOString())}&end=${encodeURIComponent(end.toISOString())}`).then(r=>r.json()),
      fetch(`${API}/tutoring-students`).then(r=>r.json())
    ]);
    if(!lr.success) throw new Error(lr.error||"Could not load lessons.");
    if(!sr.success) throw new Error(sr.error||"Could not load students.");
    lessons=lr.lessons||[]; students=sr.students||[];
    fillStudents(); render();
  }catch(e){document.getElementById("listPanel").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}

function fillStudents(){
  const sel=document.getElementById("student");
  sel.innerHTML='<option value="">Choose student…</option>'+students.filter(s=>!s.status||s.status==="Active").map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");
}
document.getElementById("student").addEventListener("change",()=>{
  const s=studentById(document.getElementById("student").value);
  const subjects=s?.subjects||[];
  document.getElementById("subject").innerHTML='<option value="">Choose subject…</option>'+subjects.map(x=>`<option>${esc(x)}</option>`).join("");
});

function visible(){
  const q=document.getElementById("search").value.trim().toLowerCase(), now=Date.now();
  return lessons.filter(l=>{
    const matches=!q || `${lessonName(l)} ${l.subject||""} ${gradeOf(l)}`.toLowerCase().includes(q);
    if(!matches)return false;
    if(filter==="upcoming")return l.start && new Date(l.start).getTime()>=now && !["Cancelled","No Show"].includes(l.status);
    if(filter!=="all")return l.status===filter;
    return true;
  });
}
function render(){
  const now=new Date(), weekEnd=new Date(now); weekEnd.setDate(now.getDate()+7);
  document.getElementById("sUpcoming").textContent=lessons.filter(l=>l.start&&new Date(l.start)>=now&&!["Cancelled","No Show"].includes(l.status)).length;
  document.getElementById("sThisWeek").textContent=lessons.filter(l=>l.start&&new Date(l.start)>=now&&new Date(l.start)<weekEnd&&!["Cancelled","No Show"].includes(l.status)).length;
  document.getElementById("sAttended").textContent=lessons.filter(l=>l.status==="Attended").length;
  document.getElementById("sCancelled").textContent=lessons.filter(l=>["Cancelled","No Show"].includes(l.status)).length;
  renderList(); renderCalendar();
}
function renderList(){
  const arr=visible().sort((a,b)=>new Date(a.start||0)-new Date(b.start||0));
  const panel=document.getElementById("listPanel");
  if(!arr.length){panel.innerHTML='<div class="empty">No lessons found.</div>';return}
  panel.innerHTML=arr.map(l=>{
    const d=new Date(l.start), st=(l.status||"Scheduled").toLowerCase().replace(/\s+/g,"-");
    const url=l.notionUrl||"#";
    return `<div class="lesson">
      <div class="datebox"><div class="day">${d.getDate()}</div><div class="mon">${d.toLocaleString([],{month:"short"})}</div></div>
      <div><div class="name">${esc(lessonName(l))}</div><div class="sub">${esc(gradeOf(l) ? "Grade "+gradeOf(l) : "")}</div></div>
      <div class="subjectcol"><div>${esc(l.subject||"—")}</div><div class="sub">${esc(d.toLocaleDateString([],{weekday:"long"}))}</div></div>
      <div><div class="time">${esc(fmtTime(l.start))}</div><div class="sub">${l.end?"to "+esc(fmtTime(l.end)):""}</div></div>
      <div class="statuscol"><span class="pill ${st}">${esc(l.status||"Scheduled")}</span></div>
      <a class="open" href="${esc(url)}" target="_top">View Lesson</a>
    </div>`;
  }).join("");
}
function renderCalendar(){
  const root=document.getElementById("calendar"), y=month.getFullYear(),m=month.getMonth();
  const first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  let cells="";
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const events=visible().filter(l=>l.start&&sameDay(new Date(l.start),d));
    cells+=`<div class="cell ${d.getMonth()!==m?"dim":""}"><div class="num">${d.getDate()}</div>${events.slice(0,4).map(l=>`<div class="event" onclick="openLesson('${esc(l.notionUrl||"")}')">${esc(fmtTime(l.start))} · ${esc(lessonName(l))}</div>`).join("")}${events.length>4?`<div class="sub">+${events.length-4} more</div>`:""}</div>`;
  }
  root.innerHTML=`<div class="cal-head"><button class="cal-nav" onclick="moveMonth(-1)">‹</button><b>${month.toLocaleDateString([],{month:"long",year:"numeric"})}</b><button class="cal-nav" onclick="moveMonth(1)">›</button></div><div class="weekdays">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div>${x}</div>`).join("")}</div><div class="grid">${cells}</div>`;
}
window.moveMonth=n=>{month=new Date(month.getFullYear(),month.getMonth()+n,1);renderCalendar()}
window.openLesson=u=>{if(u) window.top.location.href=u}

document.getElementById("filters").addEventListener("click",e=>{if(!e.target.dataset.filter)return;filter=e.target.dataset.filter;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===e.target));render()});
document.getElementById("search").addEventListener("input",render);
document.querySelectorAll(".view-toggle").forEach(b=>b.addEventListener("click",()=>{view=b.dataset.view;document.querySelectorAll(".view-toggle").forEach(x=>x.classList.toggle("active",x===b));document.getElementById("listPanel").style.display=view==="list"?"block":"none";document.getElementById("calendarPanel").style.display=view==="calendar"?"block":"none";render()}));

const modal=document.getElementById("modalBack");
document.getElementById("newLesson").onclick=()=>{
  document.getElementById("lessonForm").reset(); document.getElementById("subject").innerHTML='<option value="">Choose subject…</option>'; document.getElementById("formError").textContent="";
  const d=new Date(); d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0); const e=new Date(d.getTime()+60*60000);
  const local=x=>new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,16);
  document.getElementById("start").value=local(d);document.getElementById("end").value=local(e);modal.classList.add("show");
};
document.getElementById("cancel").onclick=()=>modal.classList.remove("show");
modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("show")});
document.getElementById("lessonForm").addEventListener("submit",async e=>{
  e.preventDefault(); const err=document.getElementById("formError"), save=document.getElementById("save"); err.textContent="";
  const sid=document.getElementById("student").value, s=studentById(sid), start=document.getElementById("start").value, end=document.getElementById("end").value;
  if(!s)return;
  save.disabled=true;save.textContent="Adding…";
  try{
    const r=await fetch(`${API}/tutoring-lessons`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      studentPageId:sid,studentName:s.name,subject:document.getElementById("subject").value,status:document.getElementById("status").value,
      start:new Date(start).toISOString(),end:end?new Date(end).toISOString():"",zoomLink:document.getElementById("zoom").value.trim()
    })});
    const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||"Could not create lesson.");
    modal.classList.remove("show");await load();
  }catch(ex){err.textContent=ex.message}finally{save.disabled=false;save.textContent="Add Lesson"}
});
load();
</script>
</body>
</html>
