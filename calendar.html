<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendar</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: #ffffff;
    color: #37352f;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
}

body {
    padding: 20px 22px 26px;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    min-height: 46px;
    margin-bottom: 14px;
}

.month-title {
    font-size: 32px;
    font-weight: 600;

    color: #37352f;

    letter-spacing: -0.4px;
    line-height: 1.2;
}

.controls {
    display: flex;
    align-items: center;
    gap: 5px;
}

.control-button {
    height: 34px;
    min-width: 34px;

    padding: 0 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 5px;

    background: transparent;

    color: #787774;

    font-size: 19px;

    cursor: pointer;
}

.control-button:hover {
    background: #f1f1ef;
}

.today-button {
    color: #37352f;

    font-size: 13px;
    font-weight: 500;

    padding: 0 11px;
}


/* =====================================================
   WEEKDAYS
===================================================== */

.weekdays {
    display: grid;

    grid-template-columns:
        repeat(7, minmax(0, 1fr));
}

.weekday {
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #9b9a97;

    font-size: 13px;
    font-weight: 400;
}


/* =====================================================
   CALENDAR GRID
===================================================== */

.calendar {
    display: grid;

    grid-template-columns:
        repeat(7, minmax(0, 1fr));

    border-top: 1px solid #e9e9e7;
    border-left: 1px solid #e9e9e7;
}


/* =====================================================
   DAY CELLS
===================================================== */

.day {
    position: relative;

    min-width: 0;
    height: 135px;

    padding: 8px 9px 7px;

    background: #fdfdfc;

    border-right: 1px solid #e9e9e7;
    border-bottom: 1px solid #e9e9e7;

    overflow: hidden;
}

.day.weekend {
    background: #fafaf9;
}


/* =====================================================
   DATE
===================================================== */

.date-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;

    min-height: 29px;

    margin-bottom: 4px;
}

.day-number {
    height: 28px;
    min-width: 28px;

    padding: 0 5px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #37352f;

    font-size: 14px;
    font-weight: 400;
}

.other-month .day-number {
    color: #b4b4b1;
}


/* =====================================================
   TODAY
===================================================== */

.current-day .day-number {
    width: 28px;
    height: 28px;

    padding: 0;

    background: #eb5757;
    color: #ffffff;

    font-weight: 600;
}


/* =====================================================
   EVENTS
===================================================== */

.events {
    width: 100%;
}

.event {
    width: 100%;
    min-height: 21px;

    display: flex;
    align-items: center;

    padding: 3px 6px;
    margin-bottom: 3px;

    border-radius: 3px;

    font-size: 12px;
    line-height: 15px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    cursor: pointer;

    transition:
        filter 0.15s ease,
        transform 0.1s ease;
}

.event:hover {
    filter: brightness(0.96);
}

.event:active {
    transform: scale(0.985);
}

.event-time {
    margin-right: 5px;

    font-size: 12px;
    font-weight: 500;

    flex-shrink: 0;
}

.event-title {
    min-width: 0;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.more {
    padding: 3px 5px;

    color: #9b9a97;

    font-size: 11px;
}


/* =====================================================
   EVENT DETAILS OVERLAY
===================================================== */

.event-overlay {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 22px;

    background: rgba(55, 53, 47, 0.18);

    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
}

.event-overlay.open {
    display: flex;
}


/* =====================================================
   EVENT DETAILS CARD
===================================================== */

.event-details {
    position: relative;

    width: min(420px, 100%);

    max-height: 80vh;

    overflow-y: auto;

    padding: 26px 28px 27px;

    background: #F5F4F1;

    border: 1px solid #E8E6E1;
    border-radius: 16px;

    box-shadow:
        0 12px 35px rgba(55, 53, 47, 0.12);
}


/* CLOSE */

.close-button {
    position: absolute;

    top: 13px;
    right: 13px;

    width: 32px;
    height: 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    border: none;
    border-radius: 50%;

    background: transparent;

    color: #8f8d88;

    font-size: 22px;
    font-weight: 300;

    line-height: 1;

    cursor: pointer;
}

.close-button:hover {
    background: #ebe9e4;

    color: #37352f;
}


/* COLOR DOT */

.detail-calendar-row {
    display: flex;
    align-items: center;

    gap: 8px;

    margin-bottom: 11px;

    padding-right: 35px;
}

.detail-color {
    width: 9px;
    height: 9px;

    flex-shrink: 0;

    border-radius: 50%;
}

.detail-calendar {
    color: #8f8d88;

    font-size: 11px;
    font-weight: 500;

    letter-spacing: 0.2px;
}


/* TITLE */

.detail-title {
    padding-right: 28px;

    color: #37352f;

    font-size: 21px;
    font-weight: 600;

    line-height: 1.3;

    letter-spacing: -0.25px;
}


/* DATE & TIME */

.detail-time {
    margin-top: 10px;

    color: #686762;

    font-size: 13px;

    line-height: 1.5;
}


/* EXTRA INFORMATION */

.detail-section {
    margin-top: 20px;
    padding-top: 17px;

    border-top: 1px solid #e4e2dc;
}

.detail-label {
    margin-bottom: 6px;

    color: #9b9994;

    font-size: 10px;
    font-weight: 600;

    letter-spacing: 0.8px;

    text-transform: uppercase;
}

.detail-value {
    color: #4d4b46;

    font-size: 13px;

    line-height: 1.55;

    white-space: pre-wrap;
    overflow-wrap: anywhere;
}


/* =====================================================
   LOADING / ERROR
===================================================== */

.status {
    padding: 40px 20px;

    text-align: center;

    color: #9b9a97;

    font-size: 13px;
}

.error {
    color: #eb5757;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 700px) {

    body {
        padding: 10px;
    }

    .month-title {
        font-size: 22px;
    }

    .weekday {
        font-size: 11px;
    }

    .day {
        height: 110px;
        padding: 5px;
    }

    .day-number {
        font-size: 13px;
    }

    .event {
        font-size: 10px;
        padding: 2px 4px;
    }

    .event-time {
        font-size: 10px;
    }

    .event-overlay {
        padding: 14px;
    }

    .event-details {
        padding: 23px 21px 24px;

        border-radius: 14px;
    }

    .detail-title {
        font-size: 19px;
    }

}

</style>
</head>


<body>


<div id="calendarWidget">

    <div class="header">

        <div
            id="monthTitle"
            class="month-title"
        ></div>


        <div class="controls">

            <button
                class="control-button"
                onclick="previousMonth()"
                title="Previous month"
            >
                ‹
            </button>


            <button
                class="control-button today-button"
                onclick="goToday()"
            >
                Today
            </button>


            <button
                class="control-button"
                onclick="nextMonth()"
                title="Next month"
            >
                ›
            </button>

        </div>

    </div>


    <div class="weekdays">

        <div class="weekday">Sun</div>
        <div class="weekday">Mon</div>
        <div class="weekday">Tue</div>
        <div class="weekday">Wed</div>
        <div class="weekday">Thu</div>
        <div class="weekday">Fri</div>
        <div class="weekday">Sat</div>

    </div>


    <div
        id="status"
        class="status"
    >
        Loading calendar…
    </div>


    <div
        id="calendar"
        class="calendar"
        style="display:none;"
    ></div>

</div>



<!-- =====================================================
     EVENT DETAILS
===================================================== -->

<div
    id="eventOverlay"
    class="event-overlay"
    aria-hidden="true"
>

    <div
        class="event-details"
        role="dialog"
        aria-modal="true"
        aria-labelledby="detailTitle"
    >

        <button
            id="closeEvent"
            class="close-button"
            aria-label="Close event details"
        >
            ×
        </button>


        <div class="detail-calendar-row">

            <div
                id="detailColor"
                class="detail-color"
            ></div>

            <div
                id="detailCalendar"
                class="detail-calendar"
            ></div>

        </div>


        <div
            id="detailTitle"
            class="detail-title"
        ></div>


        <div
            id="detailTime"
            class="detail-time"
        ></div>


        <div
            id="locationSection"
            class="detail-section"
            style="display:none;"
        >

            <div class="detail-label">
                Location
            </div>

            <div
                id="detailLocation"
                class="detail-value"
            ></div>

        </div>


        <div
            id="descriptionSection"
            class="detail-section"
            style="display:none;"
        >

            <div class="detail-label">
                Notes
            </div>

            <div
                id="detailDescription"
                class="detail-value"
            ></div>

        </div>

    </div>

</div>



<script>

/* =====================================================
   BACKEND
===================================================== */

const API_URL =
    "https://notion-calendar-api.nourmohsen12223.workers.dev/events";


let displayedDate =
    new Date();



/* =====================================================
   LOAD MONTH
===================================================== */

async function loadMonth() {

    const calendar =
        document.getElementById("calendar");

    const status =
        document.getElementById("status");


    calendar.style.display =
        "none";

    status.style.display =
        "block";

    status.className =
        "status";

    status.textContent =
        "Loading calendar…";


    const year =
        displayedDate.getFullYear();

    const month =
        displayedDate.getMonth();


    const firstOfMonth =
        new Date(
            year,
            month,
            1
        );


    const lastOfMonth =
        new Date(
            year,
            month + 1,
            0
        );


    /* First visible Sunday */

    const start =
        new Date(
            firstOfMonth
        );

    start.setDate(
        start.getDate() -
        start.getDay()
    );

    start.setHours(
        0,
        0,
        0,
        0
    );


    /* Day after final visible Saturday */

    const end =
        new Date(
            lastOfMonth
        );

    end.setDate(
        end.getDate() +
        (6 - end.getDay()) +
        1
    );

    end.setHours(
        0,
        0,
        0,
        0
    );


    try {

        const url =
            new URL(API_URL);


        url.searchParams.set(
            "timeMin",
            start.toISOString()
        );


        url.searchParams.set(
            "timeMax",
            end.toISOString()
        );


        const response =
            await fetch(
                url.toString()
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to load calendar."
            );

        }


        renderCalendar(
            data.events || []
        );


        status.style.display =
            "none";


        calendar.style.display =
            "grid";

    }

    catch (error) {

        console.error(error);


        status.className =
            "status error";


        status.textContent =
            "Unable to load calendar.";

    }

}



/* =====================================================
   RENDER CALENDAR
===================================================== */

function renderCalendar(events) {

    const year =
        displayedDate.getFullYear();

    const month =
        displayedDate.getMonth();


    document.getElementById(
        "monthTitle"
    ).textContent =

        displayedDate.toLocaleDateString(
            "en-US",
            {
                month: "long",
                year: "numeric"
            }
        );


    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML =
        "";


    /* First visible Sunday */

    const first =
        new Date(
            year,
            month,
            1
        );


    const gridStart =
        new Date(first);


    gridStart.setDate(
        1 -
        first.getDay()
    );


    /* Last visible Saturday */

    const last =
        new Date(
            year,
            month + 1,
            0
        );


    const gridEnd =
        new Date(last);


    gridEnd.setDate(
        last.getDate() +
        (6 - last.getDay())
    );


    const today =
        new Date();


    const cursor =
        new Date(
            gridStart
        );


    while (
        cursor <= gridEnd
    ) {

        const cellDate =
            new Date(
                cursor
            );


        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day";


        /* WEEKEND */

        if (
            cellDate.getDay() === 0 ||
            cellDate.getDay() === 6
        ) {

            cell.classList.add(
                "weekend"
            );

        }


        /* OTHER MONTH */

        if (
            cellDate.getMonth() !==
            month
        ) {

            cell.classList.add(
                "other-month"
            );

        }


        /* TODAY */

        if (
            sameDate(
                cellDate,
                today
            )
        ) {

            cell.classList.add(
                "current-day"
            );

        }


        /* DATE */

        const dateRow =
            document.createElement(
                "div"
            );


        dateRow.className =
            "date-row";


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "day-number";


        if (
            cellDate.getDate() === 1
        ) {

            number.textContent =

                cellDate.toLocaleDateString(
                    "en-US",
                    {
                        month: "short",
                        day: "numeric"
                    }
                );

        }

        else {

            number.textContent =
                cellDate.getDate();

        }


        dateRow.appendChild(
            number
        );


        cell.appendChild(
            dateRow
        );


        /* EVENTS */

        const eventsArea =
            document.createElement(
                "div"
            );


        eventsArea.className =
            "events";


        const dayEvents =
            events.filter(
                event =>
                    eventOccursOnDate(
                        event,
                        cellDate
                    )
            );


        dayEvents
            .slice(0, 4)
            .forEach(
                event => {

                    const eventDiv =
                        document.createElement(
                            "div"
                        );


                    eventDiv.className =
                        "event";


                    eventDiv.style.backgroundColor =
                        event.calendarColor ||
                        "#e9e9e7";


                    eventDiv.style.color =
                        event.calendarTextColor ||
                        "#37352f";


                    eventDiv.setAttribute(
                        "role",
                        "button"
                    );


                    eventDiv.setAttribute(
                        "tabindex",
                        "0"
                    );


                    /* TIME */

                    if (
                        event.start?.dateTime
                    ) {

                        const time =
                            new Date(
                                event.start.dateTime
                            ).toLocaleTimeString(
                                [],
                                {
                                    hour: "numeric",
                                    minute: "2-digit"
                                }
                            );


                        const timeSpan =
                            document.createElement(
                                "span"
                            );


                        timeSpan.className =
                            "event-time";


                        timeSpan.textContent =
                            time;


                        eventDiv.appendChild(
                            timeSpan
                        );

                    }


                    /* TITLE */

                    const title =
                        document.createElement(
                            "span"
                        );


                    title.className =
                        "event-title";


                    title.textContent =
                        event.summary ||
                        "Event";


                    eventDiv.appendChild(
                        title
                    );


                    /* OPEN DETAILS ON TAP */

                    eventDiv.addEventListener(
                        "click",
                        () => {
                            openEventDetails(event);
                        }
                    );


                    /* KEYBOARD SUPPORT */

                    eventDiv.addEventListener(
                        "keydown",
                        eventKey => {

                            if (
                                eventKey.key === "Enter" ||
                                eventKey.key === " "
                            ) {

                                eventKey.preventDefault();

                                openEventDetails(
                                    event
                                );

                            }

                        }
                    );


                    eventsArea.appendChild(
                        eventDiv
                    );

                }
            );


        /* MORE */

        if (
            dayEvents.length > 4
        ) {

            const more =
                document.createElement(
                    "div"
                );


            more.className =
                "more";


            more.textContent =

                "+" +

                (
                    dayEvents.length -
                    4
                )

                +

                " more";


            eventsArea.appendChild(
                more
            );

        }


        cell.appendChild(
            eventsArea
        );


        calendar.appendChild(
            cell
        );


        cursor.setDate(
            cursor.getDate() + 1
        );

    }

}



/* =====================================================
   OPEN EVENT DETAILS
===================================================== */

function openEventDetails(event) {

    const overlay =
        document.getElementById(
            "eventOverlay"
        );


    const color =
        document.getElementById(
            "detailColor"
        );


    const calendar =
        document.getElementById(
            "detailCalendar"
        );


    const title =
        document.getElementById(
            "detailTitle"
        );


    const time =
        document.getElementById(
            "detailTime"
        );


    const locationSection =
        document.getElementById(
            "locationSection"
        );


    const location =
        document.getElementById(
            "detailLocation"
        );


    const descriptionSection =
        document.getElementById(
            "descriptionSection"
        );


    const description =
        document.getElementById(
            "detailDescription"
        );


    /* CALENDAR */

    color.style.backgroundColor =
        event.calendarColor ||
        "#9b9a97";


    calendar.textContent =
        event.calendarName ||
        "Calendar";


    /* TITLE */

    title.textContent =
        event.summary ||
        "Event";


    /* DATE & TIME */

    time.textContent =
        formatEventDateTime(
            event
        );


    /* LOCATION */

    if (
        event.location &&
        event.location.trim()
    ) {

        location.textContent =
            event.location;

        locationSection.style.display =
            "block";

    }

    else {

        location.textContent =
            "";

        locationSection.style.display =
            "none";

    }


    /* DESCRIPTION */

    if (
        event.description &&
        event.description.trim()
    ) {

        description.textContent =
            event.description;

        descriptionSection.style.display =
            "block";

    }

    else {

        description.textContent =
            "";

        descriptionSection.style.display =
            "none";

    }


    overlay.classList.add(
        "open"
    );


    overlay.setAttribute(
        "aria-hidden",
        "false"
    );


    document.getElementById(
        "closeEvent"
    ).focus();

}



/* =====================================================
   FORMAT EVENT DATE & TIME
===================================================== */

function formatEventDateTime(event) {

    /* ALL-DAY */

    if (
        event.start?.date
    ) {

        const parts =
            event.start.date
                .split("-")
                .map(Number);


        const date =
            new Date(
                parts[0],
                parts[1] - 1,
                parts[2]
            );


        return (
            date.toLocaleDateString(
                "en-US",
                {
                    weekday: "long",
                    month: "long",
                    day: "numeric",
                    year: "numeric"
                }
            )
            +
            " · All day"
        );

    }


    /* TIMED EVENT */

    if (
        event.start?.dateTime
    ) {

        const start =
            new Date(
                event.start.dateTime
            );


        const dateText =
            start.toLocaleDateString(
                "en-US",
                {
                    weekday: "long",
                    month: "long",
                    day: "numeric",
                    year: "numeric"
                }
            );


        const startTime =
            start.toLocaleTimeString(
                [],
                {
                    hour: "numeric",
                    minute: "2-digit"
                }
            );


        if (
            event.end?.dateTime
        ) {

            const end =
                new Date(
                    event.end.dateTime
                );


            const endTime =
                end.toLocaleTimeString(
                    [],
                    {
                        hour: "numeric",
                        minute: "2-digit"
                    }
                );


            return (
                dateText +
                " · " +
                startTime +
                " – " +
                endTime
            );

        }


        return (
            dateText +
            " · " +
            startTime
        );

    }


    return "";

}



/* =====================================================
   CLOSE EVENT DETAILS
===================================================== */

function closeEventDetails() {

    const overlay =
        document.getElementById(
            "eventOverlay"
        );


    overlay.classList.remove(
        "open"
    );


    overlay.setAttribute(
        "aria-hidden",
        "true"
    );

}



/* CLOSE BUTTON */

document.getElementById(
    "closeEvent"
).addEventListener(
    "click",
    closeEventDetails
);



/* CLICK OUTSIDE CARD */

document.getElementById(
    "eventOverlay"
).addEventListener(
    "click",
    event => {

        if (
            event.target.id ===
            "eventOverlay"
        ) {

            closeEventDetails();

        }

    }
);



/* ESC KEY */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeEventDetails();

        }

    }
);



/* =====================================================
   EVENT DATE CHECK
===================================================== */

function eventOccursOnDate(
    event,
    date
) {

    /* ALL-DAY EVENT */

    if (
        event.start?.date
    ) {

        const parts =
            event.start.date
                .split("-")
                .map(Number);


        return (

            parts[0] ===
                date.getFullYear()

            &&

            parts[1] ===
                date.getMonth() + 1

            &&

            parts[2] ===
                date.getDate()

        );

    }


    /* TIMED EVENT */

    if (
        event.start?.dateTime
    ) {

        const eventDate =
            new Date(
                event.start.dateTime
            );


        return sameDate(
            eventDate,
            date
        );

    }


    return false;

}



/* =====================================================
   SAME DATE
===================================================== */

function sameDate(
    a,
    b
) {

    return (

        a.getFullYear() ===
            b.getFullYear()

        &&

        a.getMonth() ===
            b.getMonth()

        &&

        a.getDate() ===
            b.getDate()

    );

}



/* =====================================================
   NAVIGATION
===================================================== */

function previousMonth() {

    displayedDate =
        new Date(
            displayedDate.getFullYear(),
            displayedDate.getMonth() - 1,
            1
        );


    loadMonth();

}


function nextMonth() {

    displayedDate =
        new Date(
            displayedDate.getFullYear(),
            displayedDate.getMonth() + 1,
            1
        );


    loadMonth();

}


function goToday() {

    displayedDate =
        new Date();


    loadMonth();

}



/* =====================================================
   START AUTOMATICALLY
===================================================== */

loadMonth();

</script>
