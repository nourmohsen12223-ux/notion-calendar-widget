<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendar</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: #ffffff;
    color: #e8e4d8;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
}

body {
    padding: 20px 22px 26px;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    min-height: 46px;
    margin-bottom: 14px;
}

.month-title {
    font-size: 32px;
    font-weight: 600;

    color: #37352f;

    letter-spacing: -0.4px;
    line-height: 1.2;
}

.controls {
    display: flex;
    align-items: center;
    gap: 5px;
}

.control-button {
    height: 34px;
    min-width: 34px;

    padding: 0 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 5px;

    background: transparent;

    color: #787774;

    font-size: 19px;

    cursor: pointer;
}

.control-button:hover {
    background: #f1f1ef;
}

.today-button {
    color: #37352f;

    font-size: 13px;
    font-weight: 500;

    padding: 0 11px;
}


/* =====================================================
   WEEKDAYS
===================================================== */

.weekdays {
    display: grid;

    grid-template-columns:
        repeat(7, minmax(0, 1fr));
}

.weekday {
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #9b9a97;

    font-size: 13px;
    font-weight: 400;
}


/* =====================================================
   CALENDAR GRID
===================================================== */

.calendar {
    display: grid;

    grid-template-columns:
        repeat(7, minmax(0, 1fr));

    border-top: 1px solid #e9e9e7;
    border-left: 1px solid #e9e9e7;
}


/* =====================================================
   DAY CELLS
===================================================== */

.day {
    position: relative;

    min-width: 0;
    height: 135px;

    padding: 8px 9px 7px;

    background: #fdfdfc;

    border-right: 1px solid #e9e9e7;
    border-bottom: 1px solid #e9e9e7;

    overflow: hidden;
}

.day.weekend {
    background: #fafaf9;
}


/* =====================================================
   DATE
===================================================== */

.date-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;

    min-height: 29px;

    margin-bottom: 4px;
}

.day-number {
    height: 28px;
    min-width: 28px;

    padding: 0 5px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #37352f;

    font-size: 14px;
    font-weight: 400;
}

.other-month .day-number {
    color: #b4b4b1;
}


/* =====================================================
   TODAY
===================================================== */

.current-day .day-number {
    width: 28px;
    height: 28px;

    padding: 0;

    background: #eb5757;
    color: #ffffff;

    font-weight: 600;
}


/* =====================================================
   EVENTS
===================================================== */

.events {
    width: 100%;
}

.event {
    width: 100%;
    min-height: 21px;

    display: flex;
    align-items: center;

    padding: 3px 6px;
    margin-bottom: 3px;

    border-radius: 3px;

    font-size: 12px;
    line-height: 15px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.event-time {
    margin-right: 5px;

    font-size: 12px;
    font-weight: 500;

    flex-shrink: 0;
}

.event-title {
    min-width: 0;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.more {
    padding: 3px 5px;

    color: #9b9a97;

    font-size: 11px;
}


/* =====================================================
   LOADING / ERROR
===================================================== */

.status {
    padding: 40px 20px;

    text-align: center;

    color: #9b9a97;

    font-size: 13px;
}

.error {
    color: #eb5757;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 700px) {

    body {
        padding: 10px;
    }

    .month-title {
        font-size: 22px;
    }

    .weekday {
        font-size: 11px;
    }

    .day {
        height: 110px;
        padding: 5px;
    }

    .day-number {
        font-size: 13px;
    }

    .event {
        font-size: 10px;
        padding: 2px 4px;
    }

    .event-time {
        font-size: 10px;
    }

}

</style>
</head>


<body>


<div id="calendarWidget">

    <div class="header">

        <div
            id="monthTitle"
            class="month-title"
        ></div>


        <div class="controls">

            <button
                class="control-button"
                onclick="previousMonth()"
                title="Previous month"
            >
                ‹
            </button>


            <button
                class="control-button today-button"
                onclick="goToday()"
            >
                Today
            </button>


            <button
                class="control-button"
                onclick="nextMonth()"
                title="Next month"
            >
                ›
            </button>

        </div>

    </div>


    <div class="weekdays">

        <div class="weekday">Sun</div>
        <div class="weekday">Mon</div>
        <div class="weekday">Tue</div>
        <div class="weekday">Wed</div>
        <div class="weekday">Thu</div>
        <div class="weekday">Fri</div>
        <div class="weekday">Sat</div>

    </div>


    <div
        id="status"
        class="status"
    >
        Loading calendar…
    </div>


    <div
        id="calendar"
        class="calendar"
        style="display:none;"
    ></div>

</div>



<script>

/* =====================================================
   BACKEND
===================================================== */

const API_URL =
    "https://notion-calendar-api.nourmohsen12223.workers.dev/events";


let displayedDate =
    new Date();



/* =====================================================
   LOAD MONTH
===================================================== */

async function loadMonth() {

    const calendar =
        document.getElementById("calendar");

    const status =
        document.getElementById("status");


    calendar.style.display =
        "none";

    status.style.display =
        "block";

    status.className =
        "status";

    status.textContent =
        "Loading calendar…";


    const year =
        displayedDate.getFullYear();

    const month =
        displayedDate.getMonth();


    const firstOfMonth =
        new Date(
            year,
            month,
            1
        );


    const lastOfMonth =
        new Date(
            year,
            month + 1,
            0
        );


    /*
       First visible Sunday
    */

    const start =
        new Date(
            firstOfMonth
        );

    start.setDate(
        start.getDate() -
        start.getDay()
    );

    start.setHours(
        0,
        0,
        0,
        0
    );


    /*
       Day after final visible Saturday
    */

    const end =
        new Date(
            lastOfMonth
        );

    end.setDate(
        end.getDate() +
        (6 - end.getDay()) +
        1
    );

    end.setHours(
        0,
        0,
        0,
        0
    );


    try {

        const url =
            new URL(API_URL);


        url.searchParams.set(
            "timeMin",
            start.toISOString()
        );


        url.searchParams.set(
            "timeMax",
            end.toISOString()
        );


        const response =
            await fetch(
                url.toString()
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to load calendar."
            );

        }


        renderCalendar(
            data.events || []
        );


        status.style.display =
            "none";


        calendar.style.display =
            "grid";

    }

    catch (error) {

        console.error(error);


        status.className =
            "status error";


        status.textContent =
            "Unable to load calendar.";

    }

}



/* =====================================================
   RENDER CALENDAR
===================================================== */

function renderCalendar(events) {

    const year =
        displayedDate.getFullYear();

    const month =
        displayedDate.getMonth();


    document.getElementById(
        "monthTitle"
    ).textContent =

        displayedDate.toLocaleDateString(
            "en-US",
            {
                month: "long",
                year: "numeric"
            }
        );


    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML =
        "";


    /*
       First visible Sunday
    */

    const first =
        new Date(
            year,
            month,
            1
        );


    const gridStart =
        new Date(first);


    gridStart.setDate(
        1 -
        first.getDay()
    );


    /*
       Last visible Saturday
    */

    const last =
        new Date(
            year,
            month + 1,
            0
        );


    const gridEnd =
        new Date(last);


    gridEnd.setDate(
        last.getDate() +
        (6 - last.getDay())
    );


    const today =
        new Date();


    const cursor =
        new Date(
            gridStart
        );


    while (
        cursor <= gridEnd
    ) {

        const cellDate =
            new Date(
                cursor
            );


        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day";


        /* WEEKEND */

        if (
            cellDate.getDay() === 0 ||
            cellDate.getDay() === 6
        ) {

            cell.classList.add(
                "weekend"
            );

        }


        /* OTHER MONTH */

        if (
            cellDate.getMonth() !==
            month
        ) {

            cell.classList.add(
                "other-month"
            );

        }


        /* TODAY */

        if (
            sameDate(
                cellDate,
                today
            )
        ) {

            cell.classList.add(
                "current-day"
            );

        }


        /* DATE */

        const dateRow =
            document.createElement(
                "div"
            );


        dateRow.className =
            "date-row";


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "day-number";


        if (
            cellDate.getDate() === 1
        ) {

            number.textContent =

                cellDate.toLocaleDateString(
                    "en-US",
                    {
                        month: "short",
                        day: "numeric"
                    }
                );

        }

        else {

            number.textContent =
                cellDate.getDate();

        }


        dateRow.appendChild(
            number
        );


        cell.appendChild(
            dateRow
        );


        /* EVENTS */

        const eventsArea =
            document.createElement(
                "div"
            );


        eventsArea.className =
            "events";


        const dayEvents =
            events.filter(
                event =>
                    eventOccursOnDate(
                        event,
                        cellDate
                    )
            );


        dayEvents
            .slice(0, 4)
            .forEach(
                event => {

                    const eventDiv =
                        document.createElement(
                            "div"
                        );


                    eventDiv.className =
                        "event";


                    eventDiv.style.backgroundColor =
                        event.calendarColor;


                    eventDiv.style.color =
                        event.calendarTextColor;


                    /* TIME */

                    if (
                        event.start?.dateTime
                    ) {

                        const time =
                            new Date(
                                event.start.dateTime
                            ).toLocaleTimeString(
                                [],
                                {
                                    hour: "numeric",
                                    minute: "2-digit"
                                }
                            );


                        const timeSpan =
                            document.createElement(
                                "span"
                            );


                        timeSpan.className =
                            "event-time";


                        timeSpan.textContent =
                            time;


                        eventDiv.appendChild(
                            timeSpan
                        );

                    }


                    /* TITLE */

                    const title =
                        document.createElement(
                            "span"
                        );


                    title.className =
                        "event-title";


                    title.textContent =
                        event.summary ||
                        "Event";


                    eventDiv.appendChild(
                        title
                    );


                    eventDiv.title =

                        (
                            event.calendarName
                            ?
                            event.calendarName +
                            " — "
                            :
                            ""
                        )

                        +

                        (
                            event.summary ||
                            "Event"
                        );


                    eventsArea.appendChild(
                        eventDiv
                    );

                }
            );


        /* MORE */

        if (
            dayEvents.length > 4
        ) {

            const more =
                document.createElement(
                    "div"
                );


            more.className =
                "more";


            more.textContent =

                "+" +

                (
                    dayEvents.length -
                    4
                )

                +

                " more";


            eventsArea.appendChild(
                more
            );

        }


        cell.appendChild(
            eventsArea
        );


        calendar.appendChild(
            cell
        );


        cursor.setDate(
            cursor.getDate() + 1
        );

    }

}



/* =====================================================
   EVENT DATE CHECK
===================================================== */

function eventOccursOnDate(
    event,
    date
) {

    /*
       All-day event
    */

    if (
        event.start?.date
    ) {

        const parts =
            event.start.date
                .split("-")
                .map(Number);


        return (

            parts[0] ===
                date.getFullYear()

            &&

            parts[1] ===
                date.getMonth() + 1

            &&

            parts[2] ===
                date.getDate()

        );

    }


    /*
       Timed event
    */

    if (
        event.start?.dateTime
    ) {

        const eventDate =
            new Date(
                event.start.dateTime
            );


        return sameDate(
            eventDate,
            date
        );

    }


    return false;

}



/* =====================================================
   SAME DATE
===================================================== */

function sameDate(
    a,
    b
) {

    return (

        a.getFullYear() ===
            b.getFullYear()

        &&

        a.getMonth() ===
            b.getMonth()

        &&

        a.getDate() ===
            b.getDate()

    );

}



/* =====================================================
   NAVIGATION
===================================================== */

function previousMonth() {

    displayedDate =
        new Date(
            displayedDate.getFullYear(),
            displayedDate.getMonth() - 1,
            1
        );


    loadMonth();

}


function nextMonth() {

    displayedDate =
        new Date(
            displayedDate.getFullYear(),
            displayedDate.getMonth() + 1,
            1
        );


    loadMonth();

}


function goToday() {

    displayedDate =
        new Date();


    loadMonth();

}



/* =====================================================
   START AUTOMATICALLY
===================================================== */

loadMonth();

</script>

</body>
</html>
