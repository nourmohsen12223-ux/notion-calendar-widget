<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Date</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: transparent;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

    color: #37352F;
}

body {
    padding: 12px;
}


/* =====================================================
   DATE WIDGET
===================================================== */

.date-widget {

    width: 100%;
    height: 150px;

    display: flex;
    align-items: center;

    padding: 22px 38px;

    background: #F5F4F1;

    border: 1px solid #E8E6E1;
    border-radius: 16px;

    overflow: hidden;
}


/* =====================================================
   LEFT SIDE
===================================================== */

.date-left {

    width: 285px;

    display: flex;
    flex-direction: column;

    justify-content: center;

    padding-left: 20px;
}


/* WEEKDAY */

.weekday {

    margin-bottom: 3px;

    color: #8F8D88;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 15px;
    font-weight: 400;

    letter-spacing: 4px;

    text-transform: uppercase;
}


/* LARGE DAY NUMBER */

.day-number {

    color: #7A0026;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 74px;
    font-weight: 400;

    line-height: 0.92;

    letter-spacing: -3px;
}


/* =====================================================
   DIVIDER
===================================================== */

.divider {

    width: 1px;
    height: 105px;

    margin: 0 48px 0 15px;

    background: #DDDAD3;

    flex-shrink: 0;
}


/* =====================================================
   RIGHT SIDE
===================================================== */

.date-right {

    display: flex;
    flex-direction: column;

    justify-content: center;

    min-width: 0;
}


/* MONTH */

.month {

    color: #37352F;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 24px;
    font-weight: 400;

    letter-spacing: 6px;

    text-transform: uppercase;

    white-space: nowrap;
}


/* YEAR */

.year {

    margin-top: 11px;

    color: #9B9994;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 17px;
    font-weight: 400;

    letter-spacing: 5px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 600px) {

    body {
        padding: 8px;
    }

    .date-widget {

        height: 135px;

        padding: 18px 22px;

        border-radius: 14px;
    }

    .date-left {

        width: 155px;

        padding-left: 5px;
    }

    .weekday {

        font-size: 11px;

        letter-spacing: 3px;
    }

    .day-number {

        font-size: 62px;
    }

    .divider {

        height: 90px;

        margin-left: 8px;
        margin-right: 28px;
    }

    .month {

        font-size: 18px;

        letter-spacing: 4px;
    }

    .year {

        margin-top: 8px;

        font-size: 13px;

        letter-spacing: 4px;
    }

}

</style>

</head>


<body>


<div class="date-widget">


    <!-- LEFT SIDE -->

    <div class="date-left">

        <div
            id="weekday"
            class="weekday"
        ></div>

        <div
            id="dayNumber"
            class="day-number"
        ></div>

    </div>



    <!-- DIVIDER -->

    <div class="divider"></div>



    <!-- RIGHT SIDE -->

    <div class="date-right">

        <div
            id="month"
            class="month"
        ></div>

        <div
            id="year"
            class="year"
        ></div>

    </div>


</div>



<script>

/* =====================================================
   UPDATE DATE
===================================================== */

function updateDate() {


    const now =
        new Date();



    /* WEEKDAY */

    document.getElementById(
        "weekday"
    ).textContent =

        now.toLocaleDateString(
            "en-US",
            {
                weekday: "long"
            }
        );



    /* DAY NUMBER */

    document.getElementById(
        "dayNumber"
    ).textContent =

        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );



    /* MONTH */

    document.getElementById(
        "month"
    ).textContent =

        now.toLocaleDateString(
            "en-US",
            {
                month: "long"
            }
        );



    /* YEAR */

    document.getElementById(
        "year"
    ).textContent =

        now.getFullYear();


}



/* =====================================================
   LOAD
===================================================== */

updateDate();



/* =====================================================
   KEEP DATE CURRENT
===================================================== */

setInterval(
    updateDate,
    60000
);

</script>


</body>

</html>
