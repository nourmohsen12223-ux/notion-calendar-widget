<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lessons</title>
<style>
:root{--ink:#37352F;--muted:#8F8B84;--line:#DDDAD5;--soft:#F7F6F3;--green:#8BAF98;--greenSoft:#E8EFE9}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:0}
.toolbar{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;padding-top:4px}
.filters,.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tools{width:100%;padding-right:4px}
.search{flex:1}
.new{margin-left:auto;min-width:142px}
button,.search,input,select{font:inherit}
.tab,.new,.view-toggle,.secondary,.save,.cal-nav{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;color:var(--ink);cursor:pointer}
.tab.active,.view-toggle.active{background:var(--soft);font-weight:650}
.search{border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-width:230px;color:var(--ink)}
.new,.save{background:#6F786E!important;color:#fff!important;border-color:#6F786E!important;font-weight:650}
.view-switch{display:flex;gap:7px}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.stat{border:1px solid var(--line);border-radius:13px;padding:16px;background:#fff}
.stat b{font-family:Georgia,serif;font-size:24px;font-weight:600;display:block}
.stat span{font-size:12px;color:var(--muted);margin-top:4px}
.panel{border:1px solid var(--line);border-radius:13px;background:#fff;overflow:hidden}
.lesson{display:grid;grid-template-columns:74px minmax(170px,1.5fr) minmax(120px,1fr) 110px 105px auto;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.lesson:last-child{border-bottom:0}
.datebox{text-align:center}.datebox .day{font-family:Georgia,serif;font-size:22px;font-weight:600}.datebox .mon{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.name{font-family:Georgia,serif;font-size:20px;font-weight:600}
.sub,.empty{font-size:12px;color:var(--muted);margin-top:4px}.time{font-weight:650}
.pill{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px}
.pill.attended{background:#E8EFE9;color:#52705C}
.pill.no-show{background:#E8EEF5;color:#506A86}
.pill.cancelled{background:#F5E7E5;color:#9A4E49}
.pill.scheduled{background:#F0ECE8;color:#6F6A63}
.open{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);text-decoration:none;font-size:13px;background:#FAF9F7;white-space:nowrap}
.lessonActions{display:flex;gap:7px;align-items:center}
.deleteBtn{border:1px solid #E7C9C6;background:#FFF9F8;color:#A24C4C;border-radius:9px;padding:10px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.empty{padding:40px;text-align:center}
.calendar{padding:16px}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.cal-head b{font-family:Georgia,serif;font-size:20px;font-weight:600}
.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{padding:7px;text-align:center;color:var(--muted);font-size:11px}
.cell{min-height:100px;border-top:1px solid #EEEDEB;border-right:1px solid #EEEDEB;padding:7px}.cell:nth-child(7n){border-right:0}.cell.dim{color:#C2BEB8}.num{font-size:11px;margin-bottom:5px}.event{font-size:11px;background:var(--soft);border-radius:6px;padding:4px 5px;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.modal-back{position:fixed;inset:0;background:rgba(55,53,47,.18);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-back.show{display:flex}
.modal{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 12px 40px rgba(55,53,47,.12)}
.modal h2{font-family:Georgia,serif;font-size:23px;font-weight:600;margin:0 0 18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:650}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#A9A59E}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.error{color:#A24C4C;font-size:12px;margin-top:12px;min-height:16px}button:disabled{opacity:.55;cursor:default}
@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.summary{grid-template-columns:1fr 1fr}.search{min-width:0;flex:1}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.lesson{grid-template-columns:58px 1fr auto}.lesson .subjectcol{display:none}.lesson .statuscol{grid-column:2}.open{grid-column:3;grid-row:1/3}}
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <div class="filters" id="filters">
      <button class="tab active" data-filter="all">All Lessons</button>
      <button class="tab" data-filter="upcoming">Upcoming</button>
    <button class="tab" data-filter="history">Lesson History</button>
      <button class="tab" data-filter="Attended">Attended</button>
      <button class="tab" data-filter="Cancelled">Cancelled</button>
      <button class="tab" data-filter="No Show">No Show</button>
    </div>
    <div class="tools">
      <input id="search" class="search" placeholder="Search student or subject…">
      <div class="view-switch">
        <button class="view-toggle active" data-view="list">List</button>
        <button class="view-toggle" data-view="calendar">Calendar</button>
      </div>
      <button class="new" id="newLesson">+ New Lesson</button>
    </div>
  </div>

  <div class="summary">
    <div class="stat"><b id="sUpcoming">—</b><span>Upcoming</span></div>
    <div class="stat"><b id="sThisWeek">—</b><span>This week</span></div>
    <div class="stat"><b id="sAttended">—</b><span>Attended</span></div>
    <div class="stat"><b id="sCancelled">—</b><span>Cancelled / No Show</span></div>
  </div>

  <div id="listPanel" class="panel"><div class="empty">Loading lessons…</div></div>
  <div id="calendarPanel" class="panel" style="display:none"><div class="calendar" id="calendar"></div></div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <h2>New Lesson</h2>
    <form id="lessonForm">
      <div class="form">
        <div class="field full"><label>Student</label><select id="student" required><option value="">Choose student…</option><option value="__add_student__">+ Add Student…</option></select></div>
        <div class="field"><label>Subject</label><select id="subject" required><option value="">Choose subject…</option></select></div>
        <div class="field"><label>Status</label><select id="status"><option>Scheduled</option><option>Attended</option><option>Cancelled</option><option>No Show</option></select></div>
        <div class="field"><label>Start</label><input id="start" type="datetime-local" required></div>
        <div class="field"><label>End</label><input id="end" type="datetime-local"></div>
        <div class="field full"><label>Zoom Link (optional)</label><input id="zoom" type="url" placeholder="https://…"></div>
      </div>
      <div id="formError" class="error"></div>
      <div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="save" id="save">Add Lesson</button></div>
    </form>
  </div>
</div>


<div class="modal-back" id="studentModalBack">
  <div class="modal">
    <h2>Add New Student</h2>
    <form id="studentForm">
      <div class="form">
        <div class="field full"><label>Student Name</label><input id="newStudentName" required autocomplete="off" placeholder="e.g. Gabriella Darby"></div>
        <div class="field"><label>Grade</label><input id="newGrade" autocomplete="off" placeholder="e.g. 12"></div>
        <div class="field"><label>Status</label><select id="newStudentStatus"><option value="Active" selected>Active</option><option value="Inactive">Inactive</option></select></div>
        <div class="field full"><label>Subject</label><input id="newSubjects" autocomplete="off" placeholder="e.g. Biology"></div>
        <div class="field full"><label>Google Chat</label><input id="newGoogleChat" type="url" autocomplete="off" placeholder="Optional URL"></div>
      </div>
      <div id="studentFormError" class="error"></div>
      <div class="actions"><button type="button" class="secondary" id="studentCancel">Cancel</button><button class="save" id="studentSave">Add Student</button></div>
    </form>
  </div>
</div>

<script>
const API="https://notion-calendar-api.nourmohsen12223.workers.dev";
let lessons=[],students=[],filter="all",view="list",month=new Date(); month.setDate(1);

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const studentById=id=>students.find(s=>s.id===id);
const lessonName=l=>studentById(l.studentPageId)?.name || l.title?.split(" — ")[0] || "Student";
const gradeOf=l=>studentById(l.studentPageId)?.grade || "";
const fmtTime=s=>s?new Intl.DateTimeFormat([], {hour:"numeric",minute:"2-digit"}).format(new Date(s)):"";
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();

async function load(){
  const now=new Date(), start=new Date(now); start.setFullYear(start.getFullYear()-1);
  const end=new Date(now); end.setFullYear(end.getFullYear()+1);
  try{
    const [lr,sr]=await Promise.all([
      fetch(`${API}/tutoring-lessons?start=${encodeURIComponent(start.toISOString())}&end=${encodeURIComponent(end.toISOString())}`).then(r=>r.json()),
      fetch(`${API}/tutoring-students`).then(r=>r.json())
    ]);
    if(!lr.success) throw new Error(lr.error||"Could not load lessons.");
    if(!sr.success) throw new Error(sr.error||"Could not load students.");
    lessons=lr.lessons||[]; students=sr.students||[];
    fillStudents(); render();
  }catch(e){document.getElementById("listPanel").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}

function fillStudents(){
  const sel=document.getElementById("student");
  sel.innerHTML='<option value="">Choose student…</option><option value="__add_student__">+ Add Student…</option>'+students.filter(s=>!s.status||s.status==="Active").map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");
}
document.getElementById("student").addEventListener("change",()=>{
  const value=document.getElementById("student").value;
  if(value==="__add_student__"){
    document.getElementById("student").value="";
    modal.classList.remove("show");
    openStudentModal();
    return;
  }
  const s=studentById(value);
  const subjects=s?.subjects||[];
  document.getElementById("subject").innerHTML='<option value="">Choose subject…</option>'+subjects.map(x=>`<option>${esc(x)}</option>`).join("");
});

function visible(){
  const q=document.getElementById("search").value.trim().toLowerCase(), now=Date.now();
  return lessons.filter(l=>{
    const matches=!q || `${lessonName(l)} ${l.subject||""} ${gradeOf(l)}`.toLowerCase().includes(q);
    if(!matches)return false;
    if(filter==="upcoming")return l.start && new Date(l.start).getTime()>=now && !["Cancelled","No Show"].includes(l.status);
    if(filter==="history")return l.start && new Date(l.start).getTime()<now;
    if(filter!=="all")return l.status===filter;
    return true;
  });
}
function render(){
  const now=new Date(), weekEnd=new Date(now); weekEnd.setDate(now.getDate()+7);
  document.getElementById("sUpcoming").textContent=lessons.filter(l=>l.start&&new Date(l.start)>=now&&!["Cancelled","No Show"].includes(l.status)).length;
  document.getElementById("sThisWeek").textContent=lessons.filter(l=>l.start&&new Date(l.start)>=now&&new Date(l.start)<weekEnd&&!["Cancelled","No Show"].includes(l.status)).length;
  document.getElementById("sAttended").textContent=lessons.filter(l=>l.status==="Attended").length;
  document.getElementById("sCancelled").textContent=lessons.filter(l=>["Cancelled","No Show"].includes(l.status)).length;
  renderList(); renderCalendar();
}
function renderList(){
  const arr=visible().sort((a,b)=>{
    const ta=new Date(a.start||0).getTime(), tb=new Date(b.start||0).getTime();
    return filter==="history" ? tb-ta : ta-tb;
  });
  const panel=document.getElementById("listPanel");
  if(!arr.length){panel.innerHTML='<div class="empty">No lessons found.</div>';return}
  panel.innerHTML=arr.map(l=>{
    const d=new Date(l.start), st=(l.status||"Scheduled").toLowerCase().replace(/\s+/g,"-");
    const url=l.notionUrl||("https://www.notion.so/"+String(l.id||"").replace(/-/g,""));
    return `<div class="lesson">
      <div class="datebox"><div class="day">${d.getDate()}</div><div class="mon">${d.toLocaleString([],{month:"short"})}</div></div>
      <div><div class="name">${esc(lessonName(l))}</div><div class="sub">${esc(gradeOf(l) ? "Grade "+gradeOf(l) : "")}</div></div>
      <div class="subjectcol"><div>${esc(l.subject||"—")}</div><div class="sub">${esc(d.toLocaleDateString([],{weekday:"long"}))}</div></div>
      <div><div class="time">${esc(fmtTime(l.start))}</div><div class="sub">${l.end?"to "+esc(fmtTime(l.end)):""}</div></div>
      <div class="statuscol"><span class="pill ${st}">${esc(l.status||"Scheduled")}</span></div>
      <div class="lessonActions"><a class="open" href="${esc(url)}" target="_top">View Lesson</a><button class="deleteBtn" type="button" data-delete-lesson="${esc(l.id)}">Delete</button></div>
    </div>`;
  }).join("");
}
function renderCalendar(){
  const root=document.getElementById("calendar"), y=month.getFullYear(),m=month.getMonth();
  const first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  let cells="";
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const events=visible().filter(l=>l.start&&sameDay(new Date(l.start),d));
    cells+=`<div class="cell ${d.getMonth()!==m?"dim":""}"><div class="num">${d.getDate()}</div>${events.slice(0,4).map(l=>`<div class="event" onclick="openLesson('${esc(l.notionUrl||"")}')">${esc(fmtTime(l.start))} · ${esc(lessonName(l))}</div>`).join("")}${events.length>4?`<div class="sub">+${events.length-4} more</div>`:""}</div>`;
  }
  root.innerHTML=`<div class="cal-head"><button class="cal-nav" onclick="moveMonth(-1)">‹</button><b>${month.toLocaleDateString([],{month:"long",year:"numeric"})}</b><button class="cal-nav" onclick="moveMonth(1)">›</button></div><div class="weekdays">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div>${x}</div>`).join("")}</div><div class="grid">${cells}</div>`;
}
window.moveMonth=n=>{month=new Date(month.getFullYear(),month.getMonth()+n,1);renderCalendar()}
window.openLesson=u=>{if(u) window.top.location.href=u}
document.getElementById("listPanel").addEventListener("click",async e=>{
  const b=e.target.closest("[data-delete-lesson]");
  if(!b)return;
  const id=b.dataset.deleteLesson, lesson=lessons.find(x=>x.id===id);
  if(!confirm(`Delete ${lessonName(lesson||{})} lesson? This will archive it in Notion.`))return;
  b.disabled=true;
  try{
    const r=await fetch(`${API}/tutoring-lessons`,{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({lessonId:id})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.success)throw new Error(d.error||"Could not delete lesson.");
    await load();
  }catch(err){alert("Could not delete lesson: "+err.message);b.disabled=false}
});

document.getElementById("filters").addEventListener("click",e=>{if(!e.target.dataset.filter)return;filter=e.target.dataset.filter;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===e.target));render()});
document.getElementById("search").addEventListener("input",render);
document.querySelectorAll(".view-toggle").forEach(b=>b.addEventListener("click",()=>{view=b.dataset.view;document.querySelectorAll(".view-toggle").forEach(x=>x.classList.toggle("active",x===b));document.getElementById("listPanel").style.display=view==="list"?"block":"none";document.getElementById("calendarPanel").style.display=view==="calendar"?"block":"none";render()}));

const modal=document.getElementById("modalBack");
document.getElementById("newLesson").onclick=()=>{
  document.getElementById("lessonForm").reset(); document.getElementById("subject").innerHTML='<option value="">Choose subject…</option>'; document.getElementById("formError").textContent="";
  const d=new Date(); d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0); const e=new Date(d.getTime()+60*60000);
  const local=x=>new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,16);
  document.getElementById("start").value=local(d);document.getElementById("end").value=local(e);modal.classList.add("show");
};
document.getElementById("cancel").onclick=()=>modal.classList.remove("show");
modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("show")});

const studentModal=document.getElementById("studentModalBack");
function openStudentModal(){
  document.getElementById("studentForm").reset();
  document.getElementById("newStudentStatus").value="Active";
  document.getElementById("studentFormError").textContent="";
  studentModal.classList.add("show");
  setTimeout(()=>document.getElementById("newStudentName").focus(),50);
}
function closeStudentModal(returnToLesson=true){
  studentModal.classList.remove("show");
  if(returnToLesson) modal.classList.add("show");
}
document.getElementById("studentCancel").onclick=()=>closeStudentModal(true);
studentModal.addEventListener("click",e=>{if(e.target===studentModal)closeStudentModal(true)});

document.getElementById("studentForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const save=document.getElementById("studentSave");
  const err=document.getElementById("studentFormError");
  const name=document.getElementById("newStudentName").value.trim();
  const grade=document.getElementById("newGrade").value.trim().replace(/^grade\s*/i,"");
  const subjects=document.getElementById("newSubjects").value.split(",").map(x=>x.trim()).filter(Boolean);
  const googleChat=document.getElementById("newGoogleChat").value.trim();
  if(!name)return;
  save.disabled=true; save.textContent="Saving…"; err.textContent="";
  try{
    const r=await fetch(`${API}/tutoring-students-create`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,grade,subjects,status:document.getElementById("newStudentStatus").value,googleChat})
    });
    const d=await r.json();
    if(!r.ok||!d.success) throw new Error(d.error||"Could not create student.");
    const created=d.student;
    students.push(created);
    fillStudents();
    document.getElementById("student").value=created.id;
    document.getElementById("subject").innerHTML='<option value="">Choose subject…</option>'+(created.subjects||[]).map(x=>`<option>${esc(x)}</option>`).join("");
    if((created.subjects||[]).length===1) document.getElementById("subject").value=created.subjects[0];
    closeStudentModal(true);
  }catch(ex){err.textContent=ex.message}
  finally{save.disabled=false;save.textContent="Add Student"}
});

document.getElementById("lessonForm").addEventListener("submit",async e=>{
  e.preventDefault(); const err=document.getElementById("formError"), save=document.getElementById("save"); err.textContent="";
  const sid=document.getElementById("student").value, s=studentById(sid), start=document.getElementById("start").value, end=document.getElementById("end").value;
  if(!s)return;
  save.disabled=true;save.textContent="Adding…";
  try{
    const r=await fetch(`${API}/tutoring-lessons`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      studentPageId:sid,studentName:s.name,subject:document.getElementById("subject").value,status:document.getElementById("status").value,
      start:new Date(start).toISOString(),end:end?new Date(end).toISOString():"",zoomLink:document.getElementById("zoom").value.trim()
    })});
    const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||"Could not create lesson.");
    modal.classList.remove("show");await load();
  }catch(ex){err.textContent=ex.message}finally{save.disabled=false;save.textContent="Add Lesson"}
});
load();
</script>
</body>
</html>
