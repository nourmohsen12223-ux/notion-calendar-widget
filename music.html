<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nour's Most Played</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#f5f5f5}
body{padding:4px}
.shell{
  width:100%; background:#202020; border-radius:26px; overflow:hidden;
  border:1px solid rgba(255,255,255,.07); box-shadow:0 12px 32px rgba(0,0,0,.16)
}
.header{
  padding:20px 22px 16px; background:linear-gradient(145deg,#383838,#252525);
  display:flex;align-items:center;gap:14px
}
.mark{
  width:54px;height:54px;flex:0 0 54px;border-radius:16px;
  display:grid;place-items:center;font-family:Georgia,serif;font-size:27px;
  background:linear-gradient(145deg,#8f1738,#42101f);box-shadow:0 6px 18px rgba(0,0,0,.25)
}
h1{font-size:19px;margin:0 0 4px;font-weight:700}
.sub{font-size:12px;color:#aaa7a3}
.list{padding:10px}
.track{padding:8px;border-radius:18px}
.track+.track{margin-top:3px}
.track-label{display:flex;align-items:center;gap:10px;padding:0 7px 7px}
.num{font-size:11px;color:#817f7b;width:16px;text-align:center}
.track-label strong{display:block;font-size:12px;font-weight:600;direction:rtl;text-align:left}
.track-label small{display:block;margin-top:2px;font-size:10px;color:#989590;direction:rtl;text-align:left}
.frame-wrap{border-radius:17px;overflow:hidden;background:#171717;height:190px}
iframe{display:block;width:100%;height:190px;border:0}
.note{font-size:10px;color:#77736f;text-align:center;padding:3px 15px 15px}
@media(max-width:500px){
  .shell{border-radius:22px}.header{padding:16px 17px 13px}
  .mark{width:46px;height:46px;flex-basis:46px;border-radius:14px;font-size:23px}
  h1{font-size:17px}.list{padding:7px}
  .track{padding:6px}.frame-wrap,iframe{height:190px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="mark">ن</div>
    <div><h1>Nour's Most Played</h1><div class="sub">Play directly with Anghami</div></div>
  </div>
  <div class="list">
    <div class="track">
  <div class="track-label"><span class="num">1</span><div><strong>أهواك</strong><small>فيروز</small></div></div>
  <div class="frame-wrap">
    <iframe
      src="https://widget.anghami.com/song/69301389/?theme=fulldark&layout=wide&lang=en"
      scrolling="no" frameborder="0"
      allow="autoplay; encrypted-media"
      loading="lazy"
      title="أهواك — فيروز"></iframe>
  </div>
</div>
<div class="track">
  <div class="track-label"><span class="num">2</span><div><strong>حبّوا بعضهن</strong><small>فيروز</small></div></div>
  <div class="frame-wrap">
    <iframe
      src="https://widget.anghami.com/song/294834/?theme=fulldark&layout=wide&lang=en"
      scrolling="no" frameborder="0"
      allow="autoplay; encrypted-media"
      loading="lazy"
      title="حبّوا بعضهن — فيروز"></iframe>
  </div>
</div>
<div class="track">
  <div class="track-label"><span class="num">3</span><div><strong>عمرى معاك</strong><small>أنغام</small></div></div>
  <div class="frame-wrap">
    <iframe
      src="https://widget.anghami.com/song/103016/?theme=fulldark&layout=wide&lang=en"
      scrolling="no" frameborder="0"
      allow="autoplay; encrypted-media"
      loading="lazy"
      title="عمرى معاك — أنغام"></iframe>
  </div>
</div>
<div class="track">
  <div class="track-label"><span class="num">4</span><div><strong>برضه بتوحشني</strong><small>أنغام و وائل كفوري</small></div></div>
  <div class="frame-wrap">
    <iframe
      src="https://widget.anghami.com/song/1024471022/?theme=fulldark&layout=wide&lang=en"
      scrolling="no" frameborder="0"
      allow="autoplay; encrypted-media"
      loading="lazy"
      title="برضه بتوحشني — أنغام و وائل كفوري"></iframe>
  </div>
</div>
  </div>
  <div class="note">Playback is provided by Anghami's official embedded player.</div>
</div>
</body>
</html>
