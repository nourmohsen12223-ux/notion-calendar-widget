.grid {
  width: 94%;
  margin: 0 auto;

  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));

  column-gap: 36px;
  row-gap: 18px;

  align-items: stretch;
}

.card-title {
  margin: 0 0 12px 0;

  color: #57544F;

  font-size: 13px;
  font-weight: 650;

  letter-spacing: 0.75px;
  text-transform: uppercase;
}
