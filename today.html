<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Today's Schedule</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: #37352f;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
}

body {
    padding: 12px;
}


/* =====================================================
   MAIN WIDGET
===================================================== */

.widget-container {
    width: 100%;

    background: #F5EBDD;

    border: 1px solid #E7D8C5;
    border-radius: 16px;

    overflow: hidden;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    padding: 22px 24px 19px;
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.title {
    font-size: 26px;
    font-weight: 600;

    letter-spacing: -0.45px;
    line-height: 1.2;

    color: #37352f;
}

.today-badge {
    flex-shrink: 0;

    padding: 5px 10px;

    border-radius: 20px;

    background: #EADBC8;

    color: #756A5E;

    font-size: 10px;
    font-weight: 600;

    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.date {
    margin-top: 6px;

    color: #8E8377;

    font-size: 13px;
}


/* =====================================================
   EVENTS
===================================================== */

.events {
    width: 100%;

    border-top: 1px solid #E7D8C5;
}


/* =====================================================
   EVENT ROW
===================================================== */

.event {
    position: relative;

    display: grid;

    grid-template-columns:
        90px
        20px
        minmax(0, 1fr);

    align-items: center;

    min-height: 68px;

    padding: 11px 24px;

    border-bottom: 1px solid #E7D8C5;

    transition: background-color 0.15s ease;
}

.event:last-child {
    border-bottom: none;
}

.event:hover {
    background: rgba(255, 255, 255, 0.28);
}


/* =====================================================
   TIME
===================================================== */

.time-column {
    font-size: 12px;
    line-height: 1.4;

    color: #81766A;
}

.start-time {
    color: #4B453F;

    font-weight: 600;
}

.end-time {
    margin-top: 1px;

    color: #9D9185;
}

.all-day {
    color: #756A5E;

    font-weight: 500;
}


/* =====================================================
   CALENDAR DOT
===================================================== */

.dot-column {
    display: flex;
    align-items: center;
}

.calendar-dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    flex-shrink: 0;
}


/* =====================================================
   EVENT CONTENT
===================================================== */

.event-content {
    min-width: 0;
}

.event-title {
    display: flex;
    align-items: center;

    min-width: 0;

    color: #37352f;

    font-size: 14px;
    font-weight: 550;

    line-height: 1.35;
}

.event-title-text {
    min-width: 0;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.event-meta {
    margin-top: 4px;

    display: flex;
    align-items: center;

    min-width: 0;

    color: #8E8377;

    font-size: 11px;
}

.calendar-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =====================================================
   CURRENT EVENT
===================================================== */

.event.current {
    background: rgba(255, 255, 255, 0.38);
}

.event.current::before {
    content: "";

    position: absolute;

    left: 0;
    top: 12px;
    bottom: 12px;

    width: 3px;

    border-radius: 0 3px 3px 0;

    background: #EB5757;
}

.now {
    display: inline-flex;
    align-items: center;

    flex-shrink: 0;

    margin-left: 9px;

    color: #EB5757;

    font-size: 9px;
    font-weight: 700;

    letter-spacing: 0.5px;
}

.now-dot {
    width: 6px;
    height: 6px;

    margin-right: 4px;

    border-radius: 50%;

    background: #EB5757;
}


/* =====================================================
   STATUS
===================================================== */

.status {
    padding: 42px 20px;

    border-top: 1px solid #E7D8C5;

    color: #8E8377;

    font-size: 13px;

    text-align: center;
}

.empty-icon {
    margin-bottom: 8px;

    color: #B5A695;

    font-size: 20px;
}

.error {
    color: #EB5757;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 500px) {

    body {
        padding: 8px;
    }

    .widget-container {
        border-radius: 14px;
    }

    .header {
        padding: 18px 18px 16px;
    }

    .title {
        font-size: 22px;
    }

    .event {
        grid-template-columns:
            75px
            17px
            minmax(0, 1fr);

        padding: 10px 18px;
    }

}

</style>
</head>


<body>

<div class="widget-container">


    <!-- HEADER -->

    <div class="header">

        <div class="header-top">

            <div class="title">
                Today's Schedule
            </div>

            <div class="today-badge">
                Today
            </div>

        </div>


        <div
            id="todayDate"
            class="date"
        ></div>

    </div>



    <!-- STATUS -->

    <div
        id="status"
        class="status"
    >
        Loading today's schedule…
    </div>



    <!-- EVENTS -->

    <div
        id="events"
        class="events"
        style="display:none;"
    ></div>


</div>



<script>

/* =====================================================
   BACKEND
===================================================== */

const API_URL =
    "https://notion-calendar-api.nourmohsen12223.workers.dev/events";


/* =====================================================
   DATE
===================================================== */

const today =
    new Date();


document.getElementById(
    "todayDate"
).textContent =

    today.toLocaleDateString(
        "en-US",
        {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        }
    );


/* =====================================================
   LOAD EVENTS
===================================================== */

async function loadToday() {

    const status =
        document.getElementById("status");

    const container =
        document.getElementById("events");


    const start =
        new Date();

    start.setHours(
        0,
        0,
        0,
        0
    );


    const end =
        new Date(start);

    end.setDate(
        end.getDate() + 1
    );


    try {

        const url =
            new URL(API_URL);


        url.searchParams.set(
            "timeMin",
            start.toISOString()
        );


        url.searchParams.set(
            "timeMax",
            end.toISOString()
        );


        const response =
            await fetch(
                url.toString()
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to load events."
            );

        }


        const events =
            data.events || [];


        if (events.length === 0) {

            container.style.display =
                "none";

            status.style.display =
                "block";

            status.className =
                "status";

            status.innerHTML =
                '<div class="empty-icon">○</div>' +
                'Nothing scheduled for today';

            return;
        }


        status.style.display =
            "none";

        container.style.display =
            "block";


        renderEvents(events);

    }

    catch (error) {

        console.error(error);


        container.style.display =
            "none";

        status.style.display =
            "block";

        status.className =
            "status error";

        status.textContent =
            "Unable to load today's schedule.";

    }

}


/* =====================================================
   RENDER EVENTS
===================================================== */

function renderEvents(events) {

    const container =
        document.getElementById(
            "events"
        );


    container.innerHTML = "";


    events.forEach(event => {


        const card =
            document.createElement(
                "div"
            );

        card.className =
            "event";


        let isCurrent =
            false;


        if (
            event.start?.dateTime &&
            event.end?.dateTime
        ) {

            const now =
                new Date();

            const eventStart =
                new Date(
                    event.start.dateTime
                );

            const eventEnd =
                new Date(
                    event.end.dateTime
                );


            if (
                now >= eventStart &&
                now < eventEnd
            ) {

                isCurrent =
                    true;

                card.classList.add(
                    "current"
                );

            }

        }


        /* TIME */

        const timeColumn =
            document.createElement(
                "div"
            );

        timeColumn.className =
            "time-column";


        if (event.start?.dateTime) {

            const startTime =
                new Date(
                    event.start.dateTime
                );


            const endTime =
                event.end?.dateTime
                    ? new Date(
                        event.end.dateTime
                    )
                    : null;


            const startDiv =
                document.createElement(
                    "div"
                );

            startDiv.className =
                "start-time";

            startDiv.textContent =
                formatTime(
                    startTime
                );


            timeColumn.appendChild(
                startDiv
            );


            if (endTime) {

                const endDiv =
                    document.createElement(
                        "div"
                    );

                endDiv.className =
                    "end-time";

                endDiv.textContent =
                    formatTime(
                        endTime
                    );


                timeColumn.appendChild(
                    endDiv
                );

            }

        }

        else {

            const allDay =
                document.createElement(
                    "div"
                );

            allDay.className =
                "all-day";

            allDay.textContent =
                "All day";


            timeColumn.appendChild(
                allDay
            );

        }


        /* COLOR DOT */

        const dotColumn =
            document.createElement(
                "div"
            );

        dotColumn.className =
            "dot-column";


        const dot =
            document.createElement(
                "div"
            );

        dot.className =
            "calendar-dot";

        dot.style.backgroundColor =
            event.calendarColor ||
            "#9B8B78";


        dotColumn.appendChild(
            dot
        );


        /* CONTENT */

        const content =
            document.createElement(
                "div"
            );

        content.className =
            "event-content";


        const title =
            document.createElement(
                "div"
            );

        title.className =
            "event-title";


        const titleText =
            document.createElement(
                "span"
            );

        titleText.className =
            "event-title-text";

        titleText.textContent =
            event.summary ||
            "Event";


        title.appendChild(
            titleText
        );


        /* NOW */

        if (isCurrent) {

            const now =
                document.createElement(
                    "span"
                );

            now.className =
                "now";


            const nowDot =
                document.createElement(
                    "span"
                );

            nowDot.className =
                "now-dot";


            now.appendChild(
                nowDot
            );

            now.appendChild(
                document.createTextNode(
                    "NOW"
                )
            );


            title.appendChild(
                now
            );

        }


        /* CALENDAR NAME */

        const meta =
            document.createElement(
                "div"
            );

        meta.className =
            "event-meta";


        if (event.calendarName) {

            const calendarName =
                document.createElement(
                    "span"
                );

            calendarName.className =
                "calendar-name";

            calendarName.textContent =
                event.calendarName;


            meta.appendChild(
                calendarName
            );

        }


        content.appendChild(
            title
        );


        if (event.calendarName) {

            content.appendChild(
                meta
            );

        }


        /* BUILD */

        card.appendChild(
            timeColumn
        );

        card.appendChild(
            dotColumn
        );

        card.appendChild(
            content
        );


        container.appendChild(
            card
        );

    });

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(date) {

    return date.toLocaleTimeString(
        [],
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );

}


/* =====================================================
   START
===================================================== */

loadToday();

</script>

</body>
</html>
