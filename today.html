<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Today</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: transparent;
    color: #37352F;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
}

body {
    padding: 12px;
}


/* =====================================================
   MAIN WIDGET
===================================================== */

.widget-container {
    width: 100%;

    background: #F5F4F1;

    border: 1px solid #E8E6E1;
    border-radius: 16px;

    overflow: hidden;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    padding: 22px 24px 19px;
}

.title {
    color: #37352F;

    font-size: 26px;
    font-weight: 600;

    line-height: 1.2;
    letter-spacing: -0.45px;
}

.date {
    margin-top: 6px;

    color: #8F8D88;

    font-size: 13px;
}


/* =====================================================
   EVENT LIST
===================================================== */

.events {
    width: 100%;

    border-top: 1px solid #E8E6E1;
}


/* =====================================================
   EVENT
===================================================== */

.event {
    position: relative;

    display: grid;

    grid-template-columns:
        90px
        20px
        minmax(0, 1fr);

    align-items: center;

    min-height: 68px;

    padding: 11px 24px;

    border-bottom: 1px solid #E8E6E1;

    transition: background-color 0.15s ease;
}

.event:last-child {
    border-bottom: none;
}

.event:hover {
    background: rgba(255, 255, 255, 0.55);
}


/* =====================================================
   TIME
===================================================== */

.time-column {
    color: #85827D;

    font-size: 12px;
    line-height: 1.4;
}

.start-time {
    color: #45433F;

    font-weight: 600;
}

.end-time {
    margin-top: 1px;

    color: #A09D97;
}

.all-day {
    color: #77746E;

    font-weight: 500;
}


/* =====================================================
   CALENDAR COLOR
===================================================== */

.dot-column {
    display: flex;
    align-items: center;
}

.calendar-dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    flex-shrink: 0;
}


/* =====================================================
   EVENT CONTENT
===================================================== */

.event-content {
    min-width: 0;
}

.event-title {
    display: flex;
    align-items: center;

    min-width: 0;

    color: #37352F;

    font-size: 14px;
    font-weight: 550;

    line-height: 1.35;
}

.event-title-text {
    min-width: 0;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.event-meta {
    display: flex;
    align-items: center;

    min-width: 0;

    margin-top: 4px;

    color: #8F8D88;

    font-size: 11px;
}

.calendar-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =====================================================
   CURRENT EVENT
===================================================== */

.event.current {
    background: rgba(255, 255, 255, 0.62);
}

.event.current::before {
    content: "";

    position: absolute;

    left: 0;
    top: 12px;
    bottom: 12px;

    width: 3px;

    background: #EB5757;

    border-radius: 0 3px 3px 0;
}

.now {
    display: inline-flex;
    align-items: center;

    flex-shrink: 0;

    margin-left: 9px;

    color: #EB5757;

    font-size: 9px;
    font-weight: 700;

    letter-spacing: 0.5px;
}

.now-dot {
    width: 6px;
    height: 6px;

    margin-right: 4px;

    background: #EB5757;

    border-radius: 50%;
}


/* =====================================================
   LOADING / EMPTY / ERROR
===================================================== */

.status {
    padding: 42px 20px;

    border-top: 1px solid #E8E6E1;

    color: #8F8D88;

    font-size: 13px;

    text-align: center;
}

.empty-icon {
    margin-bottom: 8px;

    color: #AAA7A1;

    font-size: 20px;
}

.error {
    color: #EB5757;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

    body {
        padding: 8px;
    }

    .widget-container {
        border-radius: 14px;
    }

    .header {
        padding: 18px 18px 16px;
    }

    .title {
        font-size: 22px;
    }

    .event {
        grid-template-columns:
            75px
            17px
            minmax(0, 1fr);

        padding: 10px 18px;
    }

}

</style>

</head>


<body>


<div class="widget-container">


    <!-- HEADER -->

    <div class="header">

        <div class="title">
            Today
        </div>

        <div
            id="todayDate"
            class="date"
        ></div>

    </div>



    <!-- LOADING / EMPTY MESSAGE -->

    <div
        id="status"
        class="status"
    >
        Loading today's events…
    </div>



    <!-- EVENTS -->

    <div
        id="events"
        class="events"
        style="display:none;"
    ></div>


</div>



<script>

/* =====================================================
   CLOUDFLARE BACKEND
===================================================== */

const API_URL =
    "https://notion-calendar-api.nourmohsen12223.workers.dev/events";



/* =====================================================
   TODAY'S DATE
===================================================== */

const today =
    new Date();


document.getElementById(
    "todayDate"
).textContent =

    today.toLocaleDateString(
        "en-US",
        {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        }
    );



/* =====================================================
   LOAD TODAY'S EVENTS
===================================================== */

async function loadToday() {


    const status =
        document.getElementById(
            "status"
        );


    const container =
        document.getElementById(
            "events"
        );


    /* START OF TODAY */

    const start =
        new Date();


    start.setHours(
        0,
        0,
        0,
        0
    );


    /* START OF TOMORROW */

    const end =
        new Date(
            start
        );


    end.setDate(
        end.getDate() + 1
    );


    try {


        const url =
            new URL(
                API_URL
            );


        url.searchParams.set(
            "timeMin",
            start.toISOString()
        );


        url.searchParams.set(
            "timeMax",
            end.toISOString()
        );


        const response =
            await fetch(
                url.toString()
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to load events."
            );

        }


        const events =
            data.events || [];


        /* NO EVENTS */

        if (
            events.length === 0
        ) {


            container.style.display =
                "none";


            status.style.display =
                "block";


            status.className =
                "status";


            status.innerHTML =
                '<div class="empty-icon">○</div>' +
                'Nothing scheduled for today';


            return;

        }


        /* EVENTS FOUND */

        status.style.display =
            "none";


        container.style.display =
            "block";


        renderEvents(
            events
        );


    }

    catch (error) {


        console.error(
            error
        );


        container.style.display =
            "none";


        status.style.display =
            "block";


        status.className =
            "status error";


        status.textContent =
            "Unable to load today's events.";


    }

}



/* =====================================================
   RENDER EVENTS
===================================================== */

function renderEvents(
    events
) {


    const container =
        document.getElementById(
            "events"
        );


    container.innerHTML =
        "";


    events.forEach(
        event => {


            /* EVENT ROW */

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "event";


            let isCurrent =
                false;



            /* CHECK IF EVENT IS HAPPENING NOW */

            if (
                event.start?.dateTime &&
                event.end?.dateTime
            ) {


                const now =
                    new Date();


                const eventStart =
                    new Date(
                        event.start.dateTime
                    );


                const eventEnd =
                    new Date(
                        event.end.dateTime
                    );


                if (
                    now >= eventStart &&
                    now < eventEnd
                ) {


                    isCurrent =
                        true;


                    card.classList.add(
                        "current"
                    );


                }

            }



            /* TIME COLUMN */

            const timeColumn =
                document.createElement(
                    "div"
                );


            timeColumn.className =
                "time-column";


            if (
                event.start?.dateTime
            ) {


                const startTime =
                    new Date(
                        event.start.dateTime
                    );


                const endTime =
                    event.end?.dateTime
                        ?
                        new Date(
                            event.end.dateTime
                        )
                        :
                        null;



                /* START TIME */

                const startDiv =
                    document.createElement(
                        "div"
                    );


                startDiv.className =
                    "start-time";


                startDiv.textContent =
                    formatTime(
                        startTime
                    );


                timeColumn.appendChild(
                    startDiv
                );



                /* END TIME */

                if (
                    endTime
                ) {


                    const endDiv =
                        document.createElement(
                            "div"
                        );


                    endDiv.className =
                        "end-time";


                    endDiv.textContent =
                        formatTime(
                            endTime
                        );


                    timeColumn.appendChild(
                        endDiv
                    );


                }


            }

            else {


                /* ALL DAY */

                const allDay =
                    document.createElement(
                        "div"
                    );


                allDay.className =
                    "all-day";


                allDay.textContent =
                    "All day";


                timeColumn.appendChild(
                    allDay
                );


            }



            /* CALENDAR COLOR DOT */

            const dotColumn =
                document.createElement(
                    "div"
                );


            dotColumn.className =
                "dot-column";


            const dot =
                document.createElement(
                    "div"
                );


            dot.className =
                "calendar-dot";


            dot.style.backgroundColor =
                event.calendarColor ||
                "#8F8D88";


            dotColumn.appendChild(
                dot
            );



            /* EVENT CONTENT */

            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "event-content";



            /* EVENT TITLE */

            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "event-title";


            const titleText =
                document.createElement(
                    "span"
                );


            titleText.className =
                "event-title-text";


            titleText.textContent =
                event.summary ||
                "Event";


            title.appendChild(
                titleText
            );



            /* NOW INDICATOR */

            if (
                isCurrent
            ) {


                const now =
                    document.createElement(
                        "span"
                    );


                now.className =
                    "now";


                const nowDot =
                    document.createElement(
                        "span"
                    );


                nowDot.className =
                    "now-dot";


                now.appendChild(
                    nowDot
                );


                now.appendChild(
                    document.createTextNode(
                        "NOW"
                    )
                );


                title.appendChild(
                    now
                );


            }



            /* CALENDAR NAME */

            const meta =
                document.createElement(
                    "div"
                );


            meta.className =
                "event-meta";


            if (
                event.calendarName
            ) {


                const calendarName =
                    document.createElement(
                        "span"
                    );


                calendarName.className =
                    "calendar-name";


                calendarName.textContent =
                    event.calendarName;


                meta.appendChild(
                    calendarName
                );


            }



            /* BUILD EVENT CONTENT */

            content.appendChild(
                title
            );


            if (
                event.calendarName
            ) {


                content.appendChild(
                    meta
                );


            }



            /* ADD EVERYTHING TO EVENT ROW */

            card.appendChild(
                timeColumn
            );


            card.appendChild(
                dotColumn
            );


            card.appendChild(
                content
            );


            container.appendChild(
                card
            );


        }
    );

}



/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(
    date
) {


    return date.toLocaleTimeString(
        [],
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );


}



/* =====================================================
   START
===================================================== */

loadToday();

</script>


</body>

</html>
