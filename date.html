<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Date</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: transparent;
}

body {
    padding: 1px 7px 8px;
}


/* ==========================================
   DATE WIDGET
========================================== */

.date-widget {

    width: 100%;
    min-height: 148px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #F5F4F1;

    border: 1px solid #E8E6E1;
    border-radius: 16px;

    padding: 20px 36px;
}


/* ==========================================
   CONTENT
========================================== */

.date-content {

    display: flex;
    align-items: center;

    width: 100%;
    max-width: 720px;
}


/* ==========================================
   BIG DATE
========================================== */

.day-number {

    min-width: 170px;

    text-align: center;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 76px;
    font-weight: 400;

    line-height: 1;

    color: #756968;
}


/* ==========================================
   DIVIDER
========================================== */

.divider {

    width: 1px;
    height: 88px;

    flex-shrink: 0;

    background: #DDDAD3;

    margin: 0 42px;
}


/* ==========================================
   RIGHT SIDE
========================================== */

.date-details {

    display: flex;
    flex-direction: column;
    justify-content: center;

    min-width: 0;
}


/* WEEKDAY */

.weekday {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 20px;
    font-weight: 400;

    letter-spacing: 6px;

    color: #37352F;

    text-transform: uppercase;

    margin-bottom: 15px;
}


/* MONTH + YEAR */

.month-year {

    display: flex;
    align-items: center;
    gap: 14px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 14px;

    letter-spacing: 4px;

    text-transform: uppercase;

    color: #6F6B67;
}


.year {

    color: #9B9892;
}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 550px) {

    .date-widget {

        min-height: 125px;

        padding: 18px 20px;
    }


    .day-number {

        min-width: 105px;

        font-size: 60px;
    }


    .divider {

        height: 70px;

        margin: 0 22px;
    }


    .weekday {

        font-size: 15px;

        letter-spacing: 4px;

        margin-bottom: 12px;
    }


    .month-year {

        font-size: 11px;

        letter-spacing: 2px;

        gap: 9px;
    }

}


@media (max-width: 370px) {

    .day-number {

        min-width: 80px;

        font-size: 50px;
    }


    .divider {

        margin: 0 15px;
    }


    .weekday {

        font-size: 13px;

        letter-spacing: 3px;
    }


    .month-year {

        font-size: 10px;

        letter-spacing: 1.5px;
    }

}

</style>

</head>


<body>


<div class="date-widget">

    <div class="date-content">


        <!-- LARGE DATE -->

        <div
            id="dayNumber"
            class="day-number"
        >
            04
        </div>


        <!-- DIVIDER -->

        <div class="divider"></div>


        <!-- DATE DETAILS -->

        <div class="date-details">

            <div
                id="weekday"
                class="weekday"
            >
                SUNDAY
            </div>


            <div class="month-year">

                <span id="month">
                    OCTOBER
                </span>

                <span
                    id="year"
                    class="year"
                >
                    2026
                </span>

            </div>

        </div>


    </div>

</div>



<script>

/* ==========================================
   UPDATE DATE
========================================== */

function updateDate() {

    const now =
        new Date();


    const weekdays = [

        "SUNDAY",
        "MONDAY",
        "TUESDAY",
        "WEDNESDAY",
        "THURSDAY",
        "FRIDAY",
        "SATURDAY"

    ];


    const months = [

        "JANUARY",
        "FEBRUARY",
        "MARCH",
        "APRIL",
        "MAY",
        "JUNE",
        "JULY",
        "AUGUST",
        "SEPTEMBER",
        "OCTOBER",
        "NOVEMBER",
        "DECEMBER"

    ];


    /* DATE */

    document.getElementById(
        "dayNumber"
    ).textContent =

        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    /* WEEKDAY */

    document.getElementById(
        "weekday"
    ).textContent =

        weekdays[
            now.getDay()
        ];


    /* MONTH */

    document.getElementById(
        "month"
    ).textContent =

        months[
            now.getMonth()
        ];


    /* YEAR */

    document.getElementById(
        "year"
    ).textContent =

        now.getFullYear();

}


/* ==========================================
   START
========================================== */

updateDate();


/*
Check every minute so the widget
automatically changes after midnight.
*/

setInterval(
    updateDate,
    60000
);

</script>


</body>

</html>
