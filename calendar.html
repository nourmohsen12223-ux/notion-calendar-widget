<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendar</title>

<script src="https://accounts.google.com/gsi/client"></script>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #191919;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Helvetica, Arial, sans-serif;
}

body {
    padding: 18px 22px 24px;
}

/* =========================
   HEADER
========================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    min-height: 34px;
}

.month-title {
    font-size: 14px;
    font-weight: 600;
    color: #191919;
}

.controls {
    display: flex;
    align-items: center;
    gap: 7px;
}

.control-button {
    border: none;
    background: transparent;
    color: #37352f;
    cursor: pointer;

    height: 30px;
    min-width: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 5px;

    font-size: 14px;
}

.control-button:hover {
    background: #f1f1ef;
}

.today-button {
    padding: 0 8px;
    font-size: 12px;
}

/* =========================
   WEEKDAYS
========================= */

.weekdays {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
}

.weekday {
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #9b9a97;

    font-size: 11px;
    font-weight: 400;
}

/* =========================
   CALENDAR GRID
========================= */

.calendar {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));

    border-top: 1px solid #e3e3e1;
    border-left: 1px solid #e3e3e1;
}

/* =========================
   DAY CELL
========================= */

.day {
    position: relative;

    min-width: 0;
    height: 122px;

    padding: 9px 9px 6px;

    border-right: 1px solid #e3e3e1;
    border-bottom: 1px solid #e3e3e1;

    background: #ffffff;

    overflow: hidden;
}

/* Weekend shading similar to screenshot */

.day.weekend {
    background: #fafafa;
}

/* =========================
   DATE NUMBER
========================= */

.date-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;

    min-height: 24px;
    margin-bottom: 4px;
}

.day-number {
    height: 24px;
    min-width: 24px;

    padding: 0 4px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;
    font-weight: 400;

    color: #191919;

    border-radius: 50%;
}

.other-month .day-number {
    color: #a6a6a6;
}

/* Current day */

.current-day .day-number {
    width: 24px;
    padding: 0;

    background: #eb5757;
    color: #ffffff;

    font-weight: 600;
}

/* =========================
   EVENTS
========================= */

.events {
    width: 100%;
}

.event {
    width: 100%;

    min-height: 18px;

    display: flex;
    align-items: center;

    padding: 2px 5px;
    margin-bottom: 2px;

    border-radius: 3px;

    font-size: 10px;
    line-height: 14px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    color: #37352f;
}

.event-time {
    margin-right: 4px;
    font-weight: 500;
}

.more {
    font-size: 9px;
    color: #787774;

    padding: 2px 4px;

    cursor: default;
}

/* =========================
   LOGIN
========================= */

.login-screen {
    min-height: 250px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.connect-button {
    background: #ffffff;

    border: 1px solid #d8d8d6;

    border-radius: 5px;

    padding: 8px 14px;

    color: #37352f;

    font-size: 13px;

    cursor: pointer;
}

.connect-button:hover {
    background: #f7f7f5;
}

.login-message {
    margin-top: 10px;

    color: #9b9a97;

    font-size: 11px;
}

.error {
    margin-top: 10px;

    color: #eb5757;

    font-size: 11px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    body {
        padding: 10px;
    }

    .day {
        height: 95px;
        padding: 6px;
    }

    .event {
        font-size: 9px;
    }

}

</style>
</head>


<body>


<!-- LOGIN -->

<div id="loginScreen" class="login-screen">

    <button
        class="connect-button"
        onclick="connectGoogle()"
    >
        Connect Google Calendar
    </button>

    <div class="login-message">
        Sign in to display your calendars
    </div>

    <div
        id="loginError"
        class="error"
    ></div>

</div>


<!-- CALENDAR -->

<div
    id="calendarWidget"
    style="display:none;"
>

    <div class="header">

        <div
            id="monthTitle"
            class="month-title"
        ></div>


        <div class="controls">

            <button
                class="control-button"
                onclick="previousMonth()"
                title="Previous month"
            >
                ‹
            </button>

            <button
                class="control-button today-button"
                onclick="goToday()"
            >
                Today
            </button>

            <button
                class="control-button"
                onclick="nextMonth()"
                title="Next month"
            >
                ›
            </button>

        </div>

    </div>


    <div class="weekdays">

        <div class="weekday">Sun</div>
        <div class="weekday">Mon</div>
        <div class="weekday">Tue</div>
        <div class="weekday">Wed</div>
        <div class="weekday">Thu</div>
        <div class="weekday">Fri</div>
        <div class="weekday">Sat</div>

    </div>


    <div
        id="calendar"
        class="calendar"
    ></div>

</div>


<script>

/* =========================================
   GOOGLE SETTINGS
========================================= */

const CLIENT_ID =
"717633697063-cqlol5rt62977cmu29oa9ou3kmnmmrij.apps.googleusercontent.com";

const SCOPES =
"https://www.googleapis.com/auth/calendar.readonly";


let accessToken = null;
let tokenClient = null;

let displayedDate = new Date();


/* =========================================
   GOOGLE LOGIN
========================================= */

function connectGoogle() {

    document.getElementById(
        "loginError"
    ).textContent = "";


    tokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id: CLIENT_ID,

            scope: SCOPES,

            callback: async response => {

                if (response.error) {

                    document.getElementById(
                        "loginError"
                    ).textContent =
                        "Google authorization failed.";

                    return;

                }


                accessToken =
                    response.access_token;


                document.getElementById(
                    "loginScreen"
                ).style.display = "none";


                document.getElementById(
                    "calendarWidget"
                ).style.display = "block";


                await loadMonth();

            }

        });


    tokenClient.requestAccessToken();

}


/* =========================================
   GET GOOGLE CALENDARS
========================================= */

async function getCalendars() {

    const response =
        await fetch(

            "https://www.googleapis.com/calendar/v3/users/me/calendarList",

            {
                headers: {

                    Authorization:
                        "Bearer " + accessToken

                }
            }

        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.error?.message ||
            "Unable to load calendars."
        );

    }


    /*
      Load calendars that are selected
      in Google Calendar.
    */

    return (data.items || []).filter(
        calendar =>
            calendar.selected !== false
    );

}


/* =========================================
   GET EVENTS FROM ONE CALENDAR
========================================= */

async function getCalendarEvents(
    calendar,
    start,
    end
) {

    const url =

        "https://www.googleapis.com/calendar/v3/calendars/" +

        encodeURIComponent(
            calendar.id
        ) +

        "/events" +

        "?timeMin=" +
        encodeURIComponent(
            start.toISOString()
        ) +

        "&timeMax=" +
        encodeURIComponent(
            end.toISOString()
        ) +

        "&singleEvents=true" +

        "&orderBy=startTime" +

        "&maxResults=2500";


    try {

        const response =
            await fetch(
                url,
                {
                    headers: {

                        Authorization:
                            "Bearer " +
                            accessToken

                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            console.warn(
                "Could not load:",
                calendar.summary
            );

            return [];

        }


        return (data.items || []).map(
            event => ({

                ...event,

                calendarName:
                    calendar.summary,

                calendarColor:
                    calendar.backgroundColor ||
                    "#eeeeec",

                calendarTextColor:
                    calendar.foregroundColor ||
                    "#37352f"

            })
        );


    } catch (error) {

        console.warn(
            "Calendar error:",
            calendar.summary,
            error
        );

        return [];

    }

}


/* =========================================
   LOAD MONTH
========================================= */

async function loadMonth() {

    /*
      We include a few days from the previous
      and following months because the visual
      calendar displays them too.
    */

    const year =
        displayedDate.getFullYear();

    const month =
        displayedDate.getMonth();


    const firstOfMonth =
        new Date(
            year,
            month,
            1
        );


    const lastOfMonth =
        new Date(
            year,
            month + 1,
            0
        );


    const start =
        new Date(
            firstOfMonth
        );


    start.setDate(
        start.getDate() -
        start.getDay()
    );


    const end =
        new Date(
            lastOfMonth
        );


    end.setDate(
        end.getDate() +
        (6 - end.getDay()) +
        1
    );


    try {

        const calendars =
            await getCalendars();


        const requests =
            calendars.map(
                calendar =>
                    getCalendarEvents(
                        calendar,
                        start,
                        end
                    )
            );


        const results =
            await Promise.all(
                requests
            );


        const allEvents =
            results.flat();


        allEvents.sort(
            (a, b) => {

                const aStart =
                    a.start?.dateTime ||
                    a.start?.date ||
                    "";

                const bStart =
                    b.start?.dateTime ||
                    b.start?.date ||
                    "";

                return (
                    new Date(aStart) -
                    new Date(bStart)
                );

            }
        );


        renderCalendar(
            allEvents
        );


    } catch (error) {

        console.error(
            error
        );

        renderCalendar([]);

    }

}


/* =========================================
   RENDER CALENDAR
========================================= */

function renderCalendar(events) {

    const year =
        displayedDate.getFullYear();

    const month =
        displayedDate.getMonth();


    /* HEADER */

    document.getElementById(
        "monthTitle"
    ).textContent =

        displayedDate.toLocaleDateString(
            "en-US",
            {
                month: "long",
                year: "numeric"
            }
        );


    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML = "";


    /* FIRST VISIBLE SUNDAY */

    const first =
        new Date(
            year,
            month,
            1
        );


    const gridStart =
        new Date(first);


    gridStart.setDate(
        1 - first.getDay()
    );


    /* LAST VISIBLE SATURDAY */

    const last =
        new Date(
            year,
            month + 1,
            0
        );


    const gridEnd =
        new Date(last);


    gridEnd.setDate(
        last.getDate() +
        (6 - last.getDay())
    );


    const today =
        new Date();


    /*
      Render every visible day.
      Usually 35 or 42 cells.
    */

    const cursor =
        new Date(gridStart);


    while (
        cursor <= gridEnd
    ) {

        const cellDate =
            new Date(cursor);


        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day";


        /* WEEKENDS */

        if (
            cellDate.getDay() === 0 ||
            cellDate.getDay() === 6
        ) {

            cell.classList.add(
                "weekend"
            );

        }


        /* OTHER MONTH */

        if (
            cellDate.getMonth() !==
            month
        ) {

            cell.classList.add(
                "other-month"
            );

        }


        /* TODAY */

        if (
            sameDate(
                cellDate,
                today
            )
        ) {

            cell.classList.add(
                "current-day"
            );

        }


        /* DATE ROW */

        const dateRow =
            document.createElement(
                "div"
            );


        dateRow.className =
            "date-row";


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "day-number";


        /*
          Like the screenshot:
          display month abbreviation
          on the first day of a month.
        */

        if (
            cellDate.getDate() === 1
        ) {

            number.textContent =

                cellDate.toLocaleDateString(
                    "en-US",
                    {
                        month: "short",
                        day: "numeric"
                    }
                );

        } else {

            number.textContent =
                cellDate.getDate();

        }


        dateRow.appendChild(
            number
        );


        cell.appendChild(
            dateRow
        );


        /* EVENTS AREA */

        const eventsArea =
            document.createElement(
                "div"
            );


        eventsArea.className =
            "events";


        const dayEvents =
            events.filter(
                event =>
                    eventOccursOnDate(
                        event,
                        cellDate
                    )
            );


        dayEvents
            .slice(0, 4)
            .forEach(
                event => {

                    const eventDiv =
                        document.createElement(
                            "div"
                        );


                    eventDiv.className =
                        "event";


                    eventDiv.style.backgroundColor =
                        event.calendarColor;


                    eventDiv.style.color =
                        event.calendarTextColor;


                    /* EVENT TIME */

                    if (
                        event.start?.dateTime
                    ) {

                        const time =
                            new Date(
                                event.start.dateTime
                            ).toLocaleTimeString(
                                [],
                                {
                                    hour: "numeric",
                                    minute: "2-digit"
                                }
                            );


                        const timeSpan =
                            document.createElement(
                                "span"
                            );


                        timeSpan.className =
                            "event-time";


                        timeSpan.textContent =
                            time;


                        eventDiv.appendChild(
                            timeSpan
                        );

                    }


                    const title =
                        document.createElement(
                            "span"
                        );


                    title.textContent =
                        event.summary ||
                        "Event";


                    eventDiv.appendChild(
                        title
                    );


                    eventDiv.title =

                        (event.calendarName
                            ? event.calendarName +
                              " — "
                            : "") +

                        (event.summary ||
                         "Event");


                    eventsArea.appendChild(
                        eventDiv
                    );

                }
            );


        /* MORE EVENTS */

        if (
            dayEvents.length > 4
        ) {

            const more =
                document.createElement(
                    "div"
                );


            more.className =
                "more";


            more.textContent =

                "+" +
                (dayEvents.length - 4) +
                " more";


            eventsArea.appendChild(
                more
            );

        }


        cell.appendChild(
            eventsArea
        );


        calendar.appendChild(
            cell
        );


        cursor.setDate(
            cursor.getDate() + 1
        );

    }

}


/* =========================================
   EVENT DATE CHECK
========================================= */

function eventOccursOnDate(
    event,
    date
) {

    /* ALL-DAY EVENT */

    if (
        event.start?.date
    ) {

        const parts =
            event.start.date
                .split("-")
                .map(Number);


        return (

            parts[0] ===
                date.getFullYear() &&

            parts[1] ===
                date.getMonth() + 1 &&

            parts[2] ===
                date.getDate()

        );

    }


    /* TIMED EVENT */

    if (
        event.start?.dateTime
    ) {

        const eventDate =
            new Date(
                event.start.dateTime
            );


        return sameDate(
            eventDate,
            date
        );

    }


    return false;

}


/* =========================================
   SAME DATE
========================================= */

function sameDate(
    a,
    b
) {

    return (

        a.getFullYear() ===
            b.getFullYear() &&

        a.getMonth() ===
            b.getMonth() &&

        a.getDate() ===
            b.getDate()

    );

}


/* =========================================
   NAVIGATION
========================================= */

function previousMonth() {

    displayedDate =
        new Date(
            displayedDate.getFullYear(),
            displayedDate.getMonth() - 1,
            1
        );


    loadMonth();

}


function nextMonth() {

    displayedDate =
        new Date(
            displayedDate.getFullYear(),
            displayedDate.getMonth() + 1,
            1
        );


    loadMonth();

}


function goToday() {

    displayedDate =
        new Date();


    loadMonth();

}

</script>

</body>
</html>
