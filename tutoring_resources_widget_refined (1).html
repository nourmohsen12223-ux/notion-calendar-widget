<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutoring Resources</title><style>
:root{--ink:#37352f;--muted:#8f8b84;--line:#dddAD5;--soft:#f7f6f3}*{box-sizing:border-box}html,body{width:100%;min-height:100%;padding:0}body{margin:0;background:white;color:var(--ink);font:14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.wrap{width:100%;max-width:none;margin:0;padding:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;background:#F7F6F3;border-radius:12px;padding:16px 20px}h1{font:650 20px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0}.filters{display:grid;grid-template-columns:2fr repeat(3,minmax(120px,1fr));gap:9px;margin:12px 0}input,select,textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px;color:var(--ink);font:inherit}button{border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:var(--soft);color:var(--ink);cursor:pointer;font:inherit}button:disabled{opacity:.55;cursor:wait}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:13px;padding:16px;min-width:0}.cardhead{display:flex;align-items:start;justify-content:space-between;gap:8px}.card h2{font:600 18px Georgia,serif;margin:0}.meta{font-size:12px;color:var(--muted);margin:8px 0}.desc{font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.links a{font-size:12px;color:#5f5a54;overflow-wrap:anywhere}.delete{background:white;border:0;padding:4px 7px;font-size:18px;color:var(--muted)}.edit{background:white;border:1px solid var(--line);padding:5px 10px;font-size:12px}.cardactions{display:flex;gap:5px;align-items:center;flex-shrink:0}.card h2{overflow-wrap:anywhere}.status{color:var(--muted);font-size:12px;margin:9px 0}.form{display:none;background:#faf9f7;border:1px solid var(--line);border-radius:12px;padding:15px;margin:12px 0}.form.open{display:block}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.fields label{font-size:12px;color:var(--muted);display:grid;gap:5px}.wide{grid-column:1/-1}.check{display:flex!important;flex-direction:row;align-items:center;color:var(--ink)!important}.check input{width:auto}.buttons{display:flex;gap:8px;margin-top:12px}.empty{color:var(--muted);padding:20px 0}@media(max-width:750px){.filters{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}.wide{grid-column:auto}}@media(max-width:450px){.filters{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top"><h1>Resources Library</h1><button id="toggle" type="button">+ Add Resource</button></div><div id="status" class="status">Loading resources…</div><form id="form" class="form"><div id="formTitle" style="font-weight:650;margin-bottom:12px">Add Resource</div><div class="fields"><label>Resource name<input id="name" required maxlength="200" placeholder="e.g. Fractions practice"></label><label>Resource type<select id="type"></select></label><label>Student<select id="student"></select></label><label>Subject<select id="subject"></select></label><label class="check wide"><input type="checkbox" id="general"> General resource — available to every student</label><label>Web link<input type="url" id="link" placeholder="https://..."></label><label id="fileLabel">Files (up to 10 files, 5 MB each)<input type="file" id="files" multiple></label><label class="wide">Description<textarea id="description" maxlength="2000" rows="2"></textarea></label></div><div id="filenames" class="status"></div><div class="buttons"><button id="save" type="submit">Save Resource</button><button id="cancel" type="button">Cancel</button></div></form><div class="filters"><input id="search" placeholder="Search resources…" aria-label="Search resources"><select id="filterStudent" aria-label="Filter student"></select><select id="filterSubject" aria-label="Filter subject"></select><select id="filterType" aria-label="Filter resource type"></select></div><div id="count" class="status"></div><div id="list" class="list"></div></main><script>
const API='https://notion-calendar-api.nourmohsen12223.workers.dev';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let students=[],resources=[],types=[],editingId=null;
async function call(path,options){const r=await fetch(API+path,{cache:'no-store',...options});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||'Request failed');return d}
function options(el,items,first,selected=''){el.innerHTML='<option value="">'+esc(first)+'</option>'+items.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(items.includes(selected))el.value=selected}
function subjects(){return [...new Set(students.flatMap(s=>s.subjects||[]).concat(resources.map(r=>r.subject).filter(Boolean)))].sort()}
function fill(){const prior={student:$('student').value,subject:$('subject').value,type:$('type').value,fs:$('filterStudent').value,ft:$('filterType').value,fsub:$('filterSubject').value};options($('student'),students.map(s=>s.id),'Select student…',prior.student);for(const o of $('student').options){const s=students.find(s=>s.id===o.value);if(s)o.textContent=s.name}options($('type'),types,'Select type…',prior.type);options($('filterStudent'),['__general',...students.map(s=>s.id)],'All students',prior.fs);for(const o of $('filterStudent').options){if(o.value==='__general')o.textContent='General resources only';else{const s=students.find(s=>s.id===o.value);if(s)o.textContent=s.name}}options($('filterType'),types,'All types',prior.ft);options($('filterSubject'),subjects(),'All subjects',prior.fsub);updateSubject(prior.subject)}
function updateSubject(previous=''){const student=students.find(s=>s.id===$('student').value);const allowed=$('general').checked?subjects():(student?.subjects||[]);options($('subject'),allowed,'No subject / All subjects',previous);$('student').disabled=$('general').checked}
function render(){const q=$('search').value.trim().toLowerCase(),st=$('filterStudent').value,su=$('filterSubject').value,ty=$('filterType').value;const mine=resources.filter(r=>{if(st==='__general'&&!r.general)return false;if(st&&st!=='__general'&&!r.general&&!(r.studentIds||[]).includes(st))return false;if(su&&r.subject!==su)return false;if(ty&&r.type!==ty)return false;const studentNames=(r.studentIds||[]).map(id=>students.find(s=>s.id===id)?.name||'').join(' ');return [r.name,r.description,r.subject,r.type,studentNames].join(' ').toLowerCase().includes(q)});$('count').textContent=`${mine.length} resource${mine.length===1?'':'s'}`;$('list').innerHTML=mine.length?mine.map(r=>{const names=r.general?'General resource':(r.studentIds||[]).map(id=>students.find(s=>s.id===id)?.name||'Student').join(', ');const links=[...(r.link?[{url:r.link,name:'Open link'}]:[]),...(r.files||[])];return `<article class="card"><div class="cardhead"><h2>${esc(r.name)}</h2><div class="cardactions"><button type="button" class="edit" data-edit="${esc(r.id)}" aria-label="Edit ${esc(r.name)}">Edit</button><button type="button" class="delete" data-delete="${esc(r.id)}" title="Delete resource" aria-label="Delete ${esc(r.name)}">×</button></div></div><div class="meta">${esc([names,r.subject,r.type].filter(Boolean).join(' · '))}</div>${r.description?`<div class="desc">${esc(r.description)}</div>`:''}<div class="links">${links.filter(l=>/^https?:\/\//i.test(l.url||'')).map(l=>`<a target="_blank" rel="noopener noreferrer" href="${esc(l.url)}">${esc(l.name||'Open file')} ↗</a>`).join('')}${r.notionUrl?`<a target="_blank" rel="noopener noreferrer" href="${esc(r.notionUrl)}">View in Notion ↗</a>`:''}</div></article>`}).join(''):'<div class="empty">No matching resources.</div>'}
async function load(){try{const [s,r]=await Promise.all([call('/study-plan-embed-students'),call('/tutoring-resources')]);students=s.students||[];resources=r.resources||[];types=r.options?.types||[];fill();render();$('status').textContent=''}catch(e){$('status').textContent='Could not load resources: '+e.message}}
function closeForm(){$('form').classList.remove('open');$('form').reset();editingId=null;$('formTitle').textContent='Add Resource';$('save').textContent='Save Resource';$('fileLabel').style.display='';$('filenames').textContent='';updateSubject()}
$('toggle').onclick=()=>{if($('form').classList.contains('open'))closeForm();else{closeForm();$('form').classList.add('open')}};$('cancel').onclick=closeForm;$('student').onchange=()=>updateSubject();$('general').onchange=()=>updateSubject();$('files').onchange=()=>{$('filenames').textContent=[...$('files').files].map(f=>f.name).join(' · ')};['search','filterStudent','filterSubject','filterType'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
$('form').onsubmit=async e=>{e.preventDefault();const f=[...$('files').files];if(!editingId&&!f.length&&!$('link').value.trim()){$('status').textContent='Add a file or web link.';return}if(f.length>10||f.some(x=>x.size>5*1024*1024)){$('status').textContent='Maximum 10 files, 5 MB each. Use a cloud link for larger files.';return}if(!$('general').checked&&!$('student').value){$('status').textContent='Choose a student or mark this as a general resource.';return}const fd=new FormData();for(const [key,value] of Object.entries({action:editingId?'edit':'add',id:editingId||'',name:$('name').value.trim(),studentId:$('student').value,general:String($('general').checked),subject:$('subject').value,type:$('type').value,link:$('link').value.trim(),description:$('description').value}))fd.append(key,value);f.forEach(file=>fd.append('files',file));$('save').disabled=true;$('status').textContent='Saving…';try{await call('/tutoring-resources',{method:'POST',body:fd});closeForm();await load();$('status').textContent='Resource saved.'}catch(err){$('status').textContent='Could not save: '+err.message}finally{$('save').disabled=false}};
$('list').onclick=async e=>{const edit=e.target.closest('[data-edit]');if(edit){const r=resources.find(x=>x.id===edit.dataset.edit);if(!r)return;closeForm();editingId=r.id;$('formTitle').textContent='Edit Resource';$('save').textContent='Save Changes';$('name').value=r.name||'';$('general').checked=!!r.general;$('student').value=r.studentIds?.[0]||'';$('type').value=r.type||'';updateSubject(r.subject||'');$('link').value=r.link||'';$('description').value=r.description||'';$('fileLabel').style.display='none';$('filenames').textContent='Existing attachments are preserved. To change files, use Notion.';$('form').classList.add('open');$('form').scrollIntoView({behavior:'smooth',block:'nearest'});return}const btn=e.target.closest('[data-delete]');if(!btn||!confirm('Delete this resource from Notion?'))return;btn.disabled=true;try{await call('/tutoring-resources',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete',id:btn.dataset.delete})});await load();$('status').textContent='Resource deleted.'}catch(err){$('status').textContent='Could not delete: '+err.message;btn.disabled=false}};load();
</script></body></html>
