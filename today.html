<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Today's Events</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #37352f;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
}

body {
    padding: 20px 22px 26px;
}


/* =========================
   HEADER
========================= */

.header {
    margin-bottom: 18px;
}

.title {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.4px;
    line-height: 1.2;
    color: #37352f;
}

.date {
    margin-top: 5px;

    font-size: 13px;
    color: #9b9a97;
}


/* =========================
   EVENT LIST
========================= */

.events {
    width: 100%;
    border-top: 1px solid #e9e9e7;
}

.event {
    position: relative;

    display: grid;
    grid-template-columns: 92px 14px minmax(0, 1fr);
    align-items: center;

    min-height: 62px;

    padding: 10px 6px 10px 0;

    border-bottom: 1px solid #e9e9e7;

    transition: background 0.15s ease;
}

.event:hover {
    background: #fafaf9;
}


/* =========================
   TIME
========================= */

.time-column {
    padding-left: 3px;

    font-size: 12px;
    color: #787774;

    line-height: 1.35;
}

.start-time {
    font-weight: 500;
    color: #37352f;
}

.end-time {
    margin-top: 2px;
    color: #9b9a97;
}


/* =========================
   CALENDAR COLOR
========================= */

.dot-column {
    display: flex;
    align-items: center;
    justify-content: flex-start;
}

.calendar-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    flex-shrink: 0;
}


/* =========================
   EVENT INFORMATION
========================= */

.event-content {
    min-width: 0;
}

.event-title {
    font-size: 14px;
    font-weight: 500;

    color: #37352f;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.event-meta {
    margin-top: 4px;

    display: flex;
    align-items: center;
    gap: 6px;

    font-size: 11px;
    color: #9b9a97;

    min-width: 0;
}

.calendar-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================
   ALL DAY
========================= */

.all-day {
    color: #787774;
    font-weight: 500;
}


/* =========================
   CURRENT EVENT
========================= */

.event.current {
    background: #fafaf9;
}

.now {
    display: inline-flex;
    align-items: center;

    margin-left: 7px;

    font-size: 10px;
    font-weight: 600;

    color: #eb5757;

    letter-spacing: 0.3px;
}

.now-dot {
    width: 6px;
    height: 6px;

    margin-right: 4px;

    border-radius: 50%;

    background: #eb5757;
}


/* =========================
   STATUS
========================= */

.status {
    padding: 38px 10px;

    text-align: center;

    color: #9b9a97;
    font-size: 13px;

    border-top: 1px solid #e9e9e7;
}

.error {
    color: #eb5757;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 500px) {

    body {
        padding: 15px;
    }

    .title {
        font-size: 22px;
    }

    .event {
        grid-template-columns: 78px 13px minmax(0, 1fr);
    }

}

</style>
</head>


<body>

<div class="header">

    <div class="title">
        Today's Events
    </div>

    <div
        id="todayDate"
        class="date"
    ></div>

</div>


<div
    id="status"
    class="status"
>
    Loading today's events…
</div>


<div
    id="events"
    class="events"
    style="display:none;"
></div>


<script>

/* ==========================================
   BACKEND
========================================== */

const API_URL =
    "https://notion-calendar-api.nourmohsen12223.workers.dev/events";


/* ==========================================
   DATE HEADER
========================================== */

const today = new Date();

document.getElementById(
    "todayDate"
).textContent =

    today.toLocaleDateString(
        "en-US",
        {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        }
    );


/* ==========================================
   LOAD TODAY
========================================== */

async function loadToday() {

    const status =
        document.getElementById("status");

    const container =
        document.getElementById("events");


    const start =
        new Date();

    start.setHours(
        0, 0, 0, 0
    );


    const end =
        new Date(start);

    end.setDate(
        end.getDate() + 1
    );


    try {

        const url =
            new URL(API_URL);

        url.searchParams.set(
            "timeMin",
            start.toISOString()
        );

        url.searchParams.set(
            "timeMax",
            end.toISOString()
        );


        const response =
            await fetch(
                url.toString()
            );

        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to load events."
            );

        }


        const events =
            data.events || [];


        if (events.length === 0) {

            status.style.display =
                "block";

            status.textContent =
                "No events today.";

            container.style.display =
                "none";

            return;

        }


        status.style.display =
            "none";

        container.style.display =
            "block";


        renderEvents(events);

    }

    catch (error) {

        console.error(error);

        status.className =
            "status error";

        status.textContent =
            "Unable to load today's events.";

    }

}


/* ==========================================
   RENDER EVENTS
========================================== */

function renderEvents(events) {

    const container =
        document.getElementById(
            "events"
        );

    container.innerHTML = "";


    events.forEach(event => {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "event";


        let isCurrent = false;


        if (
            event.start?.dateTime &&
            event.end?.dateTime
        ) {

            const now =
                new Date();

            const eventStart =
                new Date(
                    event.start.dateTime
                );

            const eventEnd =
                new Date(
                    event.end.dateTime
                );


            if (
                now >= eventStart &&
                now < eventEnd
            ) {

                isCurrent = true;

                card.classList.add(
                    "current"
                );

            }

        }


        /* ==========================
           TIME COLUMN
        ========================== */

        const timeColumn =
            document.createElement(
                "div"
            );

        timeColumn.className =
            "time-column";


        if (event.start?.dateTime) {

            const startTime =
                new Date(
                    event.start.dateTime
                );

            const endTime =
                event.end?.dateTime
                    ? new Date(
                        event.end.dateTime
                    )
                    : null;


            const startDiv =
                document.createElement(
                    "div"
                );

            startDiv.className =
                "start-time";

            startDiv.textContent =
                formatTime(
                    startTime
                );


            timeColumn.appendChild(
                startDiv
            );


            if (endTime) {

                const endDiv =
                    document.createElement(
                        "div"
                    );

                endDiv.className =
                    "end-time";

                endDiv.textContent =
                    formatTime(
                        endTime
                    );

                timeColumn.appendChild(
                    endDiv
                );

            }

        }

        else {

            const allDay =
                document.createElement(
                    "div"
                );

            allDay.className =
                "all-day";

            allDay.textContent =
                "All day";

            timeColumn.appendChild(
                allDay
            );

        }


        /* ==========================
           COLOR DOT
        ========================== */

        const dotColumn =
            document.createElement(
                "div"
            );

        dotColumn.className =
            "dot-column";


        const dot =
            document.createElement(
                "div"
            );

        dot.className =
            "calendar-dot";

        dot.style.backgroundColor =
            event.calendarColor ||
            "#9b9a97";


        dotColumn.appendChild(
            dot
        );


        /* ==========================
           CONTENT
        ========================== */

        const content =
            document.createElement(
                "div"
            );

        content.className =
            "event-content";


        const title =
            document.createElement(
                "div"
            );

        title.className =
            "event-title";


        const titleText =
            document.createElement(
                "span"
            );

        titleText.textContent =
            event.summary ||
            "Event";


        title.appendChild(
            titleText
        );


        /* NOW */

        if (isCurrent) {

            const now =
                document.createElement(
                    "span"
                );

            now.className =
                "now";


            const nowDot =
                document.createElement(
                    "span"
                );

            nowDot.className =
                "now-dot";


            now.appendChild(
                nowDot
            );

            now.appendChild(
                document.createTextNode(
                    "NOW"
                )
            );


            title.appendChild(
                now
            );

        }


        /* META */

        const meta =
            document.createElement(
                "div"
            );

        meta.className =
            "event-meta";


        if (event.calendarName) {

            const calendarName =
                document.createElement(
                    "span"
                );

            calendarName.className =
                "calendar-name";

            calendarName.textContent =
                event.calendarName;


            meta.appendChild(
                calendarName
            );

        }


        content.appendChild(
            title
        );

        content.appendChild(
            meta
        );


        /* ==========================
           BUILD
        ========================== */

        card.appendChild(
            timeColumn
        );

        card.appendChild(
            dotColumn
        );

        card.appendChild(
            content
        );


        container.appendChild(
            card
        );

    });

}


/* ==========================================
   FORMAT TIME
========================================== */

function formatTime(date) {

    return date.toLocaleTimeString(
        [],
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );

}


/* ==========================================
   START
========================================== */

loadToday();

</script>

</body>
</html>
