<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tutoring Calendar</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --card: #FFFFFF;
  --text: #37352F;
  --soft: #6F6A64;
  --muted: #98938D;

  --border: #E5E1DB;
  --grid: #ECE9E4;

  --today: #D8D2CA;

  --time-width: 54px;

  /* Warm-neutral colors throughout, including each student’s calendar events. */
}

html,
body {
  width: 100%;
  margin: 0;
  padding: 0;

  background: transparent;

  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  overflow-x: hidden;
}


/* ==========================================
   MAIN
========================================== */

.dashboard {
  width: 100%;

  display: grid;

  grid-template-columns:
    minmax(0, 2.55fr)
    minmax(275px, 1fr);

  gap: 14px;

  align-items: start;
}


.panel {
  background: var(--card);

  border: 1px solid var(--border);

  border-radius: 17px;
}


/* ==========================================
   CALENDAR
========================================== */

.calendar-panel {
  min-width: 0;

  padding: 16px;
}


/* ==========================================
   CALENDAR TOP
========================================== */

.calendar-header {
  min-height: 42px;

  margin-bottom: 10px;

  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 15px;
}


.month-label {
  color: #332F2B;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 21px;
  font-weight: 600;

  line-height: 1;
}


.controls {
  display: flex;

  align-items: center;

  gap: 4px;
}


.control {
  height: 30px;

  padding: 0 10px;

  display: flex;

  align-items: center;
  justify-content: center;

  border: 1px solid var(--border);

  border-radius: 8px;

  background: #FFFFFF;

  color: var(--soft);

  font-family: inherit;

  font-size: 10px;

  cursor: pointer;
}


.control:hover {
  background: #F6F4F1;
}
.control:disabled { opacity: .65; cursor: default; }


.arrow {
  width: 29px;

  padding: 0;

  border-color: transparent;

  background: transparent;

  font-size: 17px;
}


/* ==========================================
   STUDENT COLOR KEY
   Warm neutral palette only: ivory, greige, gray and taupe.
========================================== */

.student-legend {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  margin: 0 0 12px;
}
.student-legend:empty { display: none; }
.student-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 29px;
  padding: 5px 9px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #FBFAF8;
  color: #514E49;
  font-size: 11px;
  font-weight: 500;
  line-height: 1.2;
  max-width: 100%;
}
.student-swatch,
.upcoming-student-dot {
  flex-shrink: 0;
  width: 12px;
  height: 12px;
  border: 1px solid rgba(55, 53, 47, .17);
  border-radius: 4px;
}
.upcoming-student-dot {
  display: inline-block;
  vertical-align: -1px;
  width: 10px;
  height: 10px;
  margin-right: 5px;
  border-radius: 3px;
}
.lesson[data-status="cancelled"] {
  outline: 1px dashed rgba(94, 85, 77, .72);
  outline-offset: -2px;
  opacity: .77;
}
.lesson[data-status="no-show"] {
  outline: 1px dashed rgba(141, 131, 120, .78);
  outline-offset: -2px;
}

/* ==========================================
   CALENDAR WRAPPER
========================================== */

.calendar-shell {
  width: 100%;

  overflow: hidden;

  border: 1px solid var(--border);

  border-radius: 11px;
}


/*
  IMPORTANT:

  Header and body now use the SAME
  minimum width and EXACT SAME columns.

  This fixes the misaligned vertical lines.
*/

.calendar-inner {
  width: 100%;

  min-width: 700px;
}


/* ==========================================
   WEEK HEADER
========================================== */

.week-header {
  width: 100%;

  display: grid;

  grid-template-columns:
    var(--time-width)
    repeat(7, minmax(0, 1fr));

  background: #FBFAF8;

  border-bottom: 1px solid var(--border);
}


.header-spacer {
  border-right: 1px solid var(--border);
}


.day-header {
  min-width: 0;

  height: 52px;

  padding: 7px 3px;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  border-right: 1px solid var(--border);
}


.day-header:last-child {
  border-right: none;
}


.day-name {
  color: #77726C;

  font-size: 8px;
  font-weight: 650;

  letter-spacing: 0.65px;
}


.day-number {
  width: 24px;
  height: 24px;

  margin-top: 2px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  color: #48443F;

  font-size: 12px;
  font-weight: 500;
}


.day-header.today {
  background: #F5F3F0;
}


.day-header.today .day-number {
  background: var(--today);

  color: #403C37;

  font-weight: 650;
}


/* ==========================================
   BODY
========================================== */

.calendar-scroll {
  width: 100%;

  overflow-x: auto;

  overflow-y: hidden;

  scrollbar-width: thin;
}


.calendar-grid {
  width: 100%;

  display: grid;

  grid-template-columns:
    var(--time-width)
    repeat(7, minmax(0, 1fr));
}


/* ==========================================
   TIME COLUMN
========================================== */

.time-column {
  position: relative;

  background: #FFFFFF;

  border-right: 1px solid var(--border);
}


.time-label {
  position: absolute;

  right: 8px;

  transform: translateY(-50%);

  color: #918C86;

  font-size: 8px;

  line-height: 1;

  white-space: nowrap;
}


/*
  First and last labels are pulled slightly
  inward so 5 PM and 5 AM cannot be clipped.
*/

.time-label.first {
  transform: translateY(5px);
}


.time-label.last {
  transform: translateY(calc(-100% - 5px));
}


/* ==========================================
   DAY COLUMN
========================================== */

.day-column {
  position: relative;

  min-width: 0;

  background: #FFFFFF;

  border-right: 1px solid var(--border);
}


.day-column:last-child {
  border-right: none;
}


.day-column.today {
  background: #FCFBFA;
}


.hour-line {
  position: absolute;

  left: 0;
  right: 0;

  height: 1px;

  background: var(--grid);

  pointer-events: none;
}


/* ==========================================
   LESSON
========================================== */

.lesson {
  position: absolute;

  left: 4px;
  right: 4px;

  z-index: 2;

  box-sizing: border-box;
  padding: 4px 6px;

  overflow: hidden;

  border-radius: 7px;

  border-left:
    3px solid rgba(65, 61, 56, 0.16);

  cursor: pointer;
  text-decoration: none;

  transition:
    transform 0.12s ease,
    box-shadow 0.12s ease;
}


.lesson:hover {
  z-index: 5;

  transform: translateY(-1px);

  box-shadow:
    0 4px 11px
    rgba(55, 53, 47, 0.09);
}


.lesson-name {
  color: #37332F;

  font-size: 9.5px;
  font-weight: 650;

  line-height: 1.1;

  white-space: normal;

  overflow: visible;

  text-overflow: clip;

  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}


.lesson-time {
  margin-top: 2px;

  color: #716C66;

  font-size: 7.5px;

  line-height: 1.1;

  white-space: nowrap;
}


.lesson-subject {
  margin-top: 2px;

  color: #5D5852;

  font-size: 7.5px;

  line-height: 1.1;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


/* ==========================================
   SIDEBAR
========================================== */

.sidebar {
  min-width: 0;

  display: flex;

  flex-direction: column;

  gap: 14px;
}


.sidebar-panel {
  padding: 19px;

  min-height: 170px;
}


.sidebar-header {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 10px;

  margin-bottom: 9px;
}


.sidebar-title {
  margin: 0;

  color: #302D29;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 18px;
  font-weight: 600;
}


.sidebar-note {
  color: #AAA59E;

  font-size: 8px;

  white-space: nowrap;
}


/* ==========================================
   UPCOMING ITEMS
========================================== */

.list-item {
  display: flex;

  align-items: center;

  gap: 11px;

  padding: 12px 0;

  border-bottom: 1px solid #F0EEEA;
}


.list-item:last-child {
  border-bottom: none;
}

.list-item.notion-link {
  color: inherit;
  text-decoration: none;
  cursor: pointer;
}


.date-box {
  flex: 0 0 43px;

  width: 43px;
  height: 43px;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  border-radius: 9px;

  background: #F1EFEB;
}


.date-month {
  color: #77716A;

  font-size: 7px;
  font-weight: 700;

  letter-spacing: 0.55px;
}


.date-day {
  margin-top: 1px;

  color: #47433E;

  font-size: 15px;
  font-weight: 600;
}


.list-content {
  flex: 1;

  min-width: 0;
}


.list-title {
  color: #3C3935;

  font-size: 10.5px;
  font-weight: 600;

  line-height: 1.25;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


.list-meta {
  margin-top: 4px;

  color: #98938D;

  font-size: 8px;

  line-height: 1.3;
}


.chevron {
  color: #B1ADA7;

  font-size: 15px;
}


/* ==========================================
   EMPTY
========================================== */

.empty,
.loading {
  min-height: 105px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 18px;

  color: #AAA59F;

  font-size: 9px;

  text-align: center;
}


/* ==========================================
   IPAD
========================================== */

@media (max-width: 1100px) {

  .dashboard {
    grid-template-columns:
      minmax(0, 2.5fr)
      minmax(220px, 0.9fr);

    gap: 10px;
  }


  .calendar-panel {
    padding: 12px;
  }


  .sidebar-panel {
    padding: 15px;
  }


  .sidebar-title {
    font-size: 16px;
  }


  .calendar-inner {
    min-width: 660px;
  }

}


/* ==========================================
   SMALL IPAD / TABLET
========================================== */

@media (max-width: 820px) {

  .dashboard {
    grid-template-columns:
      minmax(0, 1fr)
      210px;

    gap: 9px;
  }


  .calendar-panel {
    padding: 10px;
  }


  .calendar-inner {
    min-width: 620px;
  }


  .sidebar-panel {
    padding: 13px;
  }


  .sidebar-title {
    font-size: 15px;
  }


  .list-item {
    gap: 8px;
  }


  .date-box {
    flex-basis: 38px;

    width: 38px;
    height: 38px;
  }

}


/* ==========================================
   PHONE
========================================== */

@media (max-width: 650px) {

  .dashboard {
    grid-template-columns: 1fr;
  }


  .sidebar {
    display: grid;

    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

}


@media (max-width: 480px) {

  .calendar-header {
    align-items: flex-start;

    flex-direction: column;
  }


  .controls {
    align-self: flex-end;
  }


  .sidebar {
    grid-template-columns: 1fr;
  }

}


/* iPad: slightly taller time cells + lesson cards for clearer time */
@media (min-width: 621px) and (max-width: 1180px) {
  .lesson {
    min-height: 40px;
  }
  .lesson-time {
    line-height: 1.25;
    white-space: nowrap;
  }
}


/* ===========================================
   REFINEMENTS — same neutral dashboard style
   Student swatches remain warm neutral; attendance
   borders use the original red, green and blue.
=========================================== */
.month-label {
  /* Original calendar month/year serif typography. */
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 600;
}
.sidebar-title {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-weight: 650;
}
.month-label { font-size: 22px; line-height: 1.25; }
.sidebar-title { font-size: 19px; }
.control { min-height: 39px; height: 39px; font-size: 12px; padding: 0 12px; }
.control.arrow { min-width: 37px; font-size: 22px; }
.calendar-header { min-height: 44px; }
.day-header { height: 58px; }
.day-name { font-size: 10px; letter-spacing: .55px; }
.day-number { font-size: 14px; width: 29px; height: 29px; }
.time-label { font-size: 10px; }
.lesson { padding: 5px 5px 4px 6px; border-left-width: 4px; }
.lesson-name { font-size: 11.2px; line-height: 1.15; font-weight: 650; }
.lesson-time { font-size: 9.2px; margin-top: 3px; line-height: 1.16; white-space: normal; }
/* Extra-small collision lanes prioritize student identity; the full time is
   preserved in the accessible card title and opens the original Notion page. */
.lesson[data-overlap] { padding: 5px 3px 4px 5px; }
.lesson[data-overlap] .lesson-name { font-size: 10px; -webkit-line-clamp: 2; }
.lesson[data-overlap] .lesson-time { display: none; }
.list-title { font-size: 12px; }
.list-meta { font-size: 10.5px; }
.date-month { font-size: 9px; }
.date-day { font-size: 16px; }
.sidebar-note { font-size: 10px; }
.empty, .loading { font-size: 11.5px; }
.student-legend {
  gap: 8px; margin: 0 0 12px;
  flex-wrap: nowrap; overflow-x: auto; padding: 1px 0 6px;
  scrollbar-width: thin;
}
.student-chip {
  appearance: none; cursor: pointer; font: inherit;
  font-size: 11.5px; line-height: 1.2;
  font-weight: 550; white-space: nowrap;
  min-height: 36px; flex: 0 0 auto;
  padding: 7px 11px; transition: background .14s ease, border-color .14s ease;
}
.student-chip:hover { background: #F2F0EC; border-color: #BFB8AF; }
.student-chip[aria-pressed="true"] {
  background: #EEEAE4; border-color: #9C968F;
  color: #302D29; font-weight: 700;
}
.student-chip:focus-visible, .control:focus-visible, .lesson:focus-visible {
  outline: 2px solid #716B65; outline-offset: 2px;
}
.status-legend {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 9px 16px; margin: 0 0 12px;
  color: #77726B; font-size: 11px;
}
.status-legend-item { display: inline-flex; align-items: center; gap: 6px; }
.status-mark { height: 15px; width: 4px; border-radius: 2px; flex-shrink: 0; }
.current-time-line {
  position: absolute; left: 0; right: 0; height: 0;
  border-top: 2px solid #6D6861; z-index: 4;
  pointer-events: none;
}
.current-time-line::before {
  content: ""; position: absolute; left: -4px; top: -5px;
  height: 9px; width: 9px; border-radius: 50%; background: #6D6861;
}
.current-time-line::after {
  content: "NOW"; position: absolute; right: 2px; top: 2px;
  padding: 1px 3px; color: #6D6861; background: rgba(255,255,255,.94);
  font-size: 8px; font-weight: 700; letter-spacing: .25px;
}
@media(max-width:820px){
  .month-label {font-size:20px;}
  .student-chip {font-size:11px; min-height:34px;}
  .sidebar-title {font-size:17px;}
  .control {font-size:11px; min-height:36px; height:36px; padding:0 9px;}
}
@media (prefers-reduced-motion:reduce) {
  .lesson, .student-chip { transition: none; }
}

/* ==========================================================
   IPAD / NOTION EMBED RESPONSIVENESS
   Below 1120px, give all seven days the full widget width.
   Upcoming Lessons and Deadlines move below the calendar.
   A narrow phone/Notion column can swipe the entire grid.
   These rules override earlier iPad layout breakpoints.
========================================================== */
.dashboard, .calendar-panel, .calendar-shell, .calendar-scroll,
.calendar-inner, .sidebar, .sidebar-panel { max-width: 100%; }
.calendar-scroll { -webkit-overflow-scrolling: touch; }
.student-legend { -webkit-overflow-scrolling: touch; }

@media (max-width: 1120px) {
  :root { --time-width: 52px; }
  .dashboard {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
    align-items: stretch;
  }
  .calendar-panel { min-width: 0; padding: 14px; }
  .calendar-shell, .calendar-scroll { min-width: 0; }
  .calendar-inner { width: 100%; min-width: 0; }
  .week-header, .calendar-grid {
    grid-template-columns: var(--time-width) repeat(7, minmax(0, 1fr));
  }
  .sidebar {
    min-width: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    align-items: stretch;
  }
  .sidebar-panel { min-width: 0; padding: 16px; min-height: 160px; }
  .sidebar-title { font-size: 18px; }
  .month-label { font-size: 21px; }
  .lesson-name { font-size: 11px; }
  .day-name { font-size: 10px; }
  .time-label { font-size: 10px; }
}

/* Even if Notion allocates a narrower column, avoid shrinking
   the calendar through a two-column dashboard layout. */
@media (max-width: 660px) {
  :root { --time-width: 47px; }
  .calendar-panel { padding: 10px; }
  .sidebar { grid-template-columns: minmax(0, 1fr); }
  .sidebar-panel { min-height: 130px; padding: 14px; }
  .lesson { padding-left: 4px; padding-right: 3px; }
  .lesson-name { font-size: 10px; }
  .lesson-time { font-size: 8.5px; }
  .day-header { padding-left: 1px; padding-right: 1px; }
  .day-number { font-size: 13px; }
  .student-chip { min-height: 36px; }
}

/* On extremely narrow phone-sized embeds, protect event readability
   by allowing an obvious horizontal swipe, not clipping days. */
.calendar-swipe-hint { display:none; margin:0 0 7px; color:#8F8B84; font-size:11px; }
@media (max-width: 520px) {
  .calendar-inner { min-width: 590px; }
  .calendar-swipe-hint { display:block; }
  .calendar-header { gap:9px; }
  .controls { gap:2px; }
  .control { padding:0 8px; }
}


/* ==============================================================
   DEADLINES — streamlined mockup style, scoped to this panel only
   Calendar, student filters, and Upcoming Lessons remain untouched.
============================================================== */
.deadline-panel .sidebar-header { margin-bottom: 10px; }
.deadline-view-all {
  appearance: none; border: 0; background: transparent;
  padding: 7px 2px 7px 10px; margin: -6px -2px -6px 0;
  color: #89837C; font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1.2; cursor: pointer;
  white-space: nowrap; border-radius: 7px;
}
.deadline-view-all:hover { background: #F7F6F3; color: #37352F; }
.deadline-view-all:focus-visible { outline: 2px solid #8A8580; outline-offset: 2px; }
.deadline-view-all[hidden] { display: none !important; }
.deadline-list-row {
  display: grid;
  grid-template-columns: 54px 13px minmax(0,1fr) 15px;
  gap: 10px; align-items: center; min-width: 0;
  padding: 14px 2px; border-bottom: 1px solid #EFEBE7;
  color: inherit; text-decoration: none;
}
.deadline-list-row:last-child { border-bottom: 0; }
.deadline-list-row.notion-link { cursor: pointer; }
.deadline-list-row.notion-link:hover { background: #FAF9F7; }
.deadline-list-row.notion-link:focus-visible { outline: 2px solid #8A8580; outline-offset: -2px; }
.deadline-short-date { color: #807A73; font-size: 11.5px; font-weight: 550; white-space: nowrap; }
.deadline-student-dot {
  display: block; width: 13px; height: 13px; flex-shrink: 0;
  border: 1px solid rgba(66,61,55,.07); border-radius: 50%;
}
.deadline-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.deadline-student-name {
  color: #37352F; font-size: 12.5px; font-weight: 650;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.deadline-task-title {
  color: #8E8780; font-size: 11px; line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.deadline-open-arrow { color: #97918A; font-size: 19px; line-height: 1; text-align: right; }
.deadline-panel .empty { min-height: 90px; font-size: 12px; }
@media (max-width: 660px) {
  .deadline-list-row { padding: 13px 1px; grid-template-columns: 54px 13px minmax(0,1fr) 15px; }
  .deadline-student-name { font-size: 13px; }
  .deadline-task-title { font-size: 11.5px; }
}

</style>
</head>


<body>


<div class="dashboard">


  <!-- ======================================
       CALENDAR
  ======================================= -->

  <section class="panel calendar-panel">


    <div class="calendar-header">


      <div
        class="month-label"
        id="monthLabel"
      >
      </div>


      <div class="controls">


        <button
          class="control arrow"
          id="previousWeek"
          aria-label="Previous week"
        >
          ‹
        </button>


        <button
          class="control"
          id="todayButton"
        >
          Today
        </button><button class="control" id="syncCalendarButton" type="button" title="Sync Solomon Calendar">↻ Sync</button>


        <button
          class="control arrow"
          id="nextWeek"
          aria-label="Next week"
        >
          ›
        </button>


      </div>


    </div>

    <div id="studentLegend" class="student-legend" role="group" aria-label="Filter calendar by student"></div>
    <div class="status-legend" aria-label="Lesson status colors">
      <span class="status-legend-item"><span class="status-mark" style="background:#459B64"></span>Attended</span>
      <span class="status-legend-item"><span class="status-mark" style="background:#D9534F"></span>Cancelled</span>
      <span class="status-legend-item"><span class="status-mark" style="background:#4B84D6"></span>No Show</span>

<script>

/* ==========================================

const API_URL =

const SYNC_CALENDAR_URL = "https://notion-calendar-api.nourmohsen12223.workers.dev/sync-solomon-now";
const START_HOUR = 17;

const END_HOUR = 29;


/*
  38px × 12 hours = 456px.

  previous version so the entire calendar

*/

const HOUR_HEIGHT = (window.innerWidth >= 621 && window.innerWidth <= 1180) ? 42 : 38;


/* ==========================================
   STATE
========================================== */

let currentWeekStart =
  getMonday(
    new Date()
  );


let tutoringLessons = [];

let deadlines = [];
let selectedStudentKey = null; // null means All Students


/* ==========================================
   STUDENT COLORS
   The same student always gets the same color on every week.
   Saved allocations stay consistent on this device as students are added.
   A deterministic name/ID sort makes the initial set consistent everywhere.
========================================== */

const STUDENT_PALETTE = [
  "#EEE9E2", // warm ivory
  "#D9D2C9", // soft stone
  "#E9E4DE", // porcelain greige
  "#CDC6BD", // light taupe
  "#F1EBE4", // pale linen
  "#DFD8CF", // oatmeal
  "#E1DEDA", // pearl gray
  "#D4CCC3", // sandstone
  "#EAE1D7", // warm putty
  "#D2D0CB", // silver taupe
  "#EBE8E3", // misty chalk
  "#D8CFC5", // mushroom
  "#E5DCD2", // biscuit gray
  "#D7D7D3", // pale slate gray
  "#E8E4DF", // soft dove
  "#CFCBC7", // muted pebble
  "#EFE7DC", // light sand
  "#DCD5CE"  // gentle greige
];

const studentColors = new Map();
const STUDENT_COLOR_STORAGE_KEY = "noury-tutoring-calendar-student-colors-neutral-v2";
const LEGACY_STUDENT_COLOR_STORAGE_KEY = "noury-tutoring-calendar-student-colors-v1";
// Migrate old student's color SLOT to neutral color: identity stays consistent.
const LEGACY_STUDENT_PALETTE = [
  "#E5E1FA", "#DCE9FF", "#FFE3D4", "#F8DCE8", "#FFF0C6", "#E0E3F7",
  "#F8DAD4", "#EDDDF7", "#D9E9F8", "#F6E0CD", "#E2DDF2", "#F8DAEA",
  "#E0E6F3", "#FFE9CB", "#EEDCE9", "#DCE5FB", "#F7DCD9", "#F3E2FC"
];

function studentKey(item) {
  const id = String(item?.studentPageId || "").trim().replace(/-/g, "").toLowerCase();
  if (id) return "id:" + id;
  return "name:" + parseLesson(item).student.trim().toLowerCase();
}

function studentColorForLesson(item) {
  return studentColors.get(studentKey(item)) || STUDENT_PALETTE[0];
}

function assignStudentColors() {
  const distinct = new Map();
  tutoringLessons.forEach(item => {
    const key = studentKey(item);
    if (!distinct.has(key)) distinct.set(key, parseLesson(item).student);
  });
  const keys = [...distinct.keys()].sort();
  const assigned = {};
  try {
    const saved = JSON.parse(localStorage.getItem(STUDENT_COLOR_STORAGE_KEY) || "{}");
    if (saved && typeof saved === "object" && !Array.isArray(saved)) Object.assign(assigned, saved);
    // Existing colors were pastels. Retain each student's original palette position
    // when upgrading, without ever displaying an old non-neutral color.
    const legacy = JSON.parse(localStorage.getItem(LEGACY_STUDENT_COLOR_STORAGE_KEY) || "{}");
    if (legacy && typeof legacy === "object" && !Array.isArray(legacy)) {
      for (const [key, color] of Object.entries(legacy)) {
        if (assigned[key]) continue;
        const slot = LEGACY_STUDENT_PALETTE.indexOf(color);
        if (slot >= 0) assigned[key] = STUDENT_PALETTE[slot];
      }
    }
  } catch (error) {
    // Storage can be blocked in some Notion embeds. Color assignment still works.
  }

  studentColors.clear();
  const occupied = new Set();

  // Reserve previously assigned colors first; adding students won't change old ones.
  keys.forEach(key => {
    const saved = assigned[key];
    if (STUDENT_PALETTE.includes(saved) && !occupied.has(saved)) {
      studentColors.set(key, saved);
      occupied.add(saved);
    }
  });

  keys.forEach(key => {
    if (studentColors.has(key)) return;
    const color = STUDENT_PALETTE.find(value => !occupied.has(value)) ||
      STUDENT_PALETTE[stableStudentHash(key) % STUDENT_PALETTE.length];
    studentColors.set(key, color);
    occupied.add(color);
    assigned[key] = color;
  });
  try {
    localStorage.setItem(STUDENT_COLOR_STORAGE_KEY, JSON.stringify(assigned));
  } catch (error) {
    // Safe fallback when storage is unavailable.
  }
}

function stableStudentHash(text) {
  let hash = 2166136261;
  for (let i = 0; i < text.length; i++) {
    hash = Math.imul(hash ^ text.charCodeAt(i), 16777619);
  }
  return hash >>> 0;
}

function renderStudentLegend() {
  const legend = document.getElementById("studentLegend");
  if (!legend) return;
  const seen = new Map();
  tutoringLessons.forEach(item => {
    const key = studentKey(item);
    if (!seen.has(key)) seen.set(key, parseLesson(item).student);
  });
  if (selectedStudentKey && !seen.has(selectedStudentKey)) selectedStudentKey = null;
  const button = (key, label, color, isAll = false) => `
    <button type="button" class="student-chip" data-filter-student="${escapeHTML(key)}"
      aria-pressed="${isAll ? selectedStudentKey === null : selectedStudentKey === key}">
      ${isAll ? "" : `<span class="student-swatch" aria-hidden="true" style="background:${color}"></span>`}
      ${escapeHTML(label)}
    </button>`;
  legend.innerHTML = button("__all__", "All Students", "", true) +
    [...seen.entries()].sort((a, b) => a[1].localeCompare(b[1]))
      .map(([key, name]) => button(key, name, studentColors.get(key) || STUDENT_PALETTE[0])).join("");
}

document.getElementById("studentLegend").addEventListener("click", event => {
  const button = event.target.closest("[data-filter-student]");

  selectedStudentKey = button.dataset.filterStudent === "__all__" ? null : button.dataset.filterStudent;

  renderUpcoming();
});


/* ==========================================
   DATE HELPERS
========================================== */

function getMonday(date) {

  const result =
    new Date(date);


  result.setHours(
    0,
    0,
    0,
    0
  );


  const day =
    result.getDay();


  const difference =
    day === 0
      ? -6
      : 1 - day;


  result.setDate(
    result.getDate() +
    difference
  );


  return result;
}


function addDays(
  date,
  amount
) {

  const result =
    new Date(date);


  result.setDate(
    result.getDate() +
    amount
  );


  return result;
}


function sameDay(
  first,
  second
) {

  return (
    first.getFullYear() ===
      second.getFullYear() &&

    first.getMonth() ===
      second.getMonth() &&

    first.getDate() ===
      second.getDate()
  );
}


function dayName(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        weekday: "short"
      }
    )
    .toUpperCase();
}


function dayNumber(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        day: "numeric"
      }
    );
}


function monthYear(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        month: "long",
        year: "numeric"
      }
    );
}


function shortMonth(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        month: "short"
      }
    )
    .toUpperCase();
}


function formatTime(date) {

  return date
    .toLocaleTimeString(
      "en-US",
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );
}


function formatGridHour(gridHour) {

  const actualHour =
    gridHour % 24;


  const date =
    new Date();


  date.setHours(
    actualHour,
    0,
    0,
    0
  );


  return date
    .toLocaleTimeString(
      "en-US",
      {
        hour: "numeric"
      }
    );
}


/* ==========================================
   SAFE HTML
========================================== */

function escapeHTML(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* ==========================================
   PARSE SOLOMON
========================================== */

function normalizeLessonStatus(status) {
  const s = String(status || "").toLowerCase().replace(/\s+/g, " ").trim();
  return s === "canceled" ? "cancelled" : s.replace(/\s+/g, "-");
}
function statusBorder(status) {
  // Keep student-specific neutral card backgrounds; status uses the original colors.
  return ({
    "cancelled": "#D9534F", // red
    "no-show": "#4B84D6",   // blue
    "attended": "#459B64"   // green
  })[normalizeLessonStatus(status)] || "#AAA";
}
function parseLesson(item) {

  const rawTitle =
    String(
      item.title || ""
    ).trim();

  let student =
    item.student || "";

  let subject =
    item.subject || "";

  let grade =
    item.grade || "";

  if (
    !student &&
    rawTitle
  ) {

    const parts =
      rawTitle.split(
        /\s+[—–-]\s+/
      );

    if (
      parts.length >= 2
    ) {

      student =
        parts.shift().trim();

      if (
        !subject
      ) {

        subject =
          parts.join(" — ").trim();
      }

    } else {

      student =
        rawTitle;
    }
  }

  return {

    student:
      student ||
      "Student",

    subject:
      subject || "",

    grade:
      grade || ""

  };
}


/* ==========================================
   VISUAL POSITION
========================================== */

/*
  Midnight–4:59 AM belongs visually to
  the previous tutoring evening.

  Example:

  Tuesday 1 AM appears in Monday's
  tutoring column.
*/

function getVisualPosition(date) {

  const visualDate =
    new Date(date);

  let hour =
    date.getHours() +
    date.getMinutes() / 60;

  /*
    Keep 12 AM–4:59 AM inside the existing
    5 PM–5 AM vertical time scale, but do NOT
    move the lesson to the previous date.
  */
  if (hour < 5) {
    hour += 24;
  }

  return {
    visualDate,
    hour
  };
}


/* ==========================================
   CURRENT WEEK LESSONS
========================================== */

function currentWeekLessons() {

  const weekEnd =
    addDays(
      currentWeekStart,
      7
    );


  return tutoringLessons
    .filter(
      item => {

        if (
          !item.start
        ) {

          return false;
        }


        const start =
          new Date(
            item.start
          );


        if (
          Number.isNaN(
            start.getTime()
          )
        ) {

          return false;
        }


        const position =
          getVisualPosition(
            start
          );


        return (
          position.visualDate >=
            currentWeekStart &&

          position.visualDate <
            weekEnd
        );
      }
    );
}

/* ==========================================
   GRID
========================================== */

function renderGrid() {

  const totalHours =
    END_HOUR -
    START_HOUR;


  const calendarHeight =
    totalHours *
    HOUR_HEIGHT;


  const grid =
    document.getElementById(

  grid.innerHTML =

  /* TIME COLUMN */

  const timeColumn =

  grid.appendChild(

  );


  /* DAY COLUMNS */

  const today =

  for (

  ) {

      );


    const column =

    column.className =
      "day-column";


    column.dataset.day =
      dayIndex;

        date,

      )
    ) {

    for (
      let hour = START_HOUR;
      hour <= END_HOUR;
      hour++
    ) {

      const line =
        document.createElement(
          "div"
        );


      line.className =
        "hour-line";


      line.style.top =
        (
          (hour - START_HOUR) *
          HOUR_HEIGHT
        ) +

    }


    grid.appendChild(

    );
  }


  renderLessons();
  updateCurrentTimeIndicator();
}


/* ==========================================
   SIDE-BY-SIDE LESSON LAYOUT
   Partition overlapping events into collision groups;
   place each event in an available lane without hiding peers.
========================================== */
function computeOverlapLayout(lessons) {
  const byDay = new Map();
  for (const item of lessons) {
    const start = new Date(item.start);
    if (!Number.isFinite(start.getTime())) continue;
    const visual = getVisualPosition(start);
    if (visual.hour < START_HOUR || visual.hour >= END_HOUR) continue;
    const end = item.end ? new Date(item.end) : new Date(start.getTime() + 3600000);
    let endHour = Number.isFinite(end.getTime()) ? getVisualPosition(end).hour : visual.hour + 1;
    if (end <= start) endHour = visual.hour + 1;
    if (endHour < visual.hour) endHour += 24;
    const beginning = visual.hour;
    const finish = Math.min(END_HOUR, Math.max(beginning + .25, endHour));
    const dayKey = `${visual.visualDate.getFullYear()}-${visual.visualDate.getMonth()}-${visual.visualDate.getDate()}`;
    if (!byDay.has(dayKey)) byDay.set(dayKey, []);
    byDay.get(dayKey).push({ item, beginning, finish });
  }

  const positions = new Map();
  for (const daily of byDay.values()) {
    daily.sort((a,b) => a.beginning - b.beginning || b.finish - a.finish);
    let group = [], groupEnd = -Infinity;
    const finalize = () => {
      if (!group.length) return;
      const laneEnds = [];
      for (const event of group) {
        let lane = laneEnds.findIndex(end => end <= event.beginning);
        if (lane === -1) lane = laneEnds.length;
        laneEnds[lane] = event.finish;
        event.lane = lane;
      }
      const count = laneEnds.length;
      for (const event of group) positions.set(event.item, {lane:event.lane, count});
      group = [];
    };
    for (const event of daily) {
      if (group.length && event.beginning >= groupEnd) {
        finalize(); groupEnd = -Infinity;
      }
      group.push(event);
      groupEnd = Math.max(groupEnd, event.finish);
    }
    finalize();
  }
  return positions;
}

function updateCurrentTimeIndicator() {
  document.querySelectorAll(".current-time-line").forEach(el => el.remove());
  const now = new Date();
  let hour = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;
  if (hour < 5) hour += 24;
  if (hour < START_HOUR || hour >= END_HOUR) return;
  // Match by calendar day, including weeks spanning daylight-saving changes.
  let columnIndex = -1;
  for (let i=0; i<7; i++) {
    if (sameDay(addDays(currentWeekStart,i), now)) { columnIndex=i; break; }
  }
  if (columnIndex < 0) return;
  const column = document.querySelectorAll(".day-column")[columnIndex];
  if (!column) return;
  const marker = document.createElement("div");
  marker.className = "current-time-line";
  marker.style.top = ((hour - START_HOUR) * HOUR_HEIGHT) + "px";
  marker.title = "Current time: " + formatTime(now);
  column.appendChild(marker);
}

/* ==========================================
   LESSONS
========================================== */

function renderLessons() {

  const columns =
    document.querySelectorAll(
      ".day-column"
    );


  const lessons = currentWeekLessons().filter(item =>
    !selectedStudentKey || studentKey(item) === selectedStudentKey
  );


  const overlapLayout = computeOverlapLayout(lessons);

  lessons.forEach(
    item => {

      const start =
        new Date(
          item.start
        );


      const end =
        item.end
          ? new Date(
              item.end
            )
          : new Date(
              start.getTime() +
              60 * 60 * 1000
            );


      const startPosition =
        getVisualPosition(
          start
        );


      const endPosition =
        getVisualPosition(
          end
        );


      let dayIndex =
        -1;


      for (
        let index = 0;
        index < 7;
        index++
      ) {

        const day =
          addDays(
            currentWeekStart,
            index
          );


        if (
          sameDay(
            startPosition.visualDate,
            day
          )
        ) {

          dayIndex =
            index;

          break;
        }
      }


      if (
        dayIndex === -1
      ) {

        return;
      }


      if (
        startPosition.hour <
          START_HOUR ||

        startPosition.hour >=
          END_HOUR
      ) {

        return;
      }


      let endHour =
        endPosition.hour;


      if (
        end <= start
      ) {

        endHour =
          startPosition.hour + 1;
      }


      if (
        endHour <
        startPosition.hour
      ) {

        endHour += 24;
      }


      endHour =
        Math.min(
          endHour,
          END_HOUR
        );


      const top =
        (
          startPosition.hour -
          START_HOUR
        ) *
        HOUR_HEIGHT;


      const duration =
        Math.max(
          0.25,
          endHour -
          startPosition.hour
        );


      /*
        The card is always slightly smaller
        than its exact time cell.

        Therefore it cannot overlap the next
        horizontal line.
      */

      const height =
        Math.max(
          29,
          duration *
          HOUR_HEIGHT -
          4
        );


      const info =
        parseLesson(
          item
        );


      const pageUrl = item.notionUrl || (item.id
        ? "https://www.notion.so/" + String(item.id).replace(/-/g, "")
        : "");

      const lesson =
        document.createElement(pageUrl ? "a" : "div");

      if (pageUrl) {
        lesson.href = pageUrl;
        lesson.target = "_top";
        lesson.title = "Open lesson in Notion";
      }


      lesson.className =
        "lesson";


      const layout = overlapLayout.get(item) || {lane:0, count:1};
      if (layout.count > 1) {
        lesson.style.left = `calc(${(layout.lane / layout.count * 100).toFixed(4)}% + 3px)`;
        lesson.style.right = `calc(${((layout.count - layout.lane - 1) / layout.count * 100).toFixed(4)}% + 3px)`;
        lesson.dataset.overlap = String(layout.count);
      }

      lesson.style.top =
        (
          top + 2
        ) +
        "px";


      lesson.style.height =
        height +
        "px";


      // Status must NOT overwrite the student's unique calendar color.
      lesson.style.background = studentColorForLesson(item);
      lesson.style.borderLeft = "4px solid " + statusBorder(item.status);
      lesson.dataset.status = normalizeLessonStatus(item.status);
      lesson.title = [info.student, info.subject, item.status, formatTime(start) + " – " + formatTime(end)]
        .filter(Boolean).join(" · ");
      if (pageUrl) lesson.setAttribute("aria-label", "Open " + lesson.title + " in Notion");


      lesson.innerHTML =
        `
          <div class="lesson-name">
            ${escapeHTML(
              info.student
            )}
          </div>

          <div class="lesson-time">
            ${escapeHTML(
              formatTime(start)
            )}
            –
            ${escapeHTML(
              formatTime(end)
            )}
          </div>

          ${
            info.subject
              ? `
                <div class="lesson-subject">
                  ${escapeHTML(
                    info.subject
                  )}
                </div>
              `
              : ""
          }
        `;


      columns[
        dayIndex
      ]
        .appendChild(
          lesson
        );
    }
  );
}


/* ==========================================
   UPCOMING
========================================== */

function renderUpcoming() {

  const container =
    document.getElementById(
      "upcomingLessons"
    );


  const now =
    new Date();


  const upcoming =
    tutoringLessons

      .filter(
        item => {

          if (
            !item.start
          ) {

            return false;
          }


          const date =
            new Date(
              item.start
            );


          const status = normalizeLessonStatus(item.status);
          return (
            !Number.isNaN(date.getTime()) &&
            date >= now &&
            status !== "cancelled" &&
            status !== "no-show" &&
            (!selectedStudentKey || studentKey(item) === selectedStudentKey)
          );
        }
      )

      .sort(
        (a, b) =>
          new Date(
            a.start
          ) -
          new Date(
            b.start
          )
      )

      .slice(
        0,
        4
      );


  if (
    !upcoming.length
  ) {

    container.className =
      "empty";


    container.textContent =
      "No upcoming lessons";


    return;
  }


  container.className =
    "";


  container.innerHTML =
    upcoming
      .map(
        item => {

          const start =
            new Date(
              item.start
            );


          const info =
            parseLesson(
              item
            );


          const pageUrl = item.notionUrl || (item.id
            ? "https://www.notion.so/" + String(item.id).replace(/-/g, "")
            : "");
          const rowOpen = pageUrl
            ? `<a class="list-item notion-link" href="${escapeHTML(pageUrl)}" target="_top">`
            : `<div class="list-item">`;
          const rowClose = pageUrl ? "</a>" : "</div>";

          return `
            ${rowOpen}


              <div class="date-box">


                <div class="date-month">
                  ${escapeHTML(
                    shortMonth(start)
                  )}
                </div>


                <div class="date-day">
                  ${escapeHTML(
                    dayNumber(start)
                  )}
                </div>


              </div>


              <div class="list-content">


                <div class="list-title">
                  <span class="upcoming-student-dot" aria-hidden="true" style="background:${studentColorForLesson(item)}"></span>${escapeHTML(
                    info.student
                  )}
                </div>


                <div class="list-meta">

                  ${escapeHTML(
                    formatTime(start)
                  )}

                  ${
                    info.subject
                      ? " · " +
                        escapeHTML(
                          info.subject
                        )
                      : ""
                  }

                </div>


              </div>


              <div class="chevron">
                ›
              </div>


            ${rowClose}
          `;
        }
      )
      .join(
        ""
      );



}


/* ==========================================
   DEADLINES
========================================== */

let showAllCalendarDeadlines = false;

// Notion's Due Date is usually date-only; parse it at local noon to avoid
// timezone shifts when a record is displayed in another locale.
function deadlineDate(value) {
  const text = String(value || "");
  return /^\d{4}-\d{2}-\d{2}$/.test(text)
    ? new Date(text + "T12:00:00")
    : new Date(text);
}

function deadlineStudentColor(item) {
  const studentId = String(item.studentPageId || "").trim().replace(/-/g, "").toLowerCase();
  const key = studentId ? "id:" + studentId : "name:" + String(item.student || item.studentName || "").trim().toLowerCase();
  return studentColors.get(key) || STUDENT_PALETTE[stableStudentHash(key) % STUDENT_PALETTE.length];
}

function renderDeadlines() {
  const container = document.getElementById("deadlines");
  const viewAll = document.getElementById("deadlinesViewAll");
  // A deadline due today should remain visible throughout that day.
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const future = deadlines
    .filter(item => {
      const value = item.dueDate || item.due || item.date || item.start;
      if (!value) return false;
      const date = deadlineDate(value);
      return !Number.isNaN(date.getTime()) && date >= today;
    })
    .sort((a, b) => deadlineDate(a.dueDate || a.due || a.date || a.start) -
                       deadlineDate(b.dueDate || b.due || b.date || b.start));

  viewAll.hidden = future.length <= 4;
  viewAll.setAttribute("aria-expanded", String(showAllCalendarDeadlines && future.length > 4));
  viewAll.textContent = showAllCalendarDeadlines ? "Show less ↑" : "View all →";

  if (!future.length) {
    container.innerHTML = '<div class="empty">No upcoming deadlines</div>';
    return;
  }

  const visible = showAllCalendarDeadlines ? future : future.slice(0, 4);
  container.innerHTML = visible.map(item => {
    const date = deadlineDate(item.dueDate || item.due || item.date || item.start);
    const dateLabel = date.toLocaleDateString("en-US", {month:"short", day:"numeric"});
    const student = item.student || item.studentName || "Student";
    const title = item.title || item.name || "Deadline";
    const color = deadlineStudentColor(item);
    const pageUrl = item.notionUrl || (item.id
      ? "https://www.notion.so/" + String(item.id).replace(/-/g, "") : "");
    const opener = pageUrl
      ? `<a class="deadline-list-row notion-link" href="${escapeHTML(pageUrl)}" target="_top" aria-label="Open ${escapeHTML(title)} for ${escapeHTML(student)} in Notion">`
      : `<div class="deadline-list-row">`;
    return `${opener}
      <span class="deadline-short-date">${escapeHTML(dateLabel)}</span>
      <span class="deadline-student-dot" style="background:${color}" aria-hidden="true"></span>
      <span class="deadline-main">
        <span class="deadline-student-name">${escapeHTML(student)}</span>
        <span class="deadline-task-title">${escapeHTML(title)}</span>
      </span>
      <span class="deadline-open-arrow" aria-hidden="true">›</span>
    ${pageUrl ? "</a>" : "</div>"}`;
  }).join("");
}

document.getElementById("deadlinesViewAll").addEventListener("click", () => {
  showAllCalendarDeadlines = !showAllCalendarDeadlines;
  renderDeadlines();
});

/* ==========================================
   FULL RENDER
========================================== */

function renderCalendar() {

  renderWeekHeader();

  renderStudentLegend();

  renderGrid();
}


/* ==========================================
   FETCH
========================================== */

async function loadData() {

  try {

    const [
      lessonsResponse,
      deadlinesResponse
    ] =
      await Promise.all([
        fetch(
          API_URL,
          {
            cache:
              "no-store"
          }
        ),

        fetch(
          DEADLINES_API_URL,
          {
            cache:
              "no-store"
          }
        )
      ]);

    if (
      !lessonsResponse.ok
    ) {

      throw new Error(
        "Unable to load tutoring lessons."
      );
    }

    const lessonsData =
      await lessonsResponse.json();

    tutoringLessons =
      Array.isArray(
        lessonsData.lessons
      )
        ? lessonsData.lessons
        : [];

    assignStudentColors();
    renderStudentLegend();

    if (
      deadlinesResponse.ok
    ) {

      const deadlinesData =
        await deadlinesResponse.json();

      deadlines =
        Array.isArray(
          deadlinesData.deadlines
        )
          ? deadlinesData.deadlines
          : [];

    } else {

      deadlines = [];
    }

    renderCalendar();
    renderUpcoming();
    renderDeadlines();

  } catch (error) {

    console.error(
      error
    );

    document
      .getElementById(
        "upcomingLessons"
      )
      .innerHTML =
        `
          <div class="empty">
            Unable to load lessons
          </div>
        `;

    renderDeadlines();
  }
}

/* MANUAL SOLOMON SYNC */
document.getElementById("syncCalendarButton").addEventListener("click", async () => {
  const button = document.getElementById("syncCalendarButton");
  if (button.disabled) return;
  button.disabled = true; button.textContent = "Syncing…";
  try {
    const response = await fetch(SYNC_CALENDAR_URL, {cache:"no-store"});
    if (!response.ok) throw new Error("Calendar sync failed.");
    button.textContent = "✓ Synced";
    await loadData();
    setTimeout(() => { button.textContent = "↻ Sync"; button.disabled = false; }, 1600);
  } catch (error) {
    console.error(error); button.textContent = "Try again";
    setTimeout(() => { button.textContent = "↻ Sync"; button.disabled = false; }, 1800);
  }
});

   START
========================================== */

renderCalendar();

loadData();
setInterval(updateCurrentTimeIndicator, 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) updateCurrentTimeIndicator(); });


setInterval(
  loadData,
  5 * 60 * 1000
);
