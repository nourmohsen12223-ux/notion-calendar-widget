<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Lessons</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --page: #F8F7F4;
  --card: #FFFFFF;
  --text: #37352F;
  --text-soft: #68645F;
  --muted: #96918A;

  --border: #E6E2DC;
  --grid: #EEECE8;

  --stone-dark: #6F6A63;
  --today: #D8D2CA;

  --neutral-1: #E8E4DE;
  --neutral-2: #E2DFDA;
  --neutral-3: #DDD8D1;
  --neutral-4: #EEEAE4;
  --neutral-5: #E7E7E3;
}

html,
body {
  margin: 0;
  padding: 0;

  background: transparent;

  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  padding: 8px;
}


/* ========================================
   MAIN LAYOUT
======================================== */

.dashboard {
  width: 96%;
  max-width: 1500px;

  margin: 0 auto;

  display: grid;

  grid-template-columns:
    minmax(0, 2.55fr)
    minmax(250px, 0.9fr);

  gap: 22px;

  align-items: start;
}


/* ========================================
   GENERAL CARD
======================================== */

.panel {
  background: var(--card);

  border: 1px solid var(--border);

  border-radius: 18px;
}


/* ========================================
   CALENDAR CARD
======================================== */

.calendar-panel {
  padding: 24px;
}


/* ========================================
   HEADER
======================================== */

.calendar-header {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 20px;

  margin-bottom: 20px;
}


.main-title {
  margin: 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 25px;
  font-weight: 600;

  color: #2F2C28;
}


.controls {
  display: flex;

  align-items: center;

  gap: 6px;
}


.control {
  height: 32px;

  padding: 0 11px;

  display: flex;

  align-items: center;
  justify-content: center;

  border: 1px solid var(--border);

  border-radius: 8px;

  background: #FFFFFF;

  color: var(--text-soft);

  font-family: inherit;

  font-size: 10px;

  cursor: pointer;
}


.control:hover {
  background: #F7F5F1;
}


.arrow {
  width: 30px;

  padding: 0;

  border-color: transparent;

  background: transparent;

  font-size: 17px;
}


.month-label {
  min-width: 116px;

  margin-left: 8px;

  text-align: right;

  color: #4B4742;

  font-size: 12px;
  font-weight: 600;
}


/* ========================================
   CALENDAR SHELL
======================================== */

.calendar-shell {
  overflow: hidden;

  border: 1px solid var(--border);

  border-radius: 12px;
}


/* ========================================
   WEEK HEADER
======================================== */

.week-header {
  display: grid;

  grid-template-columns:
    52px repeat(7, minmax(0, 1fr));

  background: #FBFAF8;

  border-bottom: 1px solid var(--border);
}


.header-spacer {
  border-right: 1px solid var(--border);
}


.day-header {
  min-width: 0;

  padding: 9px 4px 10px;

  text-align: center;

  border-right: 1px solid var(--border);
}


.day-header:last-child {
  border-right: none;
}


.day-name {
  color: #77726C;

  font-size: 8px;
  font-weight: 600;

  letter-spacing: 0.7px;
}


.day-number {
  width: 25px;
  height: 25px;

  margin: 3px auto 0;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  color: #48443F;

  font-size: 13px;
  font-weight: 500;
}


.day-header.today {
  background: #F5F3F0;
}


.day-header.today .day-number {
  background: var(--today);

  color: #403C37;

  font-weight: 650;
}


/* ========================================
   CALENDAR BODY
======================================== */

.calendar-scroll {
  width: 100%;

  overflow-x: auto;
}


.calendar-grid {
  display: grid;

  grid-template-columns:
    52px repeat(7, minmax(95px, 1fr));

  min-width: 735px;
}


/* ========================================
   TIME COLUMN
======================================== */

.time-column {
  position: relative;

  border-right: 1px solid var(--border);

  background: #FFFFFF;
}


.time-label {
  position: absolute;

  right: 8px;

  transform: translateY(-50%);

  color: #99948E;

  font-size: 8px;

  white-space: nowrap;
}


/* ========================================
   DAY COLUMN
======================================== */

.day-column {
  position: relative;

  border-right: 1px solid var(--border);
}


.day-column:last-child {
  border-right: none;
}


.hour-line {
  position: absolute;

  left: 0;
  right: 0;

  height: 1px;

  background: var(--grid);
}


.day-column.today {
  background: #FCFBFA;
}


/* ========================================
   LESSON
======================================== */

.lesson {
  position: absolute;

  left: 5px;
  right: 5px;

  z-index: 2;

  padding: 6px 7px;

  overflow: hidden;

  border-radius: 7px;

  border-left:
    3px solid rgba(70, 66, 61, 0.16);

  cursor: pointer;

  transition:
    transform 0.12s ease,
    box-shadow 0.12s ease;
}


.lesson:hover {
  z-index: 5;

  transform: translateY(-1px);

  box-shadow:
    0 4px 12px
    rgba(55, 53, 47, 0.09);
}


.lesson-name {
  color: #37332F;

  font-size: 9.5px;
  font-weight: 650;

  line-height: 1.2;
}


.lesson-time {
  margin-top: 2px;

  color: #716C66;

  font-size: 7.5px;

  line-height: 1.2;
}


.lesson-subject {
  margin-top: 3px;

  color: #5D5852;

  font-size: 7.5px;

  line-height: 1.25;
}


/* ========================================
   SIDEBAR
======================================== */

.sidebar {
  display: flex;

  flex-direction: column;

  gap: 14px;
}


/* ========================================
   NEW LESSON
======================================== */

.new-lesson {
  width: 100%;

  padding: 14px 18px;

  border: 1px solid #69645D;

  border-radius: 11px;

  background: var(--stone-dark);

  color: #FFFFFF;

  font-family: inherit;

  font-size: 11px;
  font-weight: 550;

  cursor: pointer;
}


.new-lesson:hover {
  background: #625D57;
}


/* ========================================
   SIDEBAR CARD
======================================== */

.sidebar-panel {
  padding: 17px;
}


.sidebar-header {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 10px;

  margin-bottom: 7px;
}


.sidebar-title {
  margin: 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color: #302D29;

  font-size: 16px;
  font-weight: 600;
}


.sidebar-note {
  color: #AAA59E;

  font-size: 8px;
}


/* ========================================
   UPCOMING ITEM
======================================== */

.list-item {
  display: flex;

  align-items: center;

  gap: 10px;

  padding: 11px 0;

  border-bottom: 1px solid #F0EEEA;
}


.list-item:last-child {
  border-bottom: none;
}


.date-box {
  flex: 0 0 40px;

  width: 40px;
  height: 40px;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  border-radius: 9px;

  background: #F1EFEB;
}


.date-month {
  color: #77716A;

  font-size: 6.5px;
  font-weight: 700;

  letter-spacing: 0.6px;
}


.date-day {
  margin-top: 1px;

  color: #47433E;

  font-size: 14px;
  font-weight: 600;
}


.list-content {
  flex: 1;

  min-width: 0;
}


.list-title {
  color: #3C3935;

  font-size: 9.5px;
  font-weight: 600;

  line-height: 1.3;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


.list-meta {
  margin-top: 3px;

  color: #98938D;

  font-size: 7.5px;

  line-height: 1.35;
}


.chevron {
  color: #B1ADA7;

  font-size: 14px;
}


/* ========================================
   EMPTY / LOADING
======================================== */

.empty,
.loading {
  min-height: 95px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 20px;

  color: #AAA59F;

  font-size: 9px;

  text-align: center;
}


/* ========================================
   RESPONSIVE
======================================== */

@media (max-width: 850px) {

  .dashboard {
    width: 97%;

    grid-template-columns:
      minmax(0, 1fr)
      225px;

    gap: 14px;
  }


  .calendar-panel {
    padding: 17px;
  }

}


@media (max-width: 650px) {

  .dashboard {
    grid-template-columns: 1fr;
  }


  .sidebar {
    display: grid;

    grid-template-columns:
      repeat(2, 1fr);
  }


  .new-lesson {
    grid-column: 1 / -1;
  }

}


@media (max-width: 480px) {

  .calendar-header {
    flex-direction: column;

    align-items: flex-start;
  }


  .controls {
    width: 100%;

    justify-content: flex-end;
  }


  .sidebar {
    grid-template-columns: 1fr;
  }

}

</style>
</head>


<body>


<div class="dashboard">


  <!-- ===================================
       MY LESSONS
  ==================================== -->

  <section class="panel calendar-panel">


    <div class="calendar-header">


      <h1 class="main-title">
        My Lessons
      </h1>


      <div class="controls">


        <button
          class="control arrow"
          id="previousWeek"
        >
          ‹
        </button>


        <button
          class="control"
          id="todayButton"
        >

        </button>


        <button
          class="control arrow"
          id="nextWeek"
        >
          ›
        </button>


        <div
          class="month-label"
          id="monthLabel"
        >
        </div>


      </div>


    </div>


    <div class="calendar-shell">


      <div
        class="week-header"
        id="weekHeader"
      >
      </div>


      <div class="calendar-scroll">


        <div
          class="calendar-grid"
          id="calendarGrid"
        >


          <div
            class="time-column"
            id="timeColumn"
          >
          </div>


        </div>


      </div>


    </div>


  </section>



  <!-- ===================================
       SIDEBAR
  ==================================== -->

  <aside class="sidebar">


    <button
      class="new-lesson"
      id="newLessonButton"
    >
      ＋ New Lesson
    </button>



    <section class="panel sidebar-panel">


      <div class="sidebar-header">


        <h2 class="sidebar-title">
          Upcoming Lessons
        </h2>


        <span class="sidebar-note">
          Next 4
        </span>


      </div>


      <div
        id="upcomingLessons"
        class="loading"
      >
        Loading…
      </div>


    </section>



    <section class="panel sidebar-panel">


      <div class="sidebar-header">


        <h2 class="sidebar-title">
          Deadlines
        </h2>


        <span class="sidebar-note">
          Upcoming
        </span>


      </div>


      <div id="deadlines">


        <div class="empty">
          No upcoming deadlines
        </div>


      </div>


    </section>


  </aside>


</div>


<script>

/* ========================================
   SETTINGS
======================================== */

const API_URL =
  "https://notion-calendar-api.nourmohsen12223.workers.dev/upcoming-data";


const HOUR_HEIGHT = 46;

const DEFAULT_START_HOUR = 9;

const DEFAULT_END_HOUR = 20;


/* ========================================
   STATE
======================================== */

let currentWeekStart =
  getMonday(
    new Date()
  );


let tutoringLessons = [];

let deadlines = [];


/* ========================================
   COLORS
======================================== */

const NEUTRAL_COLORS = [
  "#E8E4DE",
  "#E2DFDA",
  "#DDD8D1",
  "#EEEAE4",
  "#E7E7E3"
];


const studentColors =
  new Map();


function colorForStudent(name) {

  const key =
    String(
      name || "Student"
    );


  if (
    studentColors.has(key)
  ) {

    return studentColors.get(key);
  }


  const color =
    NEUTRAL_COLORS[
      studentColors.size %
      NEUTRAL_COLORS.length
    ];


  studentColors.set(
    key,
    color
  );


  return color;
}


/* ========================================
   DATE HELPERS
======================================== */

function getMonday(date) {

  const result =
    new Date(date);


  result.setHours(
    0,
    0,
    0,
    0
  );


  const day =
    result.getDay();


  const difference =
    day === 0
      ? -6
      : 1 - day;


  result.setDate(
    result.getDate() +
    difference
  );


  return result;
}


function addDays(
  date,
  amount
) {

  const result =
    new Date(date);


  result.setDate(
    result.getDate() +
    amount
  );


  return result;
}


function sameDay(
  first,
  second
) {

  return (
    first.getFullYear() ===
      second.getFullYear() &&

    first.getMonth() ===
      second.getMonth() &&

    first.getDate() ===
      second.getDate()
  );
}


function dayName(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        weekday: "short"
      }
    )
    .toUpperCase();
}


function dayNumber(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        day: "numeric"
      }
    );
}


function monthYear(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        month: "long",
        year: "numeric"
      }
    );
}


function shortMonth(date) {

  return date
    .toLocaleDateString(
      "en-US",
      {
        month: "short"
      }
    )
    .toUpperCase();
}


function formatTime(date) {

  return date
    .toLocaleTimeString(
      "en-US",
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );
}


function formatHour(hour) {

  const date =
    new Date();


  date.setHours(
    hour,
    0,
    0,
    0
  );


  return date
    .toLocaleTimeString(
      "en-US",
      {
        hour: "numeric"
      }
    );
}


/* ========================================
   SAFE HTML
======================================== */

function escapeHTML(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* ========================================
   PARSE SOLOMON LESSON
======================================== */

function parseLesson(item) {

  /*
    Support future sanitized
    Worker response
  */

  if (
    item.student ||
    item.subject ||
    item.grade
  ) {

    return {

      student:
        item.student ||
        "Student",

      subject:
        item.subject || "",

      grade:
        item.grade || ""

    };
  }


  const raw =
    String(
      item.title || ""
    );


  const firstLine =
    raw
      .split(/\r?\n/)[0]
      .trim();


  const nameMatch =
    firstLine.match(
      /^([^,]+),\s*([^(]+)/
    );


  let student =
    firstLine;


  if (nameMatch) {

    student =
      nameMatch[2].trim() +
      " " +
      nameMatch[1].trim();

  } else {

    student =
      student
        .replace(
          /\s*\(Private Lesson\).*$/i,
          ""
        )
        .trim();
  }


  const subjectMatch =
    raw.match(
      /Subject:\s*([^\r\n]+)/i
    );


  const gradeMatch =
    raw.match(
      /Grade:\s*([^\r\n]+)/i
    );


  return {

    student:
      student ||
      "Student",

    subject:
      subjectMatch
        ? subjectMatch[1].trim()
        : "",

    grade:
      gradeMatch
        ? gradeMatch[1].trim()
        : ""

  };
}


/* ========================================
   LESSONS IN CURRENT WEEK
======================================== */

function currentWeekLessons() {

  const weekEnd =
    addDays(
      currentWeekStart,
      7
    );


  return tutoringLessons
    .filter(
      item => {

        if (!item.start) {
          return false;
        }


        const date =
          new Date(
            item.start
          );


        if (
          Number.isNaN(
            date.getTime()
          )
        ) {
          return false;
        }


        return (
          date >= currentWeekStart &&
          date < weekEnd
        );
      }
    );
}


/* ========================================
   DYNAMIC TIME RANGE
======================================== */

function getVisibleRange() {

  const lessons =
    currentWeekLessons();


  if (!lessons.length) {

    return {
      startHour:
        DEFAULT_START_HOUR,

      endHour:
        DEFAULT_END_HOUR
    };
  }


  let earliest = 24;

  let latest = 0;


  lessons.forEach(
    item => {

      const start =
        new Date(
          item.start
        );


      const end =
        item.end
          ? new Date(
              item.end
            )
          : new Date(
              start.getTime() +
              60 * 60 * 1000
            );


      const startDecimal =
        start.getHours() +
        start.getMinutes() / 60;


      const endDecimal =
        end.getHours() +
        end.getMinutes() / 60;


      earliest =
        Math.min(
          earliest,
          startDecimal
        );


      latest =
        Math.max(
          latest,
          endDecimal
        );
    }
  );


  /*
    Give the lessons some breathing
    room above and below.
  */

  let startHour =
    Math.floor(
      earliest
    ) - 1;


  let endHour =
    Math.ceil(
      latest
    ) + 1;


  /*
    Keep a useful minimum daytime
    window so the calendar doesn't
    become tiny with one lesson.
  */

  startHour =
    Math.min(
      startHour,
      12
    );


  endHour =
    Math.max(
      endHour,
      18
    );


  startHour =
    Math.max(
      0,
      startHour
    );


  endHour =
    Math.min(
      24,
      endHour
    );


  return {
    startHour,
    endHour
  };
}


/* ========================================
   WEEK HEADER
======================================== */

function renderWeekHeader() {

  const header =
    document.getElementById(
      "weekHeader"
    );


  header.innerHTML =
    `
      <div class="header-spacer"></div>
    `;


  const today =
    new Date();


  for (
    let index = 0;
    index < 7;
    index++
  ) {

    const date =
      addDays(
        currentWeekStart,
        index
      );


    const element =
      document.createElement(
        "div"
      );


    element.className =
      "day-header";


    if (
      sameDay(
        date,
        today
      )
    ) {

      element.classList.add(
        "today"
      );
    }


    element.innerHTML =
      `
        <div class="day-name">
          ${escapeHTML(
            dayName(date)
          )}
        </div>

        <div class="day-number">
          ${escapeHTML(
            dayNumber(date)
          )}
        </div>
      `;


    header.appendChild(
      element
    );
  }


  const middle =
    addDays(
      currentWeekStart,
      3
    );


  document
    .getElementById(
      "monthLabel"
    )
    .textContent =
      monthYear(
        middle
      );
}


/* ========================================
   CALENDAR GRID
======================================== */

function renderGrid() {

  const range =
    getVisibleRange();


  const totalHours =
    range.endHour -
    range.startHour;


  const calendarHeight =
    totalHours *
    HOUR_HEIGHT;


  const grid =
    document.getElementById(
      "calendarGrid"
    );


  grid.innerHTML =
    `
      <div
        class="time-column"
        id="timeColumn"
        style="height:${calendarHeight}px"
      >
      </div>
    `;


  const timeColumn =
    document.getElementById(
      "timeColumn"
    );


  for (
    let hour = range.startHour;
    hour <= range.endHour;
    hour++
  ) {

    const label =
      document.createElement(
        "div"
      );


    label.className =
      "time-label";


    label.style.top =
      (
        (hour - range.startHour) *
        HOUR_HEIGHT
      ) +
      "px";


    label.textContent =
      formatHour(hour);


    timeColumn.appendChild(
      label
    );
  }


  const today =
    new Date();


  for (
    let dayIndex = 0;
    dayIndex < 7;
    dayIndex++
  ) {

    const date =
      addDays(
        currentWeekStart,
        dayIndex
      );


    const column =
      document.createElement(
        "div"
      );


    column.className =
      "day-column";


    column.dataset.day =
      dayIndex;


    column.style.height =
      calendarHeight +
      "px";


    if (
      sameDay(
        date,
        today
      )
    ) {

      column.classList.add(
        "today"
      );
    }


    for (
      let hour = range.startHour;
      hour <= range.endHour;
      hour++
    ) {

      const line =
        document.createElement(
          "div"
        );


      line.className =
        "hour-line";


      line.style.top =
        (
          (hour - range.startHour) *
          HOUR_HEIGHT
        ) +
        "px";


      column.appendChild(
        line
      );
    }


    grid.appendChild(
      column
    );
  }


  renderLessons(
    range
  );
}


/* ========================================
   RENDER LESSONS
======================================== */

function renderLessons(range) {

  const columns =
    document.querySelectorAll(
      ".day-column"
    );


  const lessons =
    currentWeekLessons();


  lessons.forEach(
    item => {

      const start =
        new Date(
          item.start
        );


      const end =
        item.end
          ? new Date(
              item.end
            )
          : new Date(
              start.getTime() +
              60 * 60 * 1000
            );


      let dayIndex = -1;


      for (
        let index = 0;
        index < 7;
        index++
      ) {

        const day =
          addDays(
            currentWeekStart,
            index
          );


        if (
          sameDay(
            start,
            day
          )
        ) {

          dayIndex =
            index;

          break;
        }
      }


      if (
        dayIndex === -1
      ) {
        return;
      }


      const startDecimal =
        start.getHours() +
        start.getMinutes() / 60;


      const endDecimal =
        end.getHours() +
        end.getMinutes() / 60;


      const top =
        (
          startDecimal -
          range.startHour
        ) *
        HOUR_HEIGHT;


      const duration =
        Math.max(
          0.5,
          endDecimal -
          startDecimal
        );


      const height =
        Math.max(
          38,
          duration *
          HOUR_HEIGHT -
          3
        );


      const info =
        parseLesson(
          item
        );


      const lesson =
        document.createElement(
          "div"
        );


      lesson.className =
        "lesson";


      lesson.style.top =
        top +
        "px";


      lesson.style.height =
        height +
        "px";


      lesson.style.background =
        colorForStudent(
          info.student
        );


      lesson.innerHTML =
        `
          <div class="lesson-name">
            ${escapeHTML(
              info.student
            )}
          </div>

          <div class="lesson-time">
            ${escapeHTML(
              formatTime(start)
            )}
            –
            ${escapeHTML(
              formatTime(end)
            )}
          </div>

          ${
            info.subject
              ? `
                <div class="lesson-subject">
                  ${escapeHTML(
                    info.subject
                  )}
                </div>
              `
              : ""
          }
        `;


      columns[
        dayIndex
      ]
        .appendChild(
          lesson
        );
    }
  );
}


/* ========================================
   UPCOMING LESSONS
======================================== */

function renderUpcoming() {

  const container =
    document.getElementById(
      "upcomingLessons"
    );


  const now =
    new Date();


  const upcoming =
    tutoringLessons

      .filter(
        item => {

          if (!item.start) {
            return false;
          }


          const date =
            new Date(
              item.start
            );


          return (
            !Number.isNaN(
              date.getTime()
            ) &&
            date >= now
          );
        }
      )

      .sort(
        (a, b) =>
          new Date(a.start) -
          new Date(b.start)
      )

      .slice(
        0,
        4
      );


  if (
    !upcoming.length
  ) {

    container.className =
      "empty";


    container.textContent =
      "No upcoming lessons";


    return;
  }


  container.className = "";


  container.innerHTML =
    upcoming
      .map(
        item => {

          const start =
            new Date(
              item.start
            );


          const info =
            parseLesson(
              item
            );


          return `
            <div class="list-item">

              <div class="date-box">

                <div class="date-month">
                  ${escapeHTML(
                    shortMonth(start)
                  )}
                </div>

                <div class="date-day">
                  ${escapeHTML(
                    dayNumber(start)
                  )}
                </div>

              </div>


              <div class="list-content">

                <div class="list-title">
                  ${escapeHTML(
                    info.student
                  )}
                </div>

                <div class="list-meta">

                  ${escapeHTML(
                    formatTime(start)
                  )}

                  ${
                    info.subject
                      ? " · " +
                        escapeHTML(
                          info.subject
                        )
                      : ""
                  }

                </div>

              </div>


              <div class="chevron">
                ›
              </div>

            </div>
          `;
        }
      )
      .join("");
}


/* ========================================
   DEADLINES
======================================== */

function renderDeadlines() {

  const container =
    document.getElementById(
      "deadlines"
    );


  if (
    !deadlines.length
  ) {

    container.innerHTML =
      `
        <div class="empty">
          No upcoming deadlines
        </div>
      `;

    return;
  }


  const now =
    new Date();


  const future =
    deadlines

      .filter(
        item => {

          const value =
            item.due ||
            item.date ||
            item.start;


          if (!value) {
            return false;
          }


          const date =
            new Date(value);


          return (
            !Number.isNaN(
              date.getTime()
            ) &&
            date >= now
          );
        }
      )

      .sort(
        (a, b) =>
          new Date(
            a.due ||
            a.date ||
            a.start
          ) -
          new Date(
            b.due ||
            b.date ||
            b.start
          )
      )

      .slice(
        0,
        4
      );


  if (
    !future.length
  ) {

    container.innerHTML =
      `
        <div class="empty">
          No upcoming deadlines
        </div>
      `;

    return;
  }


  container.innerHTML =
    future
      .map(
        item => {

          const date =
            new Date(
              item.due ||
              item.date ||
              item.start
            );


          const title =
            item.title ||
            item.name ||
            "Deadline";


          return `
            <div class="list-item">

              <div class="date-box">

                <div class="date-month">
                  ${escapeHTML(
                    shortMonth(date)
                  )}
                </div>

                <div class="date-day">
                  ${escapeHTML(
                    dayNumber(date)
                  )}
                </div>

              </div>


              <div class="list-content">

                <div class="list-title">
                  ${escapeHTML(
                    title
                  )}
                </div>

                <div class="list-meta">
                  Upcoming deadline
                </div>

              </div>


              <div class="chevron">
                ›
              </div>

            </div>
          `;
        }
      )
      .join("");
}


/* ========================================
   FULL CALENDAR RENDER
======================================== */

function renderCalendar() {

  renderWeekHeader();

  renderGrid();
}


/* ========================================
   FETCH DATA
======================================== */

async function loadData() {

  try {

    const response =
      await fetch(
        API_URL,
        {
          cache:
            "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Unable to load data"
      );
    }


    const data =
      await response.json();


    tutoringLessons =
      Array.isArray(
        data.tutoring
      )
        ? data.tutoring
        : [];


    deadlines =
      Array.isArray(
        data.deadlines
      )
        ? data.deadlines
        : [];


    renderCalendar();

    renderUpcoming();

    renderDeadlines();


  } catch (error) {

    console.error(
      error
    );


    document
      .getElementById(
        "upcomingLessons"
      )
      .innerHTML =
        `
          <div class="empty">
            Unable to load lessons
          </div>
        `;
  }
}
