<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Students</title>
<style>
:root{--ink:#37352F;--muted:#8F8B84;--line:#DDDAD5;--soft:#F7F6F3;--green:#8BAF98;--greenSoft:#E8EFE9}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:0}
.toolbar{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;padding-top:4px}
.filters,.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tools{width:100%;padding-right:4px}
.search{flex:1}
.new{margin-left:auto;min-width:142px}
button,.search,input,select{font:inherit}
.filter,.new,.modal button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;color:var(--ink);cursor:pointer}
.filter.active{background:var(--soft);font-weight:650}
.search{border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-width:230px;color:var(--ink)}
.new,.save{background:#6F786E!important;color:#fff!important;border-color:#6F786E!important;font-weight:650}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:13px;padding:16px;background:#fff;min-width:0}
.head{display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#F0ECE8;font-family:Georgia,serif;font-size:22px;color:#6F6A63;flex:0 0 auto}
.name{font-family:Georgia,serif;font-size:20px;font-weight:600}
.meta,.nexttext,.empty{font-size:12px;color:var(--muted);margin-top:4px}
.status{display:inline-block;margin-top:8px;padding:4px 9px;border-radius:999px;background:var(--greenSoft);font-size:12px}
.prow{display:flex;justify-content:space-between;margin-top:18px;font-size:12px}
.track{height:8px;background:#EEEDEB;border-radius:99px;overflow:hidden;margin-top:7px}
.fill{height:100%;background:var(--green)}
.next{margin-top:17px}.label{font-size:12px;font-weight:650}
.open{display:flex;justify-content:space-between;margin-top:14px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);text-decoration:none;font-size:13px;background:#FAF9F7}
.cardActions{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.deleteBtn{margin-top:14px;border:1px solid #E7C9C6;background:#FFF9F8;color:#A24C4C;border-radius:9px;padding:10px 12px;cursor:pointer;font-size:13px}
.groupTitle{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 -3px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(55,53,47,.18);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.overlay.show{display:flex}
.modal{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 12px 40px rgba(55,53,47,.12)}
.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modalTitle{font-family:Georgia,serif;font-size:23px;font-weight:600}
.close{border:0!important;background:transparent!important;font-size:22px;padding:3px 7px!important;color:var(--muted)!important}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:650}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}
.field input:focus,.field select:focus{border-color:#A9A59E}
.hint{font-size:11px;color:var(--muted)}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}
.message{font-size:12px;margin-top:12px;min-height:16px}.error{color:#A24C4C}.success{color:#5F806A}
button:disabled{opacity:.55;cursor:default}

@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.toolbar{flex-direction:column}.grid{grid-template-columns:1fr}.search{min-width:0;flex:1}.formGrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>

<div class="toolbar">
  <div class="filters">
    <button class="filter active" data-f="all">All Students</button>
    <button class="filter" data-f="Active">Active</button>
    <button class="filter" data-f="Inactive">Inactive</button>
    <button class="filter" data-f="subject">By Subject</button>
    <button class="filter" data-f="grade">By Grade</button>
  </div>
  <div class="tools">
    <input id="search" class="search" placeholder="Search students…">
    <button class="new" id="newStudent">+ New Student</button>
  </div>
</div>

<div id="grid" class="grid"><span class="empty">Loading students…</span></div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modalHead">
      <div class="modalTitle" id="modalTitle">Add New Student</div>
      <button class="close" id="closeModal" aria-label="Close">×</button>
    </div>

    <form id="studentForm">
      <div class="formGrid">
        <div class="field full">
          <label for="studentName">Student Name</label>
          <input id="studentName" required autocomplete="off" placeholder="e.g. Gabriella Darby">
        </div>

        <div class="field">
          <label for="grade">Grade</label>
          <input id="grade" autocomplete="off" placeholder="e.g. 12">
        </div>

        <div class="field">
          <label for="status">Status</label>
          <select id="status">
            <option value="Active" selected>Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <div class="field full">
          <label for="subjects">Subject</label>
          <input id="subjects" autocomplete="off" placeholder="e.g. Biology">
          <div class="hint">For more than one subject, separate them with commas.</div>
        </div>

        <div class="field full">
          <label for="googleChat">Google Chat</label>
          <input id="googleChat" type="url" autocomplete="off" placeholder="Optional URL">
        </div>
      </div>

      <div id="formMessage" class="message"></div>
      <div class="actions">
        <button type="button" id="cancel">Cancel</button>
        <button class="save" id="saveStudent" type="submit">Add Student</button>
      </div>
    </form>
  </div>
</div>

<script>
const API="https://notion-calendar-api.nourmohsen12223.workers.dev";
let students=[],topics=[],lessons=[],filter="all";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function get(p){const r=await fetch(API+p,{cache:"no-store"}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
async function post(p,body){const r=await fetch(API+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
async function del(p,body){const id=body?.studentId||"";const u=id?`${API}${p}?studentId=${encodeURIComponent(id)}`:`${API}${p}`;const r=await fetch(u,{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||"Request failed");return d}
document.getElementById("grid").addEventListener("click",async e=>{
  const b=e.target.closest("[data-delete-student]");
  if(!b)return;
  const id=b.dataset.deleteStudent,name=b.dataset.studentName||"this student";
  if(!confirm(`Delete ${name}? This will archive the student in Notion.`))return;
  b.disabled=true;
  try{await del("/tutoring-students-create",{studentId:id});await load()}
  catch(err){alert("Could not delete student: "+err.message);b.disabled=false}
});
function progress(id){const x=topics.filter(t=>t.studentPageId===id);return x.length?Math.round(x.filter(t=>t.completed).length/x.length*100):0}
function nextLesson(id){return lessons.filter(l=>l.studentPageId===id&&new Date(l.start)>new Date()).sort((a,b)=>new Date(a.start)-new Date(b.start))[0]}
function fmt(x){return new Date(x).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}
function gradeLabel(g){const v=String(g||"").trim();return v?/^grade\b/i.test(v)?v:"Grade "+v:""}

function card(s){
  const pct=progress(s.id),n=nextLesson(s.id);
  const url=s.notionUrl||("https://www.notion.so/"+String(s.id||"").replace(/-/g,""));
  return `<div class="card">
    <div class="head">
      <div class="avatar">${esc((s.name||"?").trim().charAt(0).toUpperCase())}</div>
      <div>
        <div class="name">${esc(s.name||"Student")}</div>
        <div class="meta">${esc(gradeLabel(s.grade))}${s.grade&&(s.subjects||[]).length?" · ":""}${esc((s.subjects||[]).join(", "))}</div>
        <span class="status">${esc(s.status||"—")}</span>
      </div>
    </div>
    <div class="prow"><span>Study Plan Progress</span><span>${pct}%</span></div>
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div class="next"><div class="label">Next Lesson</div><div class="nexttext">${n?esc(fmt(n.start))+" · "+esc(n.subject||n.title||"Lesson"):"Not scheduled"}</div></div>
    <div class="cardActions">
      <a class="open" href="${esc(url)}" target="_top"><span>View Student</span><span>→</span></a>
      <button class="deleteBtn" type="button" data-delete-student="${esc(s.id)}" data-student-name="${esc(s.name||"Student")}">Delete</button>
    </div>
  </div>`;
}

function filtered(){
  const q=search.value.toLowerCase().trim();
  return students.filter(s=>{
    const statusOK=!["Active","Inactive"].includes(filter)||(s.status||"").toLowerCase()===filter.toLowerCase();
    const text=[s.name,s.grade,...(s.subjects||[])].join(" ").toLowerCase();
    return statusOK&&(!q||text.includes(q));
  });
}

function grouped(list,keyFn){
  const groups={};
  list.forEach(s=>{
    const keys=keyFn(s);
    (keys.length?keys:["Unspecified"]).forEach(k=>(groups[k]??=[]).push(s));
  });
  return Object.keys(groups).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(k=>
    `<div class="groupTitle">${esc(k)}</div>${groups[k].map(card).join("")}`
  ).join("");
}

function render(){
  const list=filtered();
  if(!list.length){grid.innerHTML='<span class="empty">No students found.</span>';return}
  if(filter==="subject") grid.innerHTML=grouped(list,s=>s.subjects||[]);
  else if(filter==="grade") grid.innerHTML=grouped(list,s=>[gradeLabel(s.grade)||"Unspecified"]);
  else grid.innerHTML=list.map(card).join("");
}

async function load(){
  try{
    const [s,l]=await Promise.all([get("/study-plan-embed-students"),get("/tutoring-lessons")]);
    students=s.students||[];lessons=l.lessons||[];
    const rs=await Promise.all(students.map(x=>get("/study-plan-embed?studentPageId="+encodeURIComponent(x.id)).catch(()=>({topics:[]}))));
    topics=rs.flatMap((r,i)=>(r.topics||[]).map(t=>({...t,studentPageId:students[i].id})));
    render();
  }catch(e){grid.innerHTML=`<span class="empty">${esc(e.message)}</span>`}
}

document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");filter=b.dataset.f;render();
});
search.oninput=render;

const overlay=document.getElementById("overlay");
function openModal(){studentForm.reset();status.value="Active";formMessage.textContent="";formMessage.className="message";overlay.classList.add("show");overlay.setAttribute("aria-hidden","false");setTimeout(()=>studentName.focus(),50)}
function closeModal(){overlay.classList.remove("show");overlay.setAttribute("aria-hidden","true")}
newStudent.onclick=openModal;closeModal.onclick=closeModal;cancel.onclick=closeModal;
overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

studentForm.addEventListener("submit",async e=>{
  e.preventDefault();
  const name=studentName.value.trim();
  const gradeValue=grade.value.trim().replace(/^grade\s*/i,"");
  const subjectValues=subjects.value.split(",").map(x=>x.trim()).filter(Boolean);
  const googleChatValue=googleChat.value.trim();
  if(!name)return;

  saveStudent.disabled=true;saveStudent.textContent="Saving…";
  formMessage.textContent="";formMessage.className="message";
  try{
    await post("/tutoring-students-create",{
      name,
      grade:gradeValue,
      subjects:subjectValues,
      status:status.value,
      googleChat:googleChatValue
    });
    formMessage.textContent="Student added successfully.";
    formMessage.className="message success";
    await load();
    setTimeout(closeModal,550);
  }catch(err){
    formMessage.textContent=err.message;
    formMessage.className="message error";
  }finally{
    saveStudent.disabled=false;saveStudent.textContent="Add Student";
  }
});

load();
</script>
</body>
</html>
