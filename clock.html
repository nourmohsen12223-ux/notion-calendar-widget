<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flip Clock</title>

<!-- Condensed font for the small labels -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: transparent;
}

body {
    padding: 8px;
}


/* =====================================================
   CLOCK
===================================================== */

.flip-clock {
    width: 100%;
    max-width: 520px;

    margin: 0 auto;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 4px;
}


/* =====================================================
   CARD
===================================================== */

.flip-card {
    position: relative;

    height: 310px;

    overflow: hidden;

    background: #F3F1ED;

    border: 1px solid #EEECE7;
    border-radius: 22px;

    box-shadow:
        0 2px 10px rgba(55, 53, 47, 0.035);
}


/* =====================================================
   LARGE NUMBER
===================================================== */

.number {
    position: absolute;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding-bottom: 12px;

    color: #96918D;

    font-family: "Anton", sans-serif;

    font-size: clamp(115px, 27vw, 190px);
    font-weight: 400;

    line-height: 1;

    letter-spacing: -5px;

    user-select: none;

    transform-origin: center;
}


/* =====================================================
   MIDDLE FLIP LINE
===================================================== */

.flip-line {
    position: absolute;

    left: 0;
    right: 0;
    top: 50%;

    z-index: 5;

    height: 1px;

    background: rgba(255, 255, 255, 0.52);

    box-shadow:
        0 1px 1px rgba(100, 95, 90, 0.08);

    pointer-events: none;
}


/* =====================================================
   SMALL LABELS
   Matches the narrow reference typography
===================================================== */

.bottom-label {
    position: absolute;

    bottom: 14px;

    z-index: 6;

    color: #6F6B67;

    font-family: "Bebas Neue", sans-serif;

    font-size: 22px;
    font-weight: 400;

    line-height: 1;

    letter-spacing: -0.4px;

    text-transform: uppercase;

    user-select: none;
}


/* AM / PM */

.period {
    left: 13px;
}


/* WEEKDAY */

.weekday {
    right: 13px;
}


/* =====================================================
   FLIP ANIMATION
===================================================== */

.flip-card.flipping .number {
    animation:
        flipNumber 0.48s
        cubic-bezier(.45,.05,.55,.95);
}


@keyframes flipNumber {

    0% {
        transform:
            perspective(700px)
            rotateX(0deg);
    }

    45% {
        transform:
            perspective(700px)
            rotateX(-8deg)
            scaleY(0.97);

        opacity: 0.75;
    }

    55% {
        transform:
            perspective(700px)
            rotateX(8deg)
            scaleY(0.97);

        opacity: 0.75;
    }

    100% {
        transform:
            perspective(700px)
            rotateX(0deg);

        opacity: 1;
    }

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 500px) {

    body {
        padding: 5px;
    }

    .flip-clock {
        gap: 3px;
    }

    .flip-card {
        height: 230px;

        border-radius: 17px;
    }

    .number {
        font-size: clamp(90px, 33vw, 145px);

        letter-spacing: -4px;
    }

    .bottom-label {
        bottom: 11px;

        font-size: 18px;
    }

    .period {
        left: 10px;
    }

    .weekday {
        right: 10px;
    }

}


@media (max-width: 350px) {

    .flip-card {
        height: 190px;
    }

    .number {
        font-size: 92px;
    }

    .bottom-label {
        font-size: 16px;
    }

}

</style>

</head>


<body>


<div class="flip-clock">


    <!-- HOURS -->

    <div
        id="hourCard"
        class="flip-card"
    >

        <div
            id="hours"
            class="number"
        >
            04
        </div>


        <div class="flip-line"></div>


        <div
            id="period"
            class="bottom-label period"
        >
            PM
        </div>

    </div>



    <!-- MINUTES -->

    <div
        id="minuteCard"
        class="flip-card"
    >

        <div
            id="minutes"
            class="number"
        >
            36
        </div>


        <div class="flip-line"></div>


        <div
            id="weekday"
            class="bottom-label weekday"
        >
            TUESDAY
        </div>

    </div>


</div>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const hoursElement =
    document.getElementById("hours");

const minutesElement =
    document.getElementById("minutes");

const periodElement =
    document.getElementById("period");

const weekdayElement =
    document.getElementById("weekday");

const hourCard =
    document.getElementById("hourCard");

const minuteCard =
    document.getElementById("minuteCard");


let previousHour = null;
let previousMinute = null;



/* =====================================================
   FLIP ANIMATION
===================================================== */

function triggerFlip(card) {

    card.classList.remove("flipping");

    void card.offsetWidth;

    card.classList.add("flipping");


    setTimeout(
        () => {

            card.classList.remove("flipping");

        },
        500
    );

}



/* =====================================================
   UPDATE CLOCK
===================================================== */

function updateClock() {

    const now =
        new Date();


    let hours =
        now.getHours();


    const minutes =
        now.getMinutes();


    const period =
        hours >= 12
            ? "PM"
            : "AM";


    /* 12-HOUR CLOCK */

    hours =
        hours % 12;


    if (hours === 0) {

        hours = 12;

    }


    const hourText =
        String(hours).padStart(
            2,
            "0"
        );


    const minuteText =
        String(minutes).padStart(
            2,
            "0"
        );


    /* WEEKDAY */

    const weekday =
        now.toLocaleDateString(
            "en-US",
            {
                weekday: "long"
            }
        ).toUpperCase();


    /* FLIP HOUR */

    if (
        previousHour !== null &&
        previousHour !== hourText
    ) {

        triggerFlip(hourCard);

    }


    /* FLIP MINUTE */

    if (
        previousMinute !== null &&
        previousMinute !== minuteText
    ) {

        triggerFlip(minuteCard);

    }


    hoursElement.textContent =
        hourText;


    minutesElement.textContent =
        minuteText;


    periodElement.textContent =
        period;


    weekdayElement.textContent =
        weekday;


    previousHour =
        hourText;


    previousMinute =
        minuteText;

}



/* =====================================================
   START
===================================================== */

updateClock();


setInterval(
    updateClock,
    1000
);

</script>


</body>

</html>
